<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

function activeEnroll(){return S.data.enrollments.filter(e=>['active','paused'].includes(e.status))}function visibleEnroll(){return S.data.enrollments.filter(e=>['active','paused','pending'].includes(e.status))}function duePayments(){return S.data.payment_requests.filter(p=>['pending','slip_submitted','rejected'].includes(p.status))}function nearFinish(){return activeEnroll().filter(e=>{const c=course(e.course_id);return Math.max(0,n(e.hours_total)-n(e.hours_used))<=n(c?.renewal_alert_hours||3)})}
function dashboard(){const s=S.data.student,active=activeEnroll(),visible=visibleEnroll(),pendingCourses=visible.filter(e=>e.status==='pending'),hasUnlimited=active.some(e=>e.hours_unlimited),remaining=active.reduce((a,e)=>a+(e.hours_unlimited?0:Math.max(0,n(e.hours_total)-n(e.hours_used))),0),newCount=S.data.topics.filter(isNewTopic).length,dueRows=duePayments(),due=dueRows.reduce((a,p)=>a+n(p.amount),0),codes=S.data.codes.slice(0,3),ending=nearFinish();const firstActive=active[0],firstCourse=firstActive?course(firstActive.course_id):null;return `<section class="student-welcome"><div><span class="welcome-kicker">STUDENT EXPERIENCE</span><h2>ยินดีต้อนรับ ${esc(s.nickname||s.first_name||'นักเรียน')} ✨</h2><p>ดูคอร์สที่เปิดอยู่ ชั่วโมงคงเหลือ แผนชำระเงิน การต่อคอร์ส และข้อมูลการสมัครได้จากระบบนักเรียนโฉมใหม่</p><div class="welcome-actions">${firstCourse?`<button class="btn primary" data-open-course="${firstCourse.id}">เรียนต่อ ${esc(firstCourse.title)}</button>`:''}<button class="btn soft" data-go-catalog>สมัคร / ต่อคอร์ส</button></div></div><div class="welcome-id"><small>STUDENT ID</small><strong>${esc(s.student_code||'—')}</strong><span>${esc(s.school||'AreWarin Biology')}</span></div></section><div class="grid metrics"><div class="card metric"><span class="metric-icon">▤</span><small>คอร์สของฉัน</small><strong>${visible.length}</strong><em>${pendingCourses.length?`มี ${pendingCourses.length} คอร์สรอเปิดใช้งาน`:'กำลังเรียน'}</em></div><div class="card metric"><span class="metric-icon">◷</span><small>ชั่วโมงคงเหลือ</small><strong>${hasUnlimited?'∞':remaining.toFixed(1)}</strong><em>${hasUnlimited?'แพ็กเกจรายปี':'ชั่วโมง'}</em></div><div class="card metric"><span class="metric-icon">▶</span><small>บทเรียนใหม่</small><strong>${newCount}</strong><em>รายการ</em></div><div class="card metric ${due?'attention':latestCorePayment()?.status==='paid'?'paid-metric':''}"><span class="metric-icon">฿</span><small>สถานะการชำระเงิน</small><strong>${due?money(due):latestCorePayment()?.status==='paid'?'ชำระแล้ว':'0 ฿'}</strong><em>${dueRows.length?'มีรายการรอตรวจ':latestCorePayment()?.status==='paid'?'Manager ยืนยันแล้ว':'ไม่มีรายการค้าง'}</em></div></div>${ending.length?`<section class="renew-strip"><div><span>ใกล้หมดชั่วโมง</span><b>${ending.length} คอร์สควรเตรียมต่อ</b><p>${ending.slice(0,2).map(e=>`${esc(course(e.course_id)?.title||'คอร์ส')} เหลือ ${Math.max(0,n(e.hours_total)-n(e.hours_used)).toFixed(1)} ชม.`).join(' · ')}</p></div><button class="btn primary" data-go-catalog>จัดการคอร์ส</button></section>`:''}${dueRows.length?`<section class="payment-strip"><div><span>การชำระเงิน</span><b>มี ${dueRows.length} รายการรอดำเนินการ</b><p>เปิดดู QR ส่งสลิป หรือติดตามสถานะการผ่อนชำระได้จากเมนูการชำระเงิน</p></div><button class="btn" data-go-pay>ดูการชำระเงิน</button></section>`:''}${!dueRows.length&&latestCorePayment()?.status==='paid'?`<section class="payment-strip paid-strip"><div><span>PAYMENT VERIFIED</span><b>การชำระเงินได้รับการยืนยันแล้ว</b><p>ยอด ${money(latestCorePayment()?.verified_amount||latestCorePayment()?.amount_submitted||0)} · สถานะคอร์สจะเปิดใช้งานตามข้อมูลจาก Manager</p></div><button class="btn soft" data-go-pay>ดูประวัติการชำระ</button></section>`:''}<div class="grid dashboard-split"><article class="card student-pass"><div class="pass-top"><div><small>DIGITAL STUDENT PASS</small><h2>${esc(full(s))}</h2><p>${esc(s.school||'ไม่ระบุโรงเรียน')} · ${esc(s.education_level||'')}</p></div><div class="pass-mark">A</div></div><div class="pass-bottom"><span>${esc(s.phone||'')}</span><strong>${esc(s.status||'กำลังเรียน')}</strong></div></article><section class="card quick-panel"><div class="section-head"><div><span class="section-kicker">QUICK ACCESS</span><h2>ใช้งานด่วน</h2><p>สิ่งที่ใช้บ่อยในระหว่างเรียน</p></div></div><div class="quick-actions"><button data-tab-jump="courses"><b>▤</b><span>คอร์สของฉัน<small>ดูความคืบหน้า</small></span></button><button data-tab-jump="attendance"><b>✓</b><span>เวลาเรียน<small>เช็กประวัติการเรียน</small></span></button><button data-tab-jump="payments"><b>฿</b><span>การชำระเงิน<small>QR และผ่อนชำระ</small></span></button><button data-go-catalog><b>＋</b><span>สมัคร / ต่อคอร์ส<small>เลือกคอร์สเพิ่ม</small></span></button></div></section></div><section class="section-block"><div class="section-head"><div><span class="section-kicker">MY COURSES</span><h2>เรียนต่อจากคอร์สของฉัน</h2><p>ชั่วโมงและความคืบหน้าจะอัปเดตตามข้อมูลจาก Tutor OS</p></div><button class="btn soft" data-go-catalog>ดูคอร์สที่เปิดรับ</button></div><div class="grid course-grid">${visible.slice(0,3).map(courseCard).join('')||'<div class="card empty">ยังไม่มีคอร์สในบัญชีนี้</div>'}</div></section>${codes.length?`<section class="card codes-panel"><div class="section-head"><div><span class="section-kicker">COURSE ACCESS</span><h2>รหัสคอร์สล่าสุด</h2></div></div><div class="codes-grid">${codes.map(c=>`<div class="code-card"><div class="sub">${esc(course(c.course_id)?.title||'')} · ${esc(c.title)}</div><div class="code-value">${esc(c.code_value)}</div><div class="sub">${esc(c.note||'')}</div></div>`).join('')}</div></section>`:''}`}
function courseCard(e){const c=course(e.course_id);if(!c)return '';const pending=e.status==='pending',pct=courseProgress(c.id),newC=!pending&&topics(c.id).some(isNewTopic),cover=c.cover_url||'',remain=Math.max(0,n(e.hours_total)-n(e.hours_used));return `<article class="card course-card ${pending?'course-pending':''}"><div class="course-cover" style="${cover?`background-image:url('${esc(cover)}')`:''}">${pending?'<span class="new-dot pending-dot">รอเปิดใช้งาน</span>':newC?'<span class="new-dot">มีบทใหม่</span>':''}<div class="course-cover-meta"><span>${pending?'สมัครแล้ว · รอตรวจการชำระ':e.hours_unlimited?'รายปี':`${remain.toFixed(1)} ชม. คงเหลือ`}</span></div><div class="cover-title">${esc(c.title)}</div></div><div class="course-body">${pending?`<div class="pending-course-note"><b>คอร์สนี้อยู่ในบัญชีแล้ว</b><span>ระบบจะเปิดชั่วโมงและบทเรียนหลังการชำระเงินได้รับการยืนยัน</span></div><div class="course-actions"><button class="btn primary" data-go-pay>ดูการชำระเงิน</button><button class="btn soft" data-go-catalog>ดูคอร์สอื่น</button></div>`:`<div class="progress-row"><span>ความคืบหน้า ${pct}%</span><span>${topics(c.id).filter(t=>progress(t.id)?.status==='completed').length}/${topics(c.id).length} บท</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="course-hours">${e.hours_unlimited?'แพ็กเกจรายปี · ไม่จำกัดชั่วโมง':`ใช้แล้ว ${n(e.hours_used).toFixed(1)} · เหลือ ${remain.toFixed(1)} จาก ${n(e.hours_total).toFixed(1)} ชม.`}</div><div class="course-actions"><button class="btn primary" data-open-course="${c.id}">${pct?'เรียนต่อ':'เริ่มเรียน'}</button><button class="btn soft" data-renew="${c.id}">ต่อคอร์ส</button></div>`}</div></article>`}
function coursesHtml(){const rows=visibleEnroll();return `<div class="grid course-grid">${rows.map(courseCard).join('')||'<div class="empty">ยังไม่มีคอร์สในบัญชีนี้</div>'}</div>`}
function learningHtml(){if(S.courseId)return courseLearning(S.courseId);return `<section class="card"><div class="section-head"><div><h2>คอร์สย้อนหลัง</h2><p>เลือกภาพปกคอร์สเพื่อดูรายการบทเรียน</p></div></div><div class="grid course-grid">${activeEnroll().filter(e=>topics(e.course_id).length).map(courseCard).join('')||'<div class="empty">ยังไม่มีคอร์สย้อนหลังที่มอบหมาย</div>'}</div></section>`}
function courseLearning(courseId){const c=course(courseId),ts=topics(courseId);if(!S.lessonId)S.lessonId=ts.find(t=>progress(t.id)?.status!=='completed')?.id||ts[0]?.id;const current=ts.find(t=>String(t.id)===String(S.lessonId))||ts[0];return `<button class="btn small" data-back-learning>← กลับหน้าคอร์ส</button><div class="lesson-layout" style="margin-top:12px"><aside class="card lesson-nav"><div class="section-head"><div><h2>${esc(c.title)}</h2><p>เรียนแล้ว ${courseProgress(courseId)}%</p></div></div><div class="progress"><i style="width:${courseProgress(courseId)}%"></i></div><div style="margin-top:13px">${ts.map((t,i)=>`<article class="lesson-item ${String(t.id)===String(current?.id)?'active':''} ${progress(t.id)?.status==='completed'?'done':''}" data-lesson="${t.id}"><div class="name">${progress(t.id)?.status==='completed'?'✓ ':''}บทที่ ${i+1} · ${esc(t.title)} ${isNewTopic(t)?'<span class="chip amber">ใหม่</span>':''}</div><div class="sub">${assets(t.id).length} สื่อ</div></article>`).join('')||'<div class="empty">ยังไม่มีบทเรียน</div>'}</div></aside><main class="card lesson-player">${current?lessonPlayer(current,ts):'<div class="empty">ยังไม่มีบทเรียน</div>'}</main></div>`}
function youtube(url){const m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);return m?`https://www.youtube.com/embed/${m[1]}`:''}function lessonPlayer(t,ts){const as=assets(t.id),idx=ts.findIndex(x=>x.id===t.id),done=progress(t.id)?.status==='completed';return `<div class="section-head"><div><span class="chip">บทที่ ${idx+1}</span><h2 style="margin-top:8px">${esc(t.title)}</h2><p>${esc(t.description||'')}</p></div>${done?'<span class="chip green">เรียนจบแล้ว</span>':''}</div>${as.map(assetHtml).join('')||'<div class="empty">ยังไม่มีวิดีโอหรือชีท</div>'}<div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px"><button class="btn" data-prev ${idx<=0?'disabled':''}>← บทก่อนหน้า</button><button class="btn ${done?'success':'primary'}" data-complete="${t.id}">${done?'เรียนจบแล้ว':'มาร์คว่าเรียนจบ'}</button><button class="btn" data-next ${idx>=ts.length-1?'disabled':''}>บทถัดไป →</button></div>`}
function assetHtml(a){if(a.asset_type==='youtube'){const u=youtube(a.url);return `<article class="asset"><div class="asset-head"><div><div class="name">${esc(a.title)}</div><div class="sub">YouTube · ${esc(a.description||'')}</div></div></div>${u?`<div class="video-frame"><iframe src="${esc(u)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`:`<a class="btn small primary" href="${esc(a.url)}" target="_blank" rel="noopener">เปิด YouTube</a>`}</article>`}if(a.asset_type==='external_video')return `<article class="asset"><div class="name">${esc(a.title)}</div><div class="sub">${esc(a.description||'')}</div><a class="btn small primary" target="_blank" rel="noopener" href="${esc(a.url)}">เปิดวิดีโอ</a></article>`;if(a.asset_type==='external_link')return `<article class="asset"><div class="name">${esc(a.title)}</div><a class="btn small primary" target="_blank" rel="noopener" href="${esc(a.url)}">เปิดลิงก์</a></article>`;const signed=S.signed[a.id];if(a.asset_type==='video_upload')return `<article class="asset"><div class="name">${esc(a.title)}</div>${signed?`<div class="video-frame"><video controls preload="metadata" src="${esc(signed)}"></video></div>`:`<button class="btn small primary" data-load-asset="${a.id}">โหลดวิดีโอ</button>`}</article>`;return `<article class="asset"><div class="name">${esc(a.title)}</div><div class="sub">${esc(a.description||'ชีท/เอกสาร')}</div>${signed?`<a class="btn small primary" target="_blank" rel="noopener" href="${esc(signed)}">เปิดชีท</a>`:`<button class="btn small" data-load-asset="${a.id}">เปิดชีท</button>`}</article>`}
function attendanceHtml(){const ledger=S.data.hour_ledger||[],groups=S.data.groups||[];const netUsed=ledger.reduce((a,x)=>a+n(x.hours_delta),0);return `<div class="grid metrics" style="margin-bottom:16px"><div class="card metric"><small>ชั่วโมงที่ใช้สุทธิ</small><strong>${Math.max(0,netUsed).toFixed(1)}</strong></div><div class="card metric"><small>รายการ Hour Ledger</small><strong>${ledger.length}</strong></div><div class="card metric"><small>กลุ่มเรียน</small><strong>${groups.length}</strong></div><div class="card metric"><small>Realtime</small><strong>ON</strong></div></div>${groups.length?`<section class="card" style="margin-bottom:16px"><div class="section-head"><div><h2>กลุ่มเรียนของฉัน</h2><p>Group Locker ใช้สำหรับจัดรายชื่อผู้สอนเท่านั้น ชั่วโมงยังคิดแยกเป็นรายบุคคล</p></div></div>${groups.map(g=>`<span class="group-inline">👥 ${esc(g.group_code)} · ${esc(g.name)}</span>`).join('')}</section>`:''}<section class="card"><div class="section-head"><div><h2>ประวัติการเข้าเรียน</h2><p>อัปเดตจาก Tutor OS แบบเรียลไทม์ รวมการตัดชั่วโมงรายคน</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>คอร์ส/คาบ</th><th>สถานะ</th><th>ตัดชม.</th><th>หมายเหตุ</th></tr></thead><tbody>${S.data.attendance.map(a=>{const ss=S.data.sessions.find(x=>x.id===a.session_id),g=groups.find(x=>String(x.id)===String(ss?.group_id));return `<tr><td>${date(ss?.session_date||a.created_at)}</td><td><div class="name">${esc(ss?.title||'คาบเรียน')}</div><div class="sub">${esc(course(ss?.course_id)?.title||'')}${g?' · '+esc(g.group_code):''}</div></td><td><span class="chip ${a.status==='present'?'green':a.status==='late'?'amber':'gray'}">${statusThai(a.status)}</span></td><td><b>${n(a.deducted_hours).toFixed(2)}</b> ชม.</td><td>${esc(a.note||'—')}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div></section>`}
function paymentStatus(p){const expired=new Date(p.expires_at)<=new Date()&&p.status==='pending';return expired?'expired':p.status}function paymentsHtml(){const rows=S.data.payment_requests.filter(p=>!['cancelled'].includes(p.status)),pending=rows.filter(p=>['pending','slip_submitted','rejected'].includes(paymentStatus(p))),paid=rows.filter(p=>paymentStatus(p)==='paid'),core=S.data.core_payments||[],latest=core[0];return `<section class="payment-overview"><div><span class="section-kicker">PAYMENT CENTER</span><h2>การชำระเงินและแผนผ่อน</h2><p>ข้อมูลยืนยันจาก Manager และระบบสมัครเรียนจะแสดงในหน้านี้อัตโนมัติ</p></div><div class="payment-summary"><div><small>รอดำเนินการ</small><b>${pending.length}</b></div><div><small>ชำระแล้ว</small><b>${paid.length+(latest?.status==='paid'&&paid.length===0?1:0)}</b></div><button class="btn primary" id="open-installment-plan">ดูแผนผ่อน / แบ่งชำระ</button></div></section>${latest?`<section class="core-payment-card ${latest.status==='paid'?'is-paid':''}"><div><span>${latest.status==='paid'?'✓ ยืนยันแล้ว':'สถานะจากระบบสมัครเรียน'}</span><h3>${esc(latest.course_text||'ค่าคอร์ส AreWarin Biology')}</h3><p>${latest.status==='paid'?'Manager ตรวจสอบการชำระเงินเรียบร้อยแล้ว':'อยู่ระหว่างการตรวจสอบจาก Manager'}</p></div><div><small>ยอด</small><b>${money(latest.verified_amount||latest.amount_submitted||0)}</b><em>${statusThai(latest.status)}</em></div></section>`:''}<div class="grid payment-grid">${rows.map(p=>paymentCard(p)).join('')||(!latest?'<div class="card empty">ยังไม่มีรายการชำระเงิน</div>':'')}</div>`}function paymentCard(p){const st=paymentStatus(p),sub=S.data.payment_submissions.find(x=>x.payment_request_id===p.id&&x.status==='pending');return `<article class="card payment-card"><div class="section-head"><div><span class="chip ${st==='paid'?'green':st==='rejected'?'amber':'gray'}">${statusThai(st)}</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${esc(p.note||'')}</p></div><strong>${money(p.amount)}</strong></div>${['pending','expired','rejected'].includes(st)?`<div class="qr-wrap"><canvas data-qr="${p.id}"></canvas><div class="countdown" data-countdown="${p.id}">--:--</div><div class="sub">PromptPay ${CONFIG.promptpay}<br>${esc(CONFIG.payee)}</div></div><div class="message">QR และคำขอในระบบมีอายุ 15 นาที หากหมดเวลาให้สร้างใหม่</div>${st==='expired'||st==='rejected'?`<button class="btn warn wide" data-refresh-payment="${p.id}">สร้าง QR ใหม่ 15 นาที</button>`:`<button class="btn primary wide" data-upload-slip="${p.id}">อัปโหลดสลิปและยืนยัน</button>`}`:sub?'<div class="message">ส่งสลิปแล้ว รอแอดมินตรวจสอบ</div>':st==='paid'?'<div class="message success">ยืนยันการชำระเงินเรียบร้อยแล้ว</div>':'<div class="message">กำลังตรวจสอบรายการ</div>'}</article>`}
function catalogHtml(){const current=visibleEnroll(),active=activeEnroll(),owned=new Set(current.map(e=>String(e.course_id))),open=S.data.open_courses||[];const renewCards=active.map(e=>{const c=course(e.course_id);if(!c)return '';const remain=e.hours_unlimited?null:Math.max(0,n(e.hours_total)-n(e.hours_used));return `<article class="renew-course-card"><div><span class="renew-label">คอร์สปัจจุบัน</span><h3>${esc(c.title)}</h3><p>${e.hours_unlimited?'แพ็กเกจรายปี':`เหลือ ${remain.toFixed(1)} จาก ${n(e.hours_total).toFixed(1)} ชั่วโมง`}</p></div><button class="btn primary" data-enroll="${c.id}:renewal">ต่อคอร์สนี้</button></article>`}).join('');return `<section class="course-center-hero"><div><span class="welcome-kicker">COURSE CENTER</span><h2>สมัครเพิ่ม หรือต่อคอร์สเดิม</h2><p>เลือกคอร์สที่ต้องการ ระบบจะเชื่อมข้อมูลนักเรียนเดิมกลับไปยังหน้าสมัครเรียนหลัก เพื่อให้ตรวจรายละเอียด แพ็กเกจ ตาราง และราคาอีกครั้งก่อนยืนยัน</p></div><a class="btn soft" href="../">ดูหน้าสมัครเรียนหลัก</a></section>${active.length?`<section class="section-block"><div class="section-head"><div><span class="section-kicker">RENEW</span><h2>ต่อคอร์สเดิม</h2><p>ต่อชั่วโมงหรือแพ็กเกจของคอร์สที่กำลังเรียน</p></div></div><div class="renew-course-grid">${renewCards}</div></section>`:''}<section class="section-block"><div class="section-head"><div><span class="section-kicker">ENROLL</span><h2>คอร์สที่เปิดรับสมัคร</h2><p>คอร์สที่เปิดจากระบบกลางจะปรากฏที่นี่โดยอัตโนมัติ</p></div></div><div class="grid course-grid">${open.map(c=>{const cover=c.cover_url||'',own=owned.has(String(c.id));return `<article class="card course-card catalog-card"><div class="course-cover" style="${cover?`background-image:url('${esc(cover)}')`:''}"><span class="catalog-status ${own?'renew':'new'}">${own?'เรียนอยู่แล้ว':'เปิดรับสมัคร'}</span><div class="cover-title">${esc(c.title)}</div></div><div class="course-body"><div class="course-tags"><span>${n(c.hours)} ชม.</span><strong>${money(c.price)}</strong></div><p class="course-desc function notifyRow(x){return `<article class="notify ${x.is_read?'':'unread'}"><div class="name">${esc(x.title)}</div><div class="sub">${esc(x.body||'')} · ${date(x.created_at)}</div>${x.is_read?'':`<button class="btn small" data-read="${x.id}" style="margin-top:7px">อ่านแล้ว</button>`}</article>`}function notificationsHtml(){return `<section class="card"><div class="section-head"><div><h2>การแจ้งเตือน</h2><p>บทเรียนใหม่ รหัสคอร์ส ยอดชำระ และผลอนุมัติ</p></div></div>${S.data.notifications.map(notifyRow).join('')||'<div class="empty">ไม่มีแจ้งเตือน</div>'}</section>`}
function profileHtml(){const s=S.data.student,a=appProfile(),pay=latestCorePayment();const realName=full(s)||a.fullname||'นักเรียน';return `<section class="profile-hero card"><div class="profile-identity"><div class="profile-avatar">${esc((s.nickname||s.first_name||realName||'A').slice(0,1))}</div><div><span class="section-kicker">STUDENT PROFILE</span><h2>${esc(realName)}</h2><p>${esc(s.student_code||'')} · ${esc(a.course_text||s.course_summary||'AreWarin Biology')}</p></div></div><div class="profile-status ${pay?.status==='paid'?'is-paid':''}"><small>การชำระเงินล่าสุด</small><b>${pay?.status==='paid'?'ชำระแล้ว':statusThai(pay?.status||'pending')}</b></div></section><div class="profile-layout"><section class="card application-summary"><div class="section-head"><div><span class="section-kicker">APPLICATION DATA</span><h2>ข้อมูลจากใบสมัครเรียน</h2><p>ข้อมูลชุดเดียวกับระบบสมัครเรียนหลักและ Manager</p></div></div><div class="profile-read-grid"><div><small>ชื่อ-นามสกุล</small><b>${esc(a.fullname||realName)}</b></div><div><small>ชื่อเล่น</small><b>${esc(a.nickname||s.nickname||'—')}</b></div><div><small>เบอร์โทร</small><b>${esc(a.phone||s.phone||'—')}</b></div><div><small>อีเมล</small><b>${esc(a.email||s.email||'—')}</b></div><div><small>LINE ID</small><b>${esc(a.line_id||s.line_id||'—')}</b></div><div><small>โรงเรียน / สถาบัน</small><b>${esc(a.school||s.school||'—')}</b></div><div><small>ระดับชั้น</small><b>${esc(a.grade||s.grade||'—')}</b></div><div><small>คณะ</small><b>${esc(a.faculty||s.faculty||'—')}</b></div><div><small>จังหวัด</small><b>${esc(a.province||s.province||'—')}</b></div><div><small>รูปแบบเรียน</small><b>${esc(a.study_type||s.study_type||'—')}</b></div><div class="wide"><small>คอร์สจากใบสมัครล่าสุด</small><b>${esc(a.course_text||s.course_summary||'—')}</b></div><div class="wide"><small>ผู้ปกครอง</small><b>${esc(a.parent_name||s.guardian_name||'—')} · ${esc(a.parent_relation||s.guardian_relationship||'')} · ${esc(a.parent_phone||s.guardian_phone||'')}</b> ></div><div class="field"><label>LINE ผู้ปกครอง</label><input class="input" name="guardian_line" value="${esc(s.guardian_line||'')}"></div></div><button class="btn primary">บันทึกข้อมูล</button></form></section></div>`}

function render(){clearInterval(S.timer);const map={dashboard,courses:coursesHtml,learning:learningHtml,attendance:attendanceHtml,payments:paymentsHtml,catalog:catalogHtml,notifications:notificationsHtml,profile:profileHtml};app.innerHTML=shell((map[S.tab]||dashboard)());bindPortal();renderQrs();startCountdowns()}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',n(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}function renderQrs(){$$('[data-qr]').forEach(c=>{const p=S.data.payment_requests.find(x=>x.id===c.dataset.qr);if(p&&window.QRCode)QRCode.toCanvas(c,promptpayPayload(p.promptpay_id||CONFIG.promptpay,p.amount),{width:220,margin:1,errorCorrectionLevel:'M'}).catch(()=>{})})}function startCountdowns(){const tick=()=>$$('[data-countdown]').forEach(el=>{const p=S.data.payment_requests.find(x=>x.id===el.dataset.countdown),ms=new Date(p.expires_at)-new Date();if(ms<=0){el.textContent='00:00';return}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});tick();S.timer=setInterval(tick,1000)}
function showModal(title,body,actions=''){modal.classList.remove('hidden');modal.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="btn small" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions||'<button class="btn" data-close>ปิด</button>'}</div></div>`;$$('[data-close]',modal).forEach(b=>b.onclick=()=>modal.classList.add('hidden'))}
async function openLesson(id){S.lessonId=String(id);try{const p=await rpc('student_v8_open_lesson',{p_topic_id:String(id)}),i=S.data.progress.findIndex(x=>String(x.topic_id)===String(id));if(i>=0)S.data.progress[i]=p;else S.data.progress.push(p)}catch(e){toast(e.message,true)}render()}async function completeLesson(id){try{const p=await rpc('student_v8_complete_lesson',{p_topic_id:String(id)}),i=S.data.progress.findIndex(x=>String(x.topic_id)===String(id));if(i>=0)S.data.progress[i]=p;else S.data.progress.push(p);toast('บันทึกว่าเรียนจบแล้ว');const ts=topics(S.courseId),idx=ts.findIndex(t=>String(t.id)===String(id));if(idx<ts.length-1)S.lessonId=ts[idx+1].id;render()}catch(e){toast(e.message,true)}}async function loadAsset(id){const a=S.data.assets.find(x=>String(x.id)===String(id));try{const {data,error}=await sb.storage.from(a.bucket||'tutor-os-assets').createSignedUrl(a.storage_path,3600);if(error)throw error;S.signed[id]=data.signedUrl;render()}catch(e){toast(e.message,true)}}
function uploadSlip(id){const p=S.data.payment_requests.find(x=>x.id===id);showModal('อัปโหลดสลิป',`<form id="slip"><div class="message">${esc(p.title)} · ${money(p.amount)}</div><div class="field"><label>ไฟล์สลิป</label><input class="input" type="file" name="file" accept="image/*,application/pdf" required></div><div class="field"><label>หมายเหตุ</label><textarea class="textarea" name="note"></textarea></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="send-slip">อัปโหลดและยืนยัน</button>`);$('#send-slip').onclick=async()=>{const f=$('#slip'),file=f.file.files[0];if(!file)return toast('กรุณาเลือกสลิป',true);const path=`${S.session.user.id}/${id}/${Date.now()}-${file.name.replace(/[^\w.ก-๙-]+/g,'-')}`;try{const {error}=await sb.storage.from('portal-slips').upload(path,file,{contentType:file.type||undefined});if(error)throw error;await rpc('student_v8_submit_slip',{p_payment_request_id:id,p_storage_path:path,p_original_filename:file.name,p_amount:p.amount,p_note:new FormData(f).get('note')||''});modal.classList.add('hidden');toast('ส่งสลิปแล้ว รอแอดมินตรวจ');await load()}catch(e){await sb.storage.from('portal-slips').remove([path]);toast(e.message,true)}}}

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',pn(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}

function pstatus(i){return({pending:'รอชำระ',partial:'ชำระบางส่วน',paid:'ชำระครบ',overdue:'เลยกำหนด',cancelled:'ยกเลิก'})[i.status]||i.status}
function renderPay(){const plans=P.data?.plans||[];payLayer.innerHTML=`<div class="awv9p-panel"><div class="awv9p-head"><div><h2>แผนแบ่งชำระและผ่อนจ่าย</h2><div style="font-size:11px;color:#d9def7">PromptPay 1901001151577 · AreWarin Biology</div></div><div><button class="awv9p-btn" data-p-refresh>รีเฟรช</button> <button class="awv9p-btn danger" data-p-close>ปิด</button></div></div><div class="awv9p-body"><div class="awv9p-message">เลือกชำระเต็มงวดหรือใส่ยอดบางส่วน ระบบจะสร้าง QR ที่มีอายุ 15 นาที แล้วอัปโหลดสลิปให้แอดมินตรวจสอบ</div>${plans.length?`<div class="awv9p-grid">${plans.map(planCard).join('')}</div>`:'<div class="awv9p-empty">ยังไม่มีแผนแบ่งชำระ</div>'}${(P.data.teaching_notes||[]).length?`<div class="awv9p-card" style="margin-top:14px"><h3 style="margin-top:0">บันทึกจากผู้สอน</h3>${P.data.teaching_notes.slice(0,20).map(x=>`<div style="padding:11px;border:1px solid #e6eaf3;border-radius:13px;margin-top:8px"><b>${pe(x.topic||'บันทึกหลังเรียน')}</b><div style="font-size:10px;color:#8993a9">${pdate(x.lesson_date)}</div><div style="margin-top:6px">${pe(x.lesson_summary||'')}</div>${x.homework?`<div class="awv9p-message" style="margin-top:8px;margin-bottom:0"><b>การบ้าน:</b> ${pe(x.homework)}</div>`:''}</div>`).join('')}</div>`:''}</div></div>`;bindPay();renderPqrs();startPtimer()}
function planCard(p){const pct=p.total_amount?Math.min(100,Math.round(pn(p.amount_paid)/pn(p.total_amount)*100)):0;return `<article class="awv9p-card"><div class="awv9p-row"><div><span class="awv9p-chip ${p.status==='paid'?'green':'amber'}">${p.status==='paid'?'ชำระครบ':'กำลังผ่อน'}</span><h3 style="margin:8px 0 3px">${pe(p.title)}</h3></div><b>${pmoney(p.balance_amount)}<div style="font-size:10px;color:#8993a9">คงเหลือ</div></b></div><div class="awv9p-row" style="font-size:11px;color:#77819b"><span>ยอดรวม ${pmoney(p.total_amount)}</span><span>รับแล้ว ${pmoney(p.amount_paid)}</span></div><div class="awv9p-progress"><i style="width:${pct}%"></i></div>${insts(p).map(installmentCard).join('')}</article>`}
function installmentCard(i){const balance=Math.max(0,pn(i.amount_due)-pn(i.amount_paid)),req=activeReq(i),sub=subFor(req);return `<div class="awv9p-inst"><b>${i.installment_no}</b><div><div>งวดที่ ${i.installment_no} · ${pdate(i.due_date)}</div><div style="font-size:10px;color:#8993a9">${pmoney(i.amount_paid)} / ${pmoney(i.amount_due)}</div></div><div><span class="awv9p-chip ${i.status==='paid'?'green':i.status==='partial'?'amber':i.status==='overdue'?'red':''}">${pstatus(i)}</span></div>${balance>0&&!req?`<div style="grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px"><input class="awv9p-input" type="number" step="0.01" min="0.01" max="${balance}" id="pay-amount-${i.id}" value="${balance}"><button class="awv9p-btn primary" data-create-qr="${i.id}">สร้าง QR</button></div>`:''}${req?requestCard(req,sub):''}</div>`}
function requestCard(r,sub){return `<div style="grid-column:1/-1"><div class="awv9p-qr"><canvas data-pqr="${r.id}"></canvas><div class="awv9p-count" data-pcount="${r.id}">--:--</div><b>${pmoney(r.amount)}</b><div style="font-size:10px;color:#8993a9">QR มีอายุ 15 นาที</div></div>${r.status==='pending'?`<button class="awv9p-btn success" style="width:100%;margin-top:8px" data-upload-partial="${r.id}">อัปโหลดสลิป</button>`:sub?'<div class="awv9p-message" style="margin-top:8px">ส่งสลิปแล้ว รอตรวจสอบ</div>':'<div class="awv9p-message" style="margin-top:8px">กำลังตรวจสอบรายการ</div>'}</div>`}
async function loadPay(){payLayer.classList.add('open');payLayer.innerHTML='<div class="awv9p-panel" style="display:grid;place-items:center;min-height:300px">กำลังโหลดแผนชำระ...</div>';try{P.data=await prpc('student_v9_payment_bootstrap');renderPay()}catch(e){payLayer.innerHTML=`<div class="awv9p-panel" style="padding:22px"><div class="awv9p-message">${pe(e.message)}</div><button class="awv9p-btn danger" data-p-close>ปิด</button></div>`;payLayer.querySelector('[data-p-close]').onclick=()=>payLayer.classList.remove('open')}}
function renderPqrs(){payLayer.querySelectorAll('[data-pqr]').forEach(c=>{const r=P.data.requests.find(x=>x.id===c.dataset.pqr),plan=P.data.plans.find(p=>p.id===r?.payment_plan_id);if(r&&window.QRCode)QRCode.toCanvas(c,promptpayPayload(plan?.promptpay_id||'1901001151577',r.amount),{width:210,margin:1,errorCorrectionLevel:'M'}).catch(()=>{})})}
function startPtimer(){clearInterval(P.timer);const tick=()=>payLayer.querySelectorAll('[data-pcount]').forEach(el=>{const r=P.data.requests.find(x=>x.id===el.dataset.pcount),ms=new Date(r.expires_at)-new Date();if(ms<=0){el.textContent='00:00';return}el.textContent=`${String(Math.floor(ms/60000)).padStart(2,'0')}:${String(Math.floor(ms%60000/1000)).padStart(2,'0')}`});tick();P.timer=setInterval(tick,1000)}
function uploadPartial(id){const req=P.data.requests.find(r=>r.id===id);payLayer.insertAdjacentHTML('beforeend',`<div id="awv9-slip-modal" style="position:fixed;inset:0;z-index:100002;background:rgba(10,16,38,.68);display:grid;place-items:center;padding:18px"><div class="awv9p-card" style="width:min(520px,100%)"><h3>อัปโหลดสลิป ${pmoney(req.amount)}</h3><input class="awv9p-input" type="file" id="awv9-slip-file" accept="image/*,application/pdf"><input class="awv9p-input" style="margin-top:8px" id="awv9-slip-note" placeholder="หมายเหตุ (ถ้ามี)"><div style="display:flex;gap:8px;margin-top:10px"><button class="awv9p-btn" id="awv9-slip-cancel">ยกเลิก</button><button class="awv9p-btn primary" id="awv9-slip-send">อัปโหลดและยืนยัน</button></div></div></div>`);document.getElementById('awv9-slip-cancel').onclick=()=>document.getElementById('awv9-slip-modal').remove();document.getElementById('awv9-slip-send').onclick=async()=>{const file=document.getElementById('awv9-slip-file').files[0];if(!file)return ptoast('กรุณาเลือกไฟล์',true);const path=`${P.user.id}/${id}/${Date.now()}-${file.name.replace(/[^\w.ก-๙-]+/g,'-')}`;try{const{error}=await sbp.storage.from('portal-slips').upload(path,file,{contentType:file.type||undefined});if(error)throw error;await prpc('student_v8_submit_slip',{p_payment_request_id:id,p_storage_path:path,p_original_filename:file.name,p_amount:req.amount,p_note:document.getElementById('awv9-slip-note').value||''});document.getElementById('awv9-slip-modal').remove();ptoast('ส่งสลิปแล้ว');await loadPay()}catch(e){await sbp.storage.from('portal-slips').remove([path]);ptoast(e.message,true)}}}
function bindPay(){payLayer.querySelector('[data-p-close]').onclick=()=>payLayer.classList.remove('open');payLayer.querySelector('[data-p-refresh]').onclick=loadPay;payLayer.querySelectorAll('[data-create-qr]').forEach(b=>b.onclick=async()=>{const amount=pn(payLayer.querySelector(`#pay-amount-${b.dataset.createQr}`)?.value);try{await prpc('student_v9_create_installment_qr',{p_installment_id:b.dataset.createQr,p_amount:amount});ptoast('สร้าง QR แล้ว');await loadPay()}catch(e){ptoast(e.message,true)}});payLayer.querySelectorAll('[data-upload-partial]').forEach(b=>b.onclick=()=>uploadPartial(b.dataset.uploadPartial))}
if(payLaunch)payLaunch.style.display='none';window.__AREWARIN_OPEN_INSTALLMENTS__=loadPay;payLayer.addEventListener('click',e=>{if(e.target===payLayer)payLayer.classList.remove('open')});
async function detectPay(){try{const{data}=await sbp.auth.getSession();P.user=data.session?.user||null;if(payLaunch)payLaunch.style.display='none'}catch{if(payLaunch)payLaunch.style.display='none'}}
setInterval(detectPay,3500);detectPay();
</script>



</body></html>
