<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

ain></div>`}
function activeEnroll(){return (S.data?.enrollments||[]).filter(e=>['active','paused'].includes(e.status))}
function visibleEnroll(){return (S.data?.enrollments||[]).filter(e=>['active','paused','pending','completed'].includes(e.status))}
function resolvedEnrollmentIds(){return new Set((S.data?.enrollments||[]).filter(e=>['active','paused','completed'].includes(e.status)&&e.source_enrollment_id).map(e=>String(e.source_enrollment_id)))}
function paymentResolvedByCourse(p){return !!(p?.enrollment_id&&resolvedEnrollmentIds().has(String(p.enrollment_id)))}
function unresolvedCorePayments(){return (S.data?.core_payments||[]).filter(p=>p.status!=='paid'&&!paymentResolvedByCourse(p))}
function duePayments(){return (S.data?.payment_requests||[]).filter(p=>['pending','slip_submitted','rejected','expired'].includes(paymentStatus(p))&&!paymentResolvedByCourse(p))}
function renewalThreshold(e){const c=course(e.course_id),configured=n(c?.renewal_alert_hours||3),pct=n(e.hours_total)>0?n(e.hours_total)*.15:0;return Math.max(configured,pct)}
function renewalReady(e){if(!e||e.status==='pending')return false;if(e.status==='completed')return true;if(e.hours_unlimited)return false;const remain=Math.max(0,n(e.hours_total)-n(e.hours_used));return remain<=renewalThreshold(e)}
function nearFinish(){return activeEnroll().filter(renewalReady)}
function recentActivity(){const rows=[];(S.data?.notifications||[]).slice(0,8).forEach(x=>rows.push({at:x.created_at,icon:'✦',title:x.title||'แจ้งเตือน',body:x.body||'',kind:'notice'}));(S.data?.hour_ledger||[]).slice(0,8).forEach(x=>rows.push({at:x.created_at,icon:x.entry_type==='restore'?'↺':'◷',title:x.entry_type==='restore'?'คืนชั่วโมง':'อัปเดตชั่วโมงเรียน',body:`${n(x.hours_delta)>=0?'-':'+'}${Math.abs(n(x.hours_delta)).toFixed(2)} ชม.${x.note?' · '+x.note:''}`,kind:'hours'}));return rows.filter(x=>x.at).sort((a,b)=>new Date(b.at)-new Date(a.at)).slice(0,6)}
function dashboard(){const s=S.data.student,active=activeEnroll(),visible=visibleEnroll(),pendingCourses=visible.filter(e=>e.status==='pending'),hasUnlimited=active.some(e=>e.hours_unlimited),remaining=active.reduce((a,e)=>a+(e.hours_unlimited?0:Math.max(0,n(e.hours_total)-n(e.hours_used))),0),newCount=(S.data.topics||[]).filter(isNewTopic).length,dueRows=duePayments(),due=dueRows.reduce((a,p)=>a+n(p.amount),0),codes=(S.data.codes||[]).slice(0,3),ending=nearFinish(),activity=recentActivity();const firstActive=active[0],firstCourse=firstActive?course(firstActive.course_id):null,ready=active.length>0&&!dueRows.length;return `<section class="student-welcome"><div><span class="welcome-kicker">STUDENT EXPERIENCE</span><h2>ยินดีต้อนรับ ${esc(s.nickname||s.first_name||'นักเรียน')} ✨</h2><p>${ready?'คอร์สพร้อมใช้งานแล้ว เรียนต่อ ดูชั่วโมง และติดตามความคืบหน้าได้จากหน้าเดียว':'ดูคอร์ส ชั่วโมง การชำระเงิน และสถานะการสมัครจากระบบกลาง AreWarin'}</p><div class="welcome-actions">${firstCourse?`<button class="btn primary" data-open-course="${firstCourse.id}">เรียนต่อ ${esc(firstCourse.title)}</button>`:''}<button class="btn soft" data-go-catalog>ดูคอร์สที่เปิดรับ</button></div></div><div class="welcome-id"><small>STUDENT ID</small><strong>${esc(s.student_code||'—')}</strong><span>${esc(s.school||'AreWarin Biology')}</span></div></section><div class="grid metrics"><div class="card metric"><span class="metric-icon">▤</span><small>คอร์สของฉัน</small><strong>${visible.length}</strong><em>${pendingCourses.length?`มี ${pendingCourses.length} คอร์สรอเปิดใช้งาน`:'คอร์สในบัญชี'}</em></div><div class="card metric"><span class="metric-icon">◷</span><small>ชั่วโมงคงเหลือ</small><strong>${hasUnlimited?'∞':remaining.toFixed(1)}</strong><em>${hasUnlimited?'แพ็กเกจรายปี':'ชั่วโมง'}</em></div><div class="card metric"><span class="metric-icon">▶</span><small>บทเรียนใหม่</small><strong>${newCount}</strong><em>รายการ</em></div><div class="card metric ${due?'attention':ready?'paid-metric':''}"><span class="metric-icon">${due?'฿':'✓'}</span><small>${due?'ยอดรอดำเนินการ':'สถานะคอร์ส'}</small><strong>${due?money(due):ready?'พร้อมเรียน':'—'}</strong><em>${dueRows.length?'มีรายการที่ยังต้องดำเนินการ':ready?'ไม่มียอดค้างชำระ':'รอข้อมูลคอร์ส'}</em></div></div>${(()=>{const nx=nextSchedule(),dueA=(S.data?.v16_assignments||[]).filter(a=>a.due_at&&new Date(a.due_at)>new Date()&&!(S.data?.v16_assignment_submissions||[]).some(s=>s.assignment_id===a.id&&['submitted','graded'].includes(s.status))).sort((a,b)=>new Date(a.due_at)-new Date(b.due_at))[0];return (nx||dueA)?`<section class="today-strip"><div><span class="section-kicker">NEXT ACTION</span><b>${nx?'คาบเรียนถัดไป '+dateTime(nx.start_at):'การบ้านถัดไป '+esc(dueA.title)}</b><p>${nx?esc(nx.title||course(nx.course_id)?.title||'คาบเรียน'):dueA.due_at?'กำหนด '+dateTime(dueA.due_at):''}</p></div><button class="btn soft" data-tab-jump="${nx?'schedule':'assignments'}">เปิดดู</button></section>`:''})()}${ending.length?`<section class="renew-strip"><div><span>RENEWAL READY</span><b>${ending.length} คอร์สใกล้หมดชั่วโมง</b><p>${ending.slice(0,2).map(e=>`${esc(course(e.course_id)?.title||'คอร์ส')} เหลือ ${Math.max(0,n(e.hours_total)-n(e.hours_used)).toFixed(1)} ชม.`).join(' · ')}</p></div><button class="btn primary" data-go-catalog>ดูตัวเลือกต่อคอร์ส</button></section>`:''}${dueRows.length?`<section class="payment-strip"><div><span>PAYMENT ACTION</span><b>มี ${dueRows.length} รายการรอดำเนินการ</b><p>เปิดดู QR ส่งสลิป หรือติดตามสถานะจาก Payment Center</p></div><button class="btn" data-go-pay>ดำเนินการชำระเงิน</button></section>`:''}<div class="grid dashboard-split"><article class="card student-pass"><div class="pass-top"><div><small>DIGITAL STUDENT PASS</small><h2>${esc(full(s))}</h2><p>${esc(s.school||'ไม่ระบุโรงเรียน')} · ${esc(s.education_level||s.grade||'')}</p></div><div class="pass-mark">A</div></div><div class="pass-bottom"><span>${esc(s.student_code||s.phone||'')}</span><strong>${ready?'active':esc(s.status||'pending')}</strong></div></article><section class="card quick-panel"><div class="section-head"><div><span class="section-kicker">QUICK ACCESS</span><h2>ใช้งานด่วน</h2><p>เมนูสำคัญระหว่างเรียน</p></div></div><div class="quick-actions"><button class="aw-quick-btn" data-tab-jump="courses"><b>▤</b><span>คอร์สของฉัน<small>ดูความคืบหน้าและชั่วโมง</small></span></button><button class="aw-quick-btn" data-tab-jump="attendance"><b>✓</b><span>เวลาเรียน<small>เช็กประวัติและการตัดชั่วโมง</small></span></button>${dueRows.length?`<button class="aw-quick-btn" data-tab-jump="payments"><b>฿</b><span>การชำระเงิน<small>${dueRows.length} รายการต้องดำเนินการ</small></span></button>`:`<button class="aw-quick-btn" data-tab-jump="learning"><b>▶</b><span>บทเรียน<small>กลับไปเรียนต่อ</small></span></button>`}<button class="aw-quick-btn" data-go-catalog><b>＋</b><span>ลงคอร์สเพิ่ม<small>${ending.length?'มีคอร์สพร้อมต่อ':'ดูคอร์สที่เปิดรับ'}</small></span></button></div></section></div><section class="section-block"><div class="section-head"><div><span class="section-kicker">MY COURSES</span><h2>เรียนต่อจากคอร์สของฉัน</h2><p>ชั่วโมงและความคืบหน้าอัปเดตตาม Tutor OS</p></div><button class="btn soft" data-go-catalog>ดูคอร์สที่เปิดรับ</button></div><div class="grid course-grid">${visible.slice(0,3).map(courseCard).join('')||'<div class="card empty">ยังไม่มีคอร์สในบัญชีนี้</div>'}</div></section>${activity.length?`<section class="card activity-panel"><div class="section-head"><div><span class="section-kicker">RECENT ACTIVITY</span><h2>กิจกรรมล่าสุด</h2><p>รวมการอัปเดตชั่วโมงและการแจ้งเตือนในที่เดียว</p></div></div><div class="activity-list">${activity.map(x=>`<div class="activity-row"><span class="activity-icon">${x.icon}</span><div><b>${esc(x.title)}</b><p>${esc(x.body)}</p></div><time>${date(x.at)}</time></div>`).join('')}</div></section>`:''}${learningJourneyHtml()}${codes.length?`<section class="card codes-panel"><div class="section-head"><div><span class="section-kicker">COURSE ACCESS</span><h2>รหัสคอร์สล่าสุด</h2></div></div><div class="codes-grid">${codes.map(c=>`<div class="code-card"><div class="sub">${esc(course(c.course_id)?.title||'')} · ${esc(c.title)}</div><div class="code-value">${esc(c.code_value)}</div><div class="sub">${esc(c.note||'')}</div></div>`).join('')}</div></section>`:''}`}

function courseCard(e){const c=course(e.course_id);if(!c)return '';const pending=e.status==='pending',pct=courseProgress(c.id),newC=!pending&&(S.data.topics||[]).filter(t=>String(t.course_id)===String(c.id)).some(isNewTopic),cover=c.cover_url||'',remain=Math.max(0,n(e.hours_total)-n(e.hours_used)),renew=renewalReady(e);return `<article class="card course-card ${pending?'course-pending':''}"><div class="course-cover" style="${cover?`background-image:url('${esc(cover)}')`:''}">${pending?'<span class="new-dot pending-dot">รอเปิดใช้งาน</span>':renew?'<span class="new-dot renewal-dot">ใกล้หมดคอร์ส</span>':newC?'<span class="new-dot">มีบทใหม่</span>':''}<div class="course-cover-meta"><span>${pending?'สมัครแล้ว · รอตรวจการชำระ':e.hours_unlimited?'รายปี':`${remain.toFixed(1)} ชม. คงเหลือ`}</span></div><div class="cover-title">${esc(c.title)}</div></div><div class="course-body">${pending?`<div class="pending-course-note"><b>คอร์สอยู่ในบัญชีแล้ว</b><span>เมื่อ Manager ยืนยันและเปิด Active ระบบจะซ่อนการชำระเงินและเปิดการเรียนให้อัตโนมัติ</span></div><div class="course-actions"><button class="btn primary" data-go-pay>ดูสถานะ</button><button class="btn soft" data-go-catalog>ดูคอร์สอื่น</button></div>`:`<div class="progress-row"><span>ความคืบหน้า ${pct}%</span><span>${topics(c.id).filter(t=>progress(t.id)?.status==='completed').length}/${topics(c.id).length} บท</span></div><div class="progress"><i style="width:${pct}%"></i></div><div class="course-hours">${e.hours_unlimited?'แพ็กเกจรายปี · ไม่จำกัดชั่วโมง':`ใช้แล้ว ${n(e.hours_used).toFixed(1)} · เหลือ ${remain.toFixed(1)} จาก ${n(e.hours_total).toFixed(1)} ชม.`}</div><div class="course-actions"><button class="btn primary" data-open-course="${c.id}">${pct?'เรียนต่อ':'เริ่มเรียน'}</button>${renew?`<button class="btn renew-btn" data-renew="${c.id}">ต่อคอร์ส</button>`:''}</div>`}</div></article>`}

function coursesHtml(){const rows=visibleEnroll();return `<div class="grid course-grid">${rows.map(courseCard).join('')||'<div class="empty">ยังไม่มีคอร์สในบัญชีนี้</div>'}</div>`}
function learningHtml(){if(S.courseId)return courseLearning(S.courseId);return `<section class="card"><div class="section-head"><div><h2>คอร์สย้อนหลัง</h2><p>เลือกภาพปกคอร์สเพื่อดูรายการบทเรียน</p></div></div><div class="grid course-grid">${activeEnroll().filter(e=>topics(e.course_id).length).map(courseCard).join('')||'<div class="empty">ยังไม่มีคอร์สย้อนหลังที่มอบหมาย</div>'}</div></section>`}
function courseLearning(courseId){const c=course(courseId),ts=topics(courseId);if(!S.lessonId)S.lessonId=ts.find(t=>progress(t.id)?.status!=='completed')?.id||ts[0]?.id;const current=ts.find(t=>String(t.id)===String(S.lessonId))||ts[0];return `<button class="btn small" data-back-learning>← กลับหน้าคอร์ส</button><div class="lesson-layout" style="margin-top:12px"><aside class="card lesson-nav"><div class="section-head"><div><h2>${esc(c.title)}</h2><p>เรียนแล้ว ${courseProgress(courseId)}%</p></div></div><div class="progress"><i style="width:${courseProgress(courseId)}%"></i></div><div style="margin-top:13px">${ts.map((t,i)=>`<article class="lesson-item ${String(t.id)===String(current?.id)?'active':''} ${progress(t.id)?.status==='completed'?'done':''}" data-lesson="${t.id}"><div class="name">${progress(t.id)?.status==='completed'?'✓ ':''}บทที่ ${i+1} · ${esc(t.title)} ${isNewTopic(t)?'<span class="chip amber">ใหม่</span>':''}</div><div class="sub">${assets(t.id).length} สื่อ</div></article>`).join('')||'<div class="empty">ยังไม่มีบทเรียน</div>'}</div></aside><main class="card lesson-player">${current?lessonPlayer(current,ts):'<div class="empty">ยังไม่มีบทเรียน</div>'}</main></div>`}
function youtube(url){const m=String(url||'').match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{6,})/);return m?`https://www.youtube.com/embed/${m[1]}`:''}function lessonPlayer(t,ts){const as=assets(t.id),idx=ts.findIndex(x=>x.id===t.id),done=progress(t.id)?.status==='completed';return `<div class="section-head"><div><span class="chip">บทที่ ${idx+1}</span><h2 style="margin-top:8px">${esc(t.title)}</h2><p>${esc(t.description||'')}</p></div>${done?'<span class="chip green">เรียนจบแล้ว</span>':''}</div>${as.map(assetHtml).join('')||'<div class="empty">ยังไม่มีวิดีโอหรือชีท</div>'}<div style="display:flex;justify-content:space-between;gap:8px;margin-top:16px"><button class="btn" data-prev ${idx<=0?'disabled':''}>← บทก่อนหน้า</button><button class="btn ${done?'success':'primary'}" data-complete="${t.id}">${done?'เรียนจบแล้ว':'มาร์คว่าเรียนจบ'}</button><button class="btn" data-next ${idx>=ts.length-1?'disabled':''}>บทถัดไป →</button></div>`}
function assetHtml(a){if(a.asset_type==='youtube'){const u=youtube(a.url);return `<article class="asset"><div class="asset-head"><div><div class="name">${esc(a.title)}</div><div class="sub">YouTube · ${esc(a.description||'')}</div></div></div>${u?`<div class="video-frame"><iframe src="${esc(u)}" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen></iframe></div>`:`<a class="btn small primary" href="${esc(a.url)}" target="_blank" rel="noopener">เปิด YouTube</a>`}</article>`}if(a.asset_type==='external_video')return `<article class="asset"><div class="name">${esc(a.title)}</div><div class="sub">${esc(a.description||'')}</div><a class="btn small primary" target="_blank" rel="noopener" href="${esc(a.url)}">เปิดวิดีโอ</a></article>`;if(a.asset_type==='external_link')return `<article class="asset"><div class="name">${esc(a.title)}</div><a class="btn small primary" target="_blank" rel="noopener" href="${esc(a.url)}">เปิดลิงก์</a></article>`;const signed=S.signed[a.id];if(a.asset_type==='video_upload')return `<article class="asset"><div class="name">${esc(a.title)}</div>${signed?`<div class="video-frame"><video controls preload="metadata" src="${esc(signed)}"></video></div>`:`<button class="btn small primary" data-load-asset="${a.id}">โหลดวิดีโอ</button>`}</article>`;return `<article class="asset"><div class="name">${esc(a.title)}</div><div class="sub">${esc(a.description||'ชีท/เอกสาร')}</div>${signed?`<a class="btn small primary" target="_blank" rel="noopener" href="${esc(signed)}">เปิดชีท</a>`:`<button class="btn small" data-load-asset="${a.id}">เปิดชีท</button>`}</article>`}
function attendanceHtml(){const ledger=S.data.hour_ledger||[],groups=S.data.groups||[];const netUsed=ledger.reduce((a,x)=>a+n(x.hours_delta),0);return `<div class="grid metrics" style="margin-bottom:16px"><div class="card metric"><small>ชั่วโมงที่ใช้สุทธิ</small><strong>${Math.max(0,netUsed).toFixed(1)}</strong></div><div class="card metric"><small>รายการ Hour Ledger</small><strong>${ledger.length}</strong></div><div class="card metric"><small>กลุ่มเรียน</small><strong>${groups.length}</strong></div><div class="card metric"><small>Realtime</small><strong>ON</strong></div></div>${groups.length?`<section class="card" style="margin-bottom:16px"><div class="section-head"><div><h2>กลุ่มเรียนของฉัน</h2><p>Group Locker ใช้สำหรับจัดรายชื่อผู้สอนเท่านั้น ชั่วโมงยังคิดแยกเป็นรายบุคคล</p></div></div>${groups.map(g=>`<span class="group-inline">👥 ${esc(g.group_code)} · ${esc(g.name)}</span>`).join('')}</section>`:''}<section class="card"><div class="section-head"><div><h2>ประวัติการเข้าเรียน</h2><p>อัปเดตจาก Tutor OS แบบเรียลไทม์ รวมการตัดชั่วโมงรายคน</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>คอร์ส/คาบ</th><th>สถานะ</th><th>ตัดชม.</th><th>หมายเหตุ</th></tr></thead><tbody>${S.data.attendance.map(a=>{const ss=S.data.sessions.find(x=>x.id===a.session_id),g=groups.find(x=>String(x.id)===String(ss?.group_id));return `<tr><td>${date(ss?.session_date||a.created_at)}</td><td><div class="name">${esc(ss?.title||'คาบเรียน')}</div><div class="sub">${esc(course(ss?.course_id)?.title||'')}${g?' · '+esc(g.group_code):''}</div></td><td><span class="chip ${a.status==='present'?'green':a.status==='late'?'amber':'gray'}">${statusThai(a.status)}</span></td><td><b>${n(a.deducted_hours).toFixed(2)}</b> ชม.</td><td>${esc(a.note||'—')}</td></tr>`}).join('')||'<tr><td colspan="5" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div></section>`}
function walletHtml(){const rows=visibleEnroll();return `<section class="course-center-hero"><div><span class="section-kicker">COURSE WALLET</span><h2>ชั่วโมงและสิทธิ์คอร์สของฉัน</h2><p>ดูชั่วโมงซื้อมา ใช้ไป คืนมา คงเหลือ และประวัติการตัดชั่วโมงแบบโปร่งใส</p></div></section><div class="wallet-grid">${rows.map(e=>{const pool=(S.data.hour_pools||[]).find(p=>p.id===e.hour_pool_id),ledger=(S.data.hour_ledger||[]).filter(l=>String(l.student_course_enrollment_id)===String(e.id)).slice(0,8),remain=e.hours_unlimited?null:Math.max(0,n(pool?.total_hours??e.hours_total)-n(pool?.used_hours??e.hours_used));return `<article class="wallet-card"><div class="wallet-head"><div><small>${esc(course(e.course_id)?.title||e.course_label||'คอร์ส')}</small><h3>${e.hours_unlimited?'แพ็กเกจรายปี':`${remain.toFixed(1)} ชั่วโมงคงเหลือ`}</h3></div><span class="chip ${e.status==='active'?'green':''}">${esc(e.status)}</span></div><div class="wallet-stats"><div><small>ซื้อมา</small><b>${e.hours_unlimited?'∞':n(pool?.total_hours??e.hours_total).toFixed(1)}</b></div><div><small>ใช้ไป</small><b>${n(pool?.used_hours??e.hours_used).toFixed(1)}</b></div><div><small>คงเหลือ</small><b>${e.hours_unlimited?'∞':remain.toFixed(1)}</b></div></div><div class="wallet-ledger">${ledger.map(l=>`<div><time>${date(l.created_at)}</time><span>${esc(l.entry_type)}</span><b>${n(l.hours_delta).toFixed(2)} ชม.</b><small>${esc(l.note||'')}</small></div>`).join('')||'<div class="empty">ยังไม่มีรายการตัด/คืนชั่วโมง</div>'}</div>${renewalReady(e)?`<button class="btn primary" data-go-catalog>ดูตัวเลือกต่อคอร์ส</button>`:''}</article>`}).join('')||'<div class="card empty">ยังไม่มี Course Wallet</div>'}</div>`}
function requestsHtml(){const res=S.data.v16_reschedule_requests||[],tickets=S.data.v16_support_tickets||[];return `<section class="course-center-hero"><div><span class="section-kicker">REQUEST CENTER</span><h2>คำขอของฉัน</h2><p>รวมคำขอเลื่อนเรียน ชดเชย แจ้งชั่วโมงผิด ปัญหาชำระเงิน คอร์ส บัญชี และ Support ไว้ในหน้าเดียว</p></div><button class="btn primary" id="newRequestTicket">สร้างคำขอใหม่</button></section><div class="request-grid"><article class="card"><div class="section-head"><div><h2>เลื่อน / ชดเชยเวลาเรียน</h2><p>ติดตามสถานะคำขอที่ส่งไป</p></div></div>${res.map(r=>`<div class="request-row"><div><b>${dateTime(r.requested_start_at)}</b><p>${esc(r.reason||'')}</p></div><span class="chip ${r.status==='approved'?'green':r.status==='rejected'?'amber':''}">${esc(r.status)}</span></div>`).join('')||'<div class="empty">ไม่มีคำขอ</div>'}</article><article class="card"><div class="section-head"><div><h2>Support / ปัญหาต่าง ๆ</h2><p>ส่งแล้ว → กำลังตรวจ → รอนักเรียน → เสร็จสิ้น</p></div></div>${tickets.map(t=>`<button class="request-row ticket" data-ticket="${t.id}"><div><b>${esc(t.ticket_no||'Ticket')} · ${esc(t.subject)}</b><p>${esc(t.category)} · ${date(t.updated_at)}</p></div><span class="chip">${esc(t.status)}</span></button>`).join('')||'<div class="empty">ไม่มี Ticket</div>'}</article></div>`}
function paymentStatus(p){const expired=new Date(p.expires_at)<=new Date()&&p.status==='pending';return expired?'expired':p.status}function paymentsHtml(){const all=(S.data.payment_requests||[]).filter(p=>!['cancelled'].includes(p.status)),rows=all.filter(p=>!paymentResolvedByCourse(p)),pending=rows.filter(p=>['pending','slip_submitted','rejected','expired'].includes(paymentStatus(p))),paidHistory=all.filter(p=>paymentStatus(p)==='paid'||paymentResolvedByCourse(p)),core=(S.data.core_payments||[]),unresolvedCore=core.find(p=>p.status!=='paid'&&!paymentResolvedByCourse(p)),active=activeEnroll();if(!pending.length&&!unresolvedCore&&active.length){return `<section class="payment-clear-state"><div class="clear-icon">✓</div><span class="section-kicker">PAYMENT CLEAR</span><h2>ไม่มีรายการที่ต้องชำระ</h2><p>คอร์สของคุณถูกเปิดใช้งานแล้ว ระบบจะไม่แสดง QR หรือรายการชำระเดิมซ้ำอีก</p><button class="btn soft" data-tab-jump="courses">กลับไปคอร์สของฉัน</button></section>${paidHistory.length||core.some(p=>p.status==='paid')?`<details class="payment-history"><summary>ดูประวัติการยืนยันการชำระเงิน</summary><div class="history-list">${core.filter(p=>p.status==='paid'||paymentResolvedByCourse(p)).slice(0,8).map(p=>`<div><span>${esc(p.course_text||'ค่าคอร์ส AreWarin Biology')}</span><b>${money(p.verified_amount||p.amount_submitted||0)}</b><em>ยืนยันแล้ว</em></div>`).join('')||'<div class="empty">ไม่มีประวัติ</div>'}</div></details>`:''}`};return `<section class="payment-overview"><div><span class="section-kicker">PAYMENT CENTER</span><h2>รายการที่ต้องดำเนินการ</h2><p>แสดงเฉพาะรายการที่ยังไม่ถูกปิดโดยสถานะ Active ของคอร์ส</p></div><div class="payment-summary"><div><small>รอดำเนินการ</small><b>${pending.length}</b></div><div><small>คอร์ส Active</small><b>${active.length}</b></div>${pending.length?'<button class="btn primary" id="open-installment-plan">ดูแผนผ่อน / แบ่งชำระ</button>':''}</div></section>${unresolvedCore?`<section class="core-payment-card"><div><span>สถานะจากระบบสมัครเรียน</span><h3>${esc(unresolvedCore.course_text||'ค่าคอร์ส AreWarin Biology')}</h3><p>อยู่ระหว่างการตรวจสอบจาก Manager</p></div><div><small>ยอด</small><b>${money(unresolvedCore.verified_amount||unresolvedCore.amount_submitted||0)}</b><em>${statusThai(unresolvedCore.status)}</em></div></section>`:''}<div class="grid payment-grid">${rows.filter(p=>['pending','slip_submitted','rejected','expired'].includes(paymentStatus(p))).map(p=>paymentCard(p)).join('')||'<div class="card empty">ไม่มีรายการค้างชำระ</div>'}</div>`}
function paymentCard(p){const st=paymentStatus(p),sub=(S.data.payment_submissions||[]).find(x=>x.payment_request_id===p.id&&x.status==='pending');return `<article class="card payment-card"><div class="section-head"><div><span class="chip ${st==='paid'?'green':st==='rejected'?'amber':'gray'}">${statusThai(st)}</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${esc(p.note||'')}</p></div><strong>${money(p.amount)}</strong></div>${['pending','expired','rejected'].includes(st)?`<div class="qr-wrap"><canvas data-qr="${p.id}"></canvas><div class="countdown" data-countdown="${p.id}">--:--</div><div class="sub">PromptPay ${CONFIG.promptpay}<br>${esc(CONFIG.payee)}</div></div><div class="message">QR มีอายุ 15 นาที หากหมดเวลาให้สร้างใหม่</div>${st==='expired'||st==='rejected'?`<button class="btn warn wide" data-refresh-payment="${p.id}">สร้าง QR ใหม่</button>`:`<button class="btn primary wide" data-upload-slip="${p.id}">อัปโหลดสลิปและยืนยัน</button>`}`:sub?'<div class="message">ส่งสลิปแล้ว รอ Manager ตรวจสอบ</div>':'<div class="message">กำลังตรวจสอบรายการ</div>'}</article>`}
function catalogHtml(){const current=visibleEnroll(),active=activeEnroll(),owned=new Map(current.map(e=>[String(e.course_id),e])),open=S.data.open_courses||[],promos=S.data.active_promotions||[];return `<section class="catalog-hero"><div><span class="section-kicker">AREWARIN COURSE CATALOG</span><h2>คอร์สที่เปิดรับสมัคร</h2><p>ข้อมูลคอร์ส ติวเตอร์ แพ็กเกจ และราคาใช้ชุดเดียวกับระบบสมัครเรียนหลัก</p></div><a class="btn soft" href="../">เปิดระบบสมัครเรียนหลัก</a></section>${(S.data?.v16_recommendations||[]).length?`<section class="recommendation-shelf"><div class="section-head"><div><span class="section-kicker">RECOMMENDED FOR YOU</span><h2>คอร์สที่น่าจะเหมาะกับคุณ</h2><p>อิงระดับชั้น คอร์สที่กำลังเรียน และคอร์สที่เปิดรับอยู่</p></div></div><div class="recommendation-row">${S.data.v16_recommendations.slice(0,3).map(r=>`<article><div class="rec-cover" style="${r.cover_url?`background-image:url('${esc(r.cover_url)}')`:''}"></div><div><b>${esc(r.title)}</b><span>${esc(r.tutor_name||'AreWarin Tutor')} · ${r.hours?`${n(r.hours)} ชม.`:''}</span><small>${r.price?money(r.price):'ดูราคา'}</small></div><button class="btn small primary" data-enroll="${r.id}:new">ดูคอร์ส</button></article>`).join('')}</div></section>`:''}${promos.length?`<div class="promo-strip">${promos.slice(0,2).map(p=>`<span>✦ ${esc(p.name||p.code)} ${p.discount_type==='percent'?`${n(p.discount_value)}%`:`${money(p.discount_value)}`}</span>`).join('')}</div>`:''}<div class="catalog-grid">${open.map(c=>{const e=owned.get(String(c.id)),own=!!e,renew=own&&renewalReady(e),cover=c.cover_url||'',packages=Array.isArray(c.packages)?c.packages:[],displayPrice=n(c.display_price||c.price||(packages[0]?.amount||0)),tutorName=c.tutor_name||'AreWarin Tutor';return `<article class="catalog-course"><div class="catalog-cover" style="${cover?`background-image:url('${esc(cover)}')`:''}"><div class="catalog-badges"><span>${esc(c.badge||c.course_type||'BIOLOGY')}</span>${own?`<span class="${renew?'is-renew':'is-owned'}">${renew?'ใกล้หมด · ต่อได้':'กำลังเรียน'}</span>`:'<span class="is-open">เปิดรับสมัคร</span>'}</div><div class="catalog-title"><small>${esc(tutorName)}</small><h3>${esc(c.title)}</h3></div></div><div class="catalog-body"><div class="tutor-line">${c.tutor_image?`<img src="${esc(c.tutor_image)}" alt="">`:'<span>A</span>'}<div><b>${esc(tutorName)}</b><small>${esc(c.tutor_role||'ผู้สอน')}</small></div></div><p>${esc(c.public_description||c.description||c.public_note||'')}</p>${c.target_text?`<div class="catalog-target">เหมาะสำหรับ ${esc(c.target_text)}</div>`:''}<div class="package-list">${packages.slice(0,4).map(p=>`<span><b>${esc(p.label)}</b><em>${money(p.amount)}</em></span>`).join('')||(displayPrice?`<span><b>${n(c.hours||c.default_hours)} ชม.</b><em>${money(displayPrice)}</em></span>`:'')}</div><div class="catalog-footer"><div><small>เริ่มต้น</small><strong>${displayPrice?money(displayPrice):'ดูราคาในหน้าสมัคร'}</strong></div>${!own?`<button class="btn primary" data-enroll="${c.id}:new">สมัครคอร์สนี้</button>`:renew?`<button class="btn renew-btn" data-enroll="${c.id}:renewal">ต่อคอร์สนี้</button>`:`<button class="btn soft" data-view-owned="${c.id}">ดูคอร์สของฉัน</button>`}</div></div></article>`}).join('')||'<div class="card empty">ยังไม่มีคอร์สเปิดรับสมัครในขณะนี้</div>'}</div>`}

function notifyRow(x){return `<article class="notify ${x.is_read?'':'unread'}"><div class="name">${esc(x.title)}</div><div class="sub">${esc(x.body||'')} · ${date(x.created_at)}</div>${x.is_read?'':`<button class="btn small" data-read="${x.id}" style="margin-top:7px">อ่านแล้ว</button>`}</article>`}function notificationsHtml(){return `<section class="card"><div class="section-head"><div><h2>การแจ้งเตือน</h2><p>บทเรียนใหม่ รหัสคอร์ส ยอดชำระ และผลอนุมัติ</p></div></div>${S.data.notifications.map(notifyRow).join('')||'<div class="empty">ไม่มีแจ้งเตือน</div>'}</section>`}

function render(){clearInterval(S.timer);const map={dashboard,schedule:scheduleHtml,courses:coursesHtml,learning:learningHtml,assignments:assignmentsHtml,attendance:attendanceHtml,payments:paymentsHtml,catalog:catalogHtml,documents:documentsHtml,support:supportHtml,parent:parentHtml,notifications:notificationsHtml,security:securityHtml,profile:profileHtml};app.innerHTML=shell((map[S.tab]||dashboard)());bindPortal();renderQrs();startCountdowns()}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',n(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}function renderQrs(){$$('[data-qr]').forEach(c=>{const p=(S.data.payment_requests||[]).find(x=>x.id===c.dataset.qr);if(!p||paymentResolvedByCourse(p))return;if(window.QRCode){QRCode.toCanvas(c,promptpayPayload(p.promptpay_id||CONFIG.promptpay,p.amount),{width:220,margin:1,errorCorrectionLevel:'M'}).catch(()=>{const wrap=c.closest('.qr-wrap');if(wrap)wrap.insertAdjacentHTML('beforeend','<div class="message error">สร้าง QR ไม่สำเร็จ กรุณากดรีเฟรชหรือใช้เลข PromptPay ที่แสดงด้านล่าง</div>')})}})}function startCountdowns(){const tick=()=>$$('[data-countdown]').forEach(el=>{const p=S.data.payment_requests.find(x=>x.id===el.dataset.countdown),ms=new Date(p.expires_at)-new Date();if(ms<=0){el.textContent='00:00';return}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});tick();S.timer=setInterval(tick,1000)}
function showModal(title,body,actions=''){modal.classList.remove('hidden');modal.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="btn small" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions||'<button class="btn" data-close>ปิด</button>'}</div></div>`;$$('[data-close]',modal).forEach(b=>b.onclick=()=>modal.classList.add('hidden'))}
async function openLesson(id){S.lessonId=String(id);try{const p=await rpc('student_v8_open_lesson',{p_topic_id:String(id)}),i=S.data.progress.findIndex(x=>String(x.topic_id)===String(id));if(i>=0)S.data.progress[i]=p;else S.data.progress.push(p)}catch(e){toast(e.message,true)}render()}async function completeLesson(id){try{const p=await rpc('student_v8_complete_lesson',{p_topic_id:String(id)}),i=S.data.progress.findIndex(x=>String(x.topic_id)===String(id));if(i>=0)S.data.progress[i]=p;else S.data.progress.push(p);toast('บันทึกว่าเรียนจบแล้ว');const ts=topics(S.courseId),idx=ts.findIndex(t=>String(t.id)===String(id));if(idx<ts.length-1)S.lessonId=ts[idx+1].id;render()}catch(e){toast(e.message,true)}}async function loadAsset(id){const a=S.data.assets.find(x=>String(x.id)===String(id));try{const {data,error}=await sb.storage.from(a.bucket||'tutor-os-assets').createSignedUrl(a.storage_path,3600);if(error)throw error;S.signed[id]=data.signedUrl;render()}catch(e){toast(e.message,true)}}
function uploadSlip(id){const p=S.data.payment_requests.find(x=>x.id===id);showModal('อัปโหลดสลิป',`<form id="slip"><div class="message">${esc(p.title)} · ${money(p.amount)}</div><div class="field"><label>ไฟล์สลิป</label><input class="input" type="file" name="file" accept="image/*,application/pdf" required></div><div class="field"><label>หมายเหตุ</label><textarea class="textarea" name="note"></textarea></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="send-slip">อัปโหลดและยืนยัน</button>`);$('#send-slip').onclick=async()=>{const f=$('#slip'),file=f.file.files[0];if(!file)return toast('กรุณาเลือกสลิป',true);const path=`${S.session.user.id}/${id}/${Date.now()}-${file.name.replace(/[^\w.ก-๙-]+/g,'-')}`;try{const {error}=await sb.storage.from('portal-slips').upload(path,file,{contentType:file.type||undefined});if(error)throw error;await rpc('student_v8_submit_slip',{p_payment_request_id:id,p_storage_path:path,p_original_filename:file.name,p_amount:p.amount,p_note:new FormData(f).get('note')||''});modal.classList.add('hidden');toast('ส่งสลิปแล้ว รอแอดมินตรวจ');await load()}catch(e){await sb.storage.from('portal-slips').remove([path]);toast(e.message,true)}}}
function bindPortal(){$$('[data-tab]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;if(S.tab!=='learning'){S.courseId=null;S.lessonId=null}render()});$$('[data-tab-jump]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tabJump;render()});$$('[data-go-catalog]').forEach(b=>b.onclick=()=>{S.tab='catalog';render()});$$('[data-view-owned]').forEach(b=>b.onclick=()=>{S.tab='courses';render()});$$('[data-logout]').forEach(b=>b.onclick=logout);$('[data-refresh]')?.addEventListener('click',()=>load());$$('[data-open-course]').forEach(b=>b.onclick=()=>{S.tab='learning';S.courseId=String(b.dataset.openCourse);S.lessonId=null;render()});$$('[data-lesson]').forEach(b=>b.onclick=()=>openLesson(b.dataset.lesson));$('[data-back-learning]')?.addEventListener('click',()=>{S.courseId=null;S.lessonId=null;render()});$('[data-complete]')?.addEventListener('click',e=>completeLesson(e.currentTarget.dataset.complete));$('[data-prev]')?.addEventListener('click',()=>{const ts=topics(S.courseId),i=ts.findIndex(t=>String(t.id)===String(S.lessonId));if(i>0)openLesson(ts[i-1].id)});$('[data-next]')?.addEventListener('click',()=>{const ts=topics(S.courseId),i=ts.findIndex(t=>String(t.id)===String(S.lessonId));if(i<ts.length-1)openLesson(ts[i+1].id)});$$('[data-load-asset]').forEach(b=>b.onclick=()=>loadAsset(b.dataset.loadAsset));$$('[data-upload-slip]').forEach(b=>b.onclick=()=>uploadSlip(b.dataset.uploadSlip));$$('[data-refresh-payment]').forEach(b=>b.onclick=async()=>{try{await rpc('student_v8_refresh_payment',{p_payment_request_id:b.dataset.refreshPayment});toast('สร้าง QR ใหม่แล้ว');await load()}catch(e){toast(e.message,true)}});$$('[data-enroll]').forEach(b=>b.onclick=()=>{const [cid,type]=b.dataset.enroll.split(':');const c=course(cid);if(!confirm(`${type==='renewal'?'ต่อ':'สมัคร'}คอร์ส ${c?.title||''} ผ่านระบบสมัครเรียนหลักใช่หรือไม่?`))return;location.href=`../?student=old&course=${encodeURIComponent(cid)}&source=student-portal&type=${encodeURIComponent(type)}`});$$('[data-renew]').forEach(b=>b.onclick=()=>{S.tab='catalog';render()});$('[data-go-pay]')?.addEventListener('click',()=>{S.tab='payments';render()});$('#open-installment-plan')?.addEventListener('click',()=>{if(typeof window.__AREWARIN_OPEN_INSTALLMENTS__==='function')window.__AREWARIN_OPEN_INSTALLMENTS__();else toast('กำลังเตรียมข้อมูลแผนชำระ กรุณาลองอีกครั้ง',true)});$$('[data-read]').forEach(b=>b.onclick=async()=>{await rpc('student_v8_mark_notification_read',{p_id:String(b.dataset.read)});await load()});$('#profile')?.addEventListener('submit',saveProfile);$$('[data-reschedule]').forEach(b=>b.onclick=()=>openReschedule(b.dataset.reschedule));$$('[data-submit-assignment]').forEach(b=>b.onclick=()=>openAssignmentSubmit(b.dataset.submitAssignment));$$('[data-receipt-token]').forEach(b=>b.onclick=()=>window.open(`${CONFIG.url}/functions/v1/get-receipt?token=${encodeURIComponent(b.dataset.receiptToken)}`,'_blank'));$('#newSupportTicket')?.addEventListener('click',openSupportTicket);$('#newRequestTicket')?.addEventListener('click',openSupportTicket);$$('[data-ticket]').forEach(b=>b.onclick=()=>openTicket(b.dataset.ticket));$('#newParentLink')?.addEventListener('click',createParentLink);$$('[data-revoke-parent]').forEach(b=>b.onclick=()=>revokeParentLink(b.dataset.revokeParent));$('#changePasswordForm')?.addEventListener('submit',changePassword);$('#logoutOtherDevices')?.addEventListener('click',logoutOtherDevices);bindPwaInstall()}

function openReschedule(id){const ev=(S.data.v16_schedule||[]).find(x=>x.id===id);showModal('ขอเลื่อนเวลาเรียน',`<form id="rescheduleForm"><div class="message">${esc(ev?.title||'คาบเรียน')} · ${dateTime(ev?.start_at)}</div><div class="field"><label>วันและเวลาใหม่ที่สะดวก</label><input class="input" type="datetime-local" name="start_at" required></div><div class="field"><label>เหตุผล / เวลาสำรอง</label><textarea class="textarea" name="reason" required></textarea></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="submitReschedule">ส่งคำขอ</button>`);$('#submitReschedule').onclick=async()=>{const f=$('#rescheduleForm'),fd=new FormData(f),start=fd.get('start_at');try{await rpc('student_v16_request_reschedule',{p_event_id:id,p_requested_start_at:new Date(start).toISOString(),p_reason:String(fd.get('reason')||'')});modal.classList.add('hidden');toast('ส่งคำขอเลื่อนเรียนแล้ว');await load()}catch(e){toast(e.message,true)}}}
function openAssignmentSubmit(id){const a=(S.data.v16_assignments||[]).find(x=>x.id===id);showModal('ส่งงาน',`<form id="assignmentSubmitForm"><div class="message">${esc(a?.title||'Assignment')}</div><div class="field"><label>คำตอบ / ลิงก์งาน</label><textarea class="textarea" name="text" placeholder="พิมพ์คำตอบ หรือลิงก์ Google Drive/Canva ฯลฯ"></textarea></div><div class="field"><label>ไฟล์แนบ (ถ้ามี)</label><input class="input" type="file" name="files" multiple accept="image/*,application/pdf,.doc,.docx,.ppt,.pptx"></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="sendAssignment">ส่งงาน</button>`);$('#sendAssignment').onclick=async()=>{const f=$('#assignmentSubmitForm'),fd=new FormData(f),files=[...f.files.files],paths=[];try{for(const file of files){const path=`${S.session.user.id}/${id}/${Date.now()}-${file.name.replace(/[^\\w.ก-๙-]+/g,'-')}`;const {error}=await sb.storage.from('student-assignment-files').upload(path,file,{contentType:file.type||undefined});if(error)throw error;paths.push(path)}await rpc('student_v16_submit_assignment',{p_assignment_id:id,p_submission_text:String(fd.get('text')||''),p_file_paths:paths});modal.classList.add('hidden');toast('ส่งงานเรียบร้อย');await load()}catch(e){toast(e.message,true)}}}
function openSupportTicket(){showModal('เปิด Support Ticket',`<form id="ticketForm"><div class="field"><label>ประเภท</label><select class="select" name="category"><option value="hours">ชั่วโมงเรียน</option><option value="schedule">ตารางเรียน</option><option value="payment">การชำระเงิน</option><option value="course">คอร์ส / บทเรียน</option><option value="account">บัญชี</option><option value="other">อื่น ๆ</option></select></div><div class="field"><label>หัวข้อ</label><input class="input" name="subject" required></div><div class="field"><label>รายละเอียด</label><textarea class="textarea" name="description" required></textarea></div></form>`,`<button class="btn" data-close>ยกเลิก</button><button class="btn primary" id="createTicket">ส่ง Ticket</button>`);$('#createTicket').onclick=async()=>{const fd=new FormData($('#ticketForm'));try{await rpc('student_v16_create_ticket',{p_category:String(fd.get('category')),p_subject:String(fd.get('subject')),p_description:String(fd.get('description'))});modal.classList.add('hidden');toast('ส่ง Ticket แล้ว');await load()}catch(e){toast(e.message,true)}}}
function openTicket(id){const t=(S.data.v16_support_tickets||[]).find(x=>x.id===id),msgs=(S.data.v16_support_messages||[]).filter(x=>x.ticket_id===id);showModal(t?.subject||'Ticket',`<div class="ticket-thread">${msgs.map(m=>`<div class="ticket-message ${m.sender_type}"><b>${m.sender_type==='student'?'นักเรียน':'AreWarin Team'}</b><p>${esc(m.message)}</p><small>${dateTime(m.created_at)}</small></div>`).join('')||`<div class="message">${esc(t?.description||'')}</div>`}</div>${!['closed'].includes(t?.status)?`<form id="ticketReply"><div class="field"><label>ตอบกลับ</label><textarea class="textarea" name="message" required></textarea></div></form>`:''}`,!['closed'].includes(t?.status)?`<button class="btn" data-close>ปิด</button><button class="btn primary" id="sendTicketReply">ส่งข้อความ</button>`:'<button class="btn" data-close>ปิด</button>');$('#sendTicketReply')?.addEventListener('click',async()=>{const msg=new FormData($('#ticketReply')).get('message');try{await rpc('student_v16_reply_ticket',{p_ticket_id:id,p_message:String(msg||'')});modal.classList.add('hidden');toast('ส่งข้อความแล้ว');await load()}catch(e){toast(e.message,true)}})}
async function createParentLink(){const name=prompt('ชื่อผู้ปกครอง');if(!name)return;const rel=prompt('ความสัมพันธ์ เช่น มารดา / บิดา','ผู้ปกครอง')||'ผู้ปกครอง';try{const r=await rpc('student_v16_create_parent_link',{p_parent_name:name,p_relationship:rel});await window.AWAlert.info('รหัสสำหรับผู้ปกครอง',`${r.token}\n\nส่งรหัสนี้ให้ผู้ปกครอง และเปิดหน้า /parent/\nรหัสจะแสดงให้เห็นเพียงครั้งนี้`);await load()}catch(e){toast(e.message,true)}}
async function revokeParentLink(id){if(!confirm('ปิดสิทธิ์ผู้ปกครองรหัสนี้?'))return;try{await rpc('student_v16_revoke_parent_link',{p_link_id:id});toast('ปิดสิทธิ์แล้ว');await load()}catch(e){toast(e.message,true)}}
async function changePassword(e){e.preventDefault();const fd=new FormData(e.currentTarget),p=String(fd.get('password')||'');if(p!==String(fd.get('confirm')||''))return toast('รหัสผ่านไม่ตรงกัน',true);try{const {error}=await sb.auth.updateUser({password:p});if(error)throw error;toast('เปลี่ยนรหัสผ่านแล้ว');e.currentTarget.reset()}catch(x){toast(x.message,true)}}
async function logoutOtherDevices(){if(!confirm('ออกจากระบบอุปกรณ์อื่นทั้งหมด?'))return;try{const {error}=await sb.auth.signOut({scope:'others'});if(error)throw error;await rpc('student_v16_revoke_other_devices',{p_current_device_key:S.deviceKey||''});toast('ออกจากระบบอุปกรณ์อื่นแล้ว');await load()}catch(e){toast(e.message,true)}}
let deferredPwaPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPwaPrompt=e;const b=document.getElementById('installPwa');if(b)b.style.display='inline-flex'});function bindPwaInstall(){const b=$('#installPwa');if(b&&deferredPwaPrompt){b.style.display='inline-flex';b.onclick=async()=>{deferredPwaPrompt.prompt();await deferredPwaPrompt.userChoice;deferredPwaPrompt=null;b.style.display='none'}}}
async function saveProfile(e){e.preventDefault();try{const {data,error}=await sb.rpc('update_my_student_profile',{p_profile:Object.fromEntries(new FormData(e.currentTarget).entries())});if(error)throw error;S.data.student=data;toast('บันทึกข้อมูลแล้ว');render()}catch(x){toast(x.message,true)}}
async function registerDevice(){if(!S.session?.user)return;let key=localStorage.getItem('arewarin_student_device_key');if(!key){key=(crypto.randomUUID?crypto.randomUUID():`${Date.now()}-${Math.random()}`);localStorage.setItem('arewarin_student_device_key',key)}S.deviceKey=key;const name=`${navigator.platform||'Device'} · ${(/Mobile|Android|iPhone/i.test(navigator.userAgent)?'Mobile':'Browser')}`;await rpc('student_v16_register_device',{p_device_key:key,p_device_name:name,p_user_agent:navigator.userAgent.slice(0,500)})}
async function load(renderNow=true){if(renderNow)app.innerHTML='<div class="loading"><div><div class="spinner"></div><b>กำลังโหลดคอร์สและความคืบหน้า...</b></div></div>';try{try{S.data=await rpc('student_v17_bootstrap')}catch(v17err){try{S.data=await rpc('student_v16_bootstrap')}catch(v16err){try{S.data=await rpc('student_v12_bootstrap')}catch(v12err){if(/student_v12_bootstrap|does not exist|schema cache/i.test(String(v12err?.message||v12err)))S.data=await rpc('student_v11_bootstrap');else throw v12err}}}if(renderNow)S.signed={};try{await registerDevice()}catch{}if(renderNow||S.tab!=='learning')render()}catch(e){app.innerHTML=`<div class="loading"><div class="auth-card"><h2>เปิด Student Portal ไม่สำเร็จ</h2><div class="message error">${esc(e.message)}</div><form id="claim"><div class="field"><label>เบอร์โทรเพื่อเชื่อมบัญชี</label><input class="input" name="phone" required></div><button class="btn primary wide">เชื่อมบัญชี</button></form><button class="btn wide" data-logout style="margin-top:8px">ออกจากระบบ</button></div></div>`;$('#claim').onsubmit=async ev=>{ev.preventDefault();const {error}=await sb.rpc('claim_student_account_by_phone',{p_phone:normalizePhone(new FormData(ev.currentTarget).get('phone'))});if(error)return toast(error.message,true);await load()};$('[data-logout]').onclick=logout}}

function bindAuth(){if(S.signupResult){$('#enter').onclick=()=>{S.signupResult=null;load()};$('#later').onclick=()=>{S.signupResult=null;S.mode='login';app.innerHTML=authHtml();bindAuth()};return}if(S.mode==='recovery'){const f=$('#recovery');f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),box=$('#msg'),phone=normalizePhone(fd.get('phone')),email=String(fd.get('email')).trim().toLowerCase(),pin=String(fd.get('pin')),password=String(fd.get('password'));if(password!==fd.get('confirm'))return box.innerHTML='<div class="message error">รหัสผ่านไม่ตรงกัน</div>';box.innerHTML='<div class="message">กำลังเปลี่ยนรหัส...</div>';try{await callStudentAuth('reset_password',{phone,email,pin,new_password:password});const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;await load()}catch(x){box.innerHTML=`<div class="message error">${esc(friendly(x))}</div>`}};$('#back').onclick=()=>{S.mode='login';app.innerHTML=authHtml();bindAuth()};return}$$('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.signupMatch=null;if(S.mode!=='quick')S.quickResult=null;app.innerHTML=authHtml();bindAuth()});$('#quickAgain')?.addEventListener('click',()=>{S.quickResult=null;app.innerHTML=authHtml();bindAuth()});$('#forgot')?.addEventListener('click',()=>{S.mode='recovery';app.innerHTML=authHtml();bindAuth()});$('#lookup')?.addEventListener('click',lookup);$('#change-phone')?.addEventListener('click',()=>{S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});$('#password')?.addEventListener('input',e=>{const i=passwordInfo(e.target.value,$('input[name=email]')?.value,S.signupPhone);$('#strength').style.width=i.pct+'%';$('#strength-label').textContent=i.label});$$('[data-toggle-password]').forEach(btn=>btn.onclick=()=>{const input=btn.closest('.password-wrap')?.querySelector('input');if(!input)return;const show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'ซ่อน':'แสดง'});$('#auth-form').onsubmit=S.mode==='quick'?submitQuickHours:submitAuth}
async function submitQuickHours(e){e.preventDefault();const fd=new FormData(e.currentTarget),box=$('#msg'),studentCode=String(fd.get('student_code')||'').trim().toUpperCase(),pin=String(fd.get('pin')||'');box.innerHTML='<div class="message">กำลังตรวจสอบชั่วโมงล่าสุด...</div>';try{const {data,error}=await sb.rpc('student_quick_hours',{p_student_code:studentCode,p_pin:pin});if(error)throw error;if(!data?.ok)throw new Error(data?.message||'ตรวจสอบไม่สำเร็จ');S.quickResult=data;app.innerHTML=authHtml();bindAuth()}catch(x){box.innerHTML=`<div class="message error">${esc(x.message||'ตรวจสอบไม่สำเร็จ')}</div>`}}
async function lookup(){const phone=normalizePhone($('#phone').value),box=$('#msg');S.signupPhone=phone;if(phone.length<9)return box.innerHTML='<div class="message error">กรุณากรอกเบอร์ให้ครบ</div>';box.innerHTML='<div class="message">กำลังค้นหา...</div>';try{const {data,error}=await sb.rpc('lookup_student_by_phone',{p_phone:phone});if(error)throw error;if(!data?.found)throw new Error(data?.message||'ไม่พบข้อมูล');S.signupMatch={...data,phone};app.innerHTML=authHtml();bindAuth()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function submitAuth(e){e.preventDefault();const fd=new FormData(e.currentTarget),box=$('#msg'),email=String(fd.get('email')||'').trim().toLowerCase(),password=String(fd.get('password')||'');box.innerHTML='<div class="message">กำลังดำเนินการ...</div>';try{if(S.mode==='login'){const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;await load();return}if(!S.signupMatch)throw new Error('กรุณาตรวจสอบเบอร์ก่อน');if(email!==String(fd.get('confirm_email')).trim().toLowerCase())throw new Error('อีเมลไม่ตรงกัน');if(password!==fd.get('confirm_password'))throw new Error('รหัสผ่านไม่ตรงกัน');const pin=String(fd.get('pin')),confirmPin=String(fd.get('confirm_pin'));if(!/^\d{4}$/.test(pin)||pin!==confirmPin)throw new Error('PIN ต้องเป็นเลข 4 หลักและตรงกัน');if(['0000','1111','1234','4321'].includes(pin))throw new Error('PIN เดาง่ายเกินไป');const info=passwordInfo(password,email,S.signupPhone);if(!info.checks.len||!info.checks.number||!info.checks.letter||!info.checks.nospace||info.score<3)throw new Error('รหัสผ่านยังไม่รัดกุมพอ');const r=await callStudentAuth('register',{phone:S.signupPhone,email,password,pin});const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;S.signupResult={display_name:r.display_name||S.signupMatch.display_name,email,student_code:r.student_code||S.signupMatch.student_code};app.innerHTML=authHtml();bindAuth()}catch(x){box.innerHTML=`<div class="message error">${esc(friendly(x))}</div>`}}
async function logout(){clearInterval(S.poll);clearInterval(S.timer);await sb.auth.signOut({scope:'local'});S.session=null;S.data=null;S.mode='login';S.signupMatch=null;S.signupResult=null;app.innerHTML=authHtml();bindAuth()}

<script type="module" id="awv9-student-pay-script">
import {createClient} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/+esm";
const __cfg=window.AREWARIN_CONFIG||{SUPABASE_URL:"https://ihmiqtwclnqrezsnswfz.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_wODtFcX141odUfA1FxZckQ_OXXkOZLR"};window.AREWARIN_CONFIG=__cfg;const sbp=window.__AREWARIN_STUDENT_SB||createClient(__cfg.SUPABASE_URL,__cfg.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});

const P={data:null,timer:null,user:null};
const pe=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])),pn=v=>Number(v||0),pmoney=v=>new Intl.NumberFormat('th-TH',{style:'currency',currency:'THB',minimumFractionDigits:0,maximumFractionDigits:2}).format(pn(v)),pdate=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium'}).format(new Date(v)):'-';
function ptoast(m,e=false){const x=document.createElement('div');x.className='awv9p-toast'+(e?' error':'');x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),3600)}
async function prpc(name,args={}){const{data,error}=await sbp.rpc(name,args);if(error)throw error;return data}
function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',pn(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}
function insts(plan){return(P.data.installments||[]).filter(i=>i.payment_plan_id===plan.id).sort((a,b)=>pn(a.installment_no)-pn(b.installment_no))}function activeReq(inst){return(P.data.requests||[]).filter(r=>r.installment_id===inst.id&&(r.status==='slip_submitted'||(r.status==='pending'&&new Date(r.expires_at)>new Date()))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]}function subFor(req){return(P.data.submissions||[]).find(s=>s.payment_request_id===req?.id&&s.status==='pending')}
function pstatus(i){return({pending:'รอชำระ',partial:'ชำระบางส่วน',paid:'ชำระครบ',overdue:'เลยกำหนด',cancelled:'ยกเลิก'})[i.status]||i.status}
function renderPay(){const plans=P.data?.plans||[];payLayer.innerHTML=`<div class="awv9p-panel"><div class="awv9p-head"><div><h2>แผนแบ่งชำระและผ่อนจ่าย</h2><div style="font-size:11px;color:#d9def7">PromptPay 1901001151577 · AreWarin Biology</div></div><div><button class="awv9p-btn" data-p-refresh>รีเฟรช</button> <button class="awv9p-btn danger" data-p-close>ปิด</button></div></div><div class="awv9p-body"><div class="awv9p-message">เลือกชำระเต็มงวดหรือใส่ยอดบางส่วน ระบบจะสร้าง QR ที่มีอายุ 15 นาที แล้วอัปโหลดสลิปให้แอดมินตรวจสอบ</div>${plans.length?`<div class="awv9p-grid">${plans.map(planCard).join('')}</div>`:'<div class="awv9p-empty">ยังไม่มีแผนแบ่งชำระ</div>'}${(P.data.teaching_notes||[]).length?`<div class="awv9p-card" style="margin-top:14px"><h3 style="margin-top:0">บันทึกจากผู้สอน</h3>${P.data.teaching_notes.slice(0,20).map(x=>`<div style="padding:11px;border:1px solid #e6eaf3;border-radius:13px;margin-top:8px"><b>${pe(x.topic||'บันทึกหลังเรียน')}</b><div style="font-size:10px;color:#8993a9">${pdate(x.lesson_date)}</div><div style="margin-top:6px">${pe(x.lesson_summary||'')}</div>${x.homework?`<div class="awv9p-message" style="margin-top:8px;margin-bottom:0"><b>การบ้าน:</b> ${pe(x.homework)}</div>`:''}</div>`).join('')}</div>`:''}</div></div>`;bindPay();renderPqrs();startPtimer()}
function planCard(p){const pct=p.total_amount?Math.min(100,Math.round(pn(p.amount_paid)/pn(p.total_amount)*100)):0;return `<article class="awv9p-card"><div class="awv9p-row"><div><span class="awv9p-chip ${p.status==='paid'?'green':'amber'}">${p.status==='paid'?'ชำระครบ':'กำลังผ่อน'}</span><h3 style="margin:8px 0 3px">${pe(p.title)}</h3></div><b>${pmoney(p.balance_amount)}<div style="font-size:10px;color:#8993a9">คงเหลือ</div></b></div><div class="awv9p-row" style="font-size:11px;color:#77819b"><span>ยอดรวม ${pmoney(p.total_amount)}</span><span>รับแล้ว ${pmoney(p.amount_paid)}</span></div><div class="awv9p-progress"><i style="width:${pct}%"></i></div>${insts(p).map(installmentCard).join('')}</article>`}
function installmentCard(i){const balance=Math.max(0,pn(i.amount_due)-pn(i.amount_paid)),req=activeReq(i),sub=subFor(req);return `<div class="awv9p-inst"><b>${i.installment_no}</b><div><div>งวดที่ ${i.installment_no} · ${pdate(i.due_date)}</div><div style="font-size:10px;color:#8993a9">${pmoney(i.amount_paid)} / ${pmoney(i.amount_due)}</div></div><div><span class="awv9p-chip ${i.status==='paid'?'green':i.status==='partial'?'amber':i.status==='overdue'?'red':''}">${pstatus(i)}</span></div>${balance>0&&!req?`<div style="grid-column:1/-1;display:grid;grid-template-columns:1fr auto;gap:8px"><input class="awv9p-input" type="number" step="0.01" min="0.01" max="${balance}" id="pay-amount-${i.id}" value="${balance}"><button class="awv9p-btn primary" data-create-qr="${i.id}">สร้าง QR</button></div>`:''}${req?requestCard(req,sub):''}</div>`}

async function loadPay(){payLayer.classList.add('open');payLayer.innerHTML='<div class="awv9p-panel" style="display:grid;place-items:center;min-height:300px">กำลังโหลดแผนชำระ...</div>';try{P.data=await prpc('student_v9_payment_bootstrap');renderPay()}catch(e){payLayer.innerHTML=`<div class="awv9p-panel" style="padding:22px"><div class="awv9p-message">${pe(e.message)}</div><button class="awv9p-btn danger" data-p-close>ปิด</button></div>`;payLayer.querySelector('[data-p-close]').onclick=()=>payLayer.classList.remove('open')}}

function uploadPartial(id){const req=P.data.requests.find(r=>r.id===id);payLayer.insertAdjacentHTML('beforeend',`<div id="awv9-slip-modal" style="position:fixed;inset:0;z-index:100002;background:rgba(10,16,38,.68);display:grid;place-items:center;padding:18px"><div class="awv9p-card" style="width:min(520px,100%)"><h3>อัปโหลดสลิป ${pmoney(req.amount)}</h3><input class="awv9p-input" type="file" id="awv9-slip-file" accept="image/*,application/pdf"><input class="awv9p-input" style="margin-top:8px" id="awv9-slip-note" placeholder="หมายเหตุ (ถ้ามี)"><div style="display:flex;gap:8px;margin-top:10px"><button class="awv9p-btn" id="awv9-slip-cancel">ยกเลิก</button><button class="awv9p-btn primary" id="awv9-slip-send">อัปโหลดและยืนยัน</button></div></div></div>`);document.getElementById('awv9-slip-cancel').onclick=()=>document.getElementById('awv9-slip-modal').remove();document.getElementById('awv9-slip-send').onclick=async()=>{const file=document.getElementById('awv9-slip-file').files[0];if(!file)return ptoast('กรุณาเลือกไฟล์',true);const path=`${P.user.id}/${id}/${Date.now()}-${file.name.replace(/[^\w.ก-๙-]+/g,'-')}`;try{const{error}=await sbp.storage.from('portal-slips').upload(path,file,{contentType:file.type||undefined});if(error)throw error;await prpc('student_v8_submit_slip',{p_payment_request_id:id,p_storage_path:path,p_original_filename:file.name,p_amount:req.amount,p_note:document.getElementById('awv9-slip-note').value||''});document.getElementById('awv9-slip-modal').remove();ptoast('ส่งสลิปแล้ว');await loadPay()}catch(e){await sbp.storage.from('portal-slips').remove([path]);ptoast(e.message,true)}}}
