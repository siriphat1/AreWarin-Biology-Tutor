<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="color-scheme" content="light dark">
<title>AreWarin Biology · Student Hub</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   AREWARIN STUDENT HUB — V21 "AURORA" DESIGN SYSTEM
   Complete visual + UX rebuild. Self-contained prototype.
   ============================================================ */
:root{
  --brand1:#4f46e5; --brand2:#06b6d4; --brand3:#a855f7; --pink:#ec4899;
  --green:#10b981; --amber:#f59e0b; --red:#ef4444; --sky:#0ea5e9;
  --ink:#10162b; --muted:#6b7488; --faint:#9aa3ba;
  --bg:#eef1fb; --surface:#ffffff; --surface-soft:#f6f8ff; --line:#e6e9f6;
  --shadow-sm:0 6px 18px -10px rgba(30,41,89,.18);
  --shadow-md:0 20px 46px -26px rgba(30,41,89,.28);
  --shadow-lg:0 36px 80px -40px rgba(30,41,89,.38);
  --radius-xl:28px; --radius-lg:22px; --radius-md:16px; --radius-sm:12px;
  --grad-brand:linear-gradient(135deg,var(--brand1),var(--brand3) 55%,var(--brand2));
  --grad-sun:linear-gradient(135deg,#fb923c,var(--pink));
  --grad-mint:linear-gradient(135deg,#22d3a8,var(--sky));
  --font:"Prompt",system-ui,sans-serif;
}
body.dark{
  --ink:#eef1fb; --muted:#a6accb; --faint:#7c85ab;
  --bg:#0a0e1c; --surface:#131a30; --surface-soft:#0f1526; --line:#232b47;
  --shadow-sm:0 6px 18px -10px rgba(0,0,0,.5);
  --shadow-md:0 20px 46px -26px rgba(0,0,0,.6);
  --shadow-lg:0 36px 80px -40px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--bg);
  min-height:100vh;-webkit-tap-highlight-color:transparent;transition:background .35s,color .35s;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
::selection{background:var(--brand1);color:#fff}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
:focus-visible{outline:3px solid rgba(79,70,229,.35);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
img{max-width:100%}
a{color:inherit}

/* ---------- Loading Splash ---------- */
.splash{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:999;transition:opacity .4s}
.splash-mark{width:74px;height:74px;border-radius:24px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:32px;font-weight:900;box-shadow:var(--shadow-lg);animation:pulseGlow 1.8s ease-in-out infinite}
@keyframes pulseGlow{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(79,70,229,.35)}50%{transform:scale(1.06);box-shadow:0 0 0 18px rgba(79,70,229,0)}}
.splash p{margin-top:18px;color:var(--muted);font-size:12px;font-weight:600;letter-spacing:.05em}

/* ---------- Toasts ---------- */
#toastHost{position:fixed;top:max(16px,env(safe-area-inset-top));right:16px;z-index:9999;display:grid;gap:10px;width:min(360px,calc(100vw - 32px))}
.toast{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:13px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-md);animation:toastIn .25s ease-out}
.toast b{display:block;font-size:12.5px}
.toast span{display:block;margin-top:2px;font-size:10.5px;color:var(--muted);line-height:1.5}
.toast .ic{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;font-weight:800;font-size:12px;background:#eef0ff;color:var(--brand1)}
.toast.success .ic{background:#e7fbf1;color:var(--green)}
.toast.error .ic{background:#fef1f1;color:var(--red)}
.toast button{border:0;background:transparent;color:var(--faint);font-size:15px;line-height:1;padding:0}
@keyframes toastIn{from{opacity:0;transform:translateY(-10px) scale(.97)}to{opacity:1;transform:none}}

/* ============================================================
   AUTH SCREEN
   ============================================================ */
.auth-wrap{min-height:100vh;display:grid;grid-template-columns:1.15fr 1fr;background:var(--bg)}
.auth-hero{position:relative;overflow:hidden;padding:clamp(32px,5vw,68px);display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(circle at 15% 8%,rgba(168,85,247,.35),transparent 40%),
             radial-gradient(circle at 85% 90%,rgba(6,182,212,.3),transparent 42%),
             linear-gradient(155deg,#0b0f2c 0%,#1e1a52 45%,#2b1f6b 75%,#123a5e 100%);
  color:#fff}
.auth-hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.06) 1px,transparent 1.4px);background-size:26px 26px;opacity:.5;mask-image:linear-gradient(180deg,rgba(0,0,0,.5),transparent 75%)}
.blob{position:absolute;border-radius:50%;filter:blur(4px);opacity:.55;animation:float 9s ease-in-out infinite}
.blob.b1{width:280px;height:280px;background:radial-gradient(circle,rgba(236,72,153,.5),transparent 70%);right:-90px;top:-70px}
.blob.b2{width:220px;height:220px;background:radial-gradient(circle,rgba(6,182,212,.45),transparent 70%);left:-60px;bottom:-40px;animation-delay:-3s}
@keyframes float{0%,100%{transform:translateY(0) translateX(0)}50%{transform:translateY(-18px) translateX(10px)}}
.auth-brand{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.brand-mark{width:52px;height:52px;border-radius:18px;background:var(--grad-brand);display:grid;place-items:center;font-weight:900;font-size:22px;box-shadow:0 16px 34px -14px rgba(79,70,229,.7)}
.auth-brand strong{display:block;font-size:18px;font-weight:800}
.auth-brand small{display:block;color:#c7ceef;font-size:10.5px;margin-top:2px}
.auth-copy{position:relative;z-index:2;max-width:600px;margin:auto 0;padding:36px 0}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);font-size:9.5px;font-weight:800;letter-spacing:.16em;color:#dfe4ff}
.auth-copy h1{font-size:clamp(38px,4.6vw,60px);line-height:1.08;letter-spacing:-.03em;margin:16px 0 14px;font-weight:800}
.auth-copy h1 em{font-style:normal;background:linear-gradient(120deg,#fbc2eb,#a6c1ee 60%,#7de2d1);-webkit-background-clip:text;background-clip:text;color:transparent}
.auth-copy p{color:#cdd3f2;font-size:13.5px;line-height:1.85;margin:0 0 22px;max-width:520px}
.feature-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.feature-row div{padding:14px;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(10px)}
.feature-row b{display:block;font-size:11px}
.feature-row span{display:block;font-size:9.5px;color:#c3caee;margin-top:4px;line-height:1.5}
.auth-foot{position:relative;z-index:2;display:flex;gap:14px;flex-wrap:wrap;font-size:9.5px;color:#c3caee}
.auth-foot span{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}

.auth-panel{display:grid;place-items:center;padding:32px}
.auth-card{width:min(430px,100%);background:var(--surface);border:1px solid var(--line);border-radius:30px;padding:30px;box-shadow:var(--shadow-lg)}
.auth-card-head{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.auth-ic{width:46px;height:46px;flex:0 0 46px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#eef0ff,#e0f7ff);color:var(--brand1);font-size:18px;font-weight:800}
.auth-card-head h2{margin:2px 0 3px;font-size:25px;font-weight:800;letter-spacing:-.02em}
.auth-card-head p{margin:0;font-size:11px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;background:var(--surface-soft);border:1px solid var(--line);border-radius:16px;padding:5px;margin:16px 0 18px}
.seg button{border:0;background:transparent;padding:11px 6px;border-radius:12px;font-weight:700;font-size:10.5px;color:var(--muted)}
.seg button.active{background:var(--surface);color:var(--brand1);box-shadow:var(--shadow-sm)}
.f-field{display:grid;gap:6px;margin-bottom:13px}
.f-field label{font-size:10.5px;font-weight:700;color:var(--muted)}
.f-input{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface-soft);outline:none;font-size:13px;transition:border-color .18s,box-shadow .18s}
.f-input:focus{border-color:var(--brand1);box-shadow:0 0 0 4px rgba(79,70,229,.13)}
.pw-wrap{position:relative}
.pw-wrap .f-input{padding-right:64px}
.pw-toggle{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:#eef0ff;color:var(--brand1);font-size:9.5px;font-weight:800;padding:8px 10px;border-radius:10px}
.row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:2px 0 16px;font-size:10px;color:var(--muted)}
.link-btn{border:0;background:transparent;color:var(--brand1);font-weight:800;font-size:10.5px;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:15px;padding:12px 16px;font-weight:700;font-size:12px;transition:transform .15s,box-shadow .15s,background .2s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.98)}
.btn.wide{width:100%}
.btn.primary{background:var(--grad-brand);color:#fff;border-color:transparent;box-shadow:0 18px 34px -18px rgba(79,70,229,.65)}
.btn.soft{background:var(--surface-soft);border-color:var(--line)}
.btn.success{background:#e9fbf1;color:var(--green);border-color:#c6f3da}
.btn.warn{background:#fff5e6;color:#b9720e;border-color:#fde3b8}
.btn.danger{background:#fff0f0;color:var(--red);border-color:#fdd4d4}
.btn.small{padding:8px 11px;font-size:10.5px;border-radius:11px}
.btn:disabled{opacity:.6;cursor:wait}
.spin{width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:10px;margin:15px 0;color:var(--faint);font-size:9px}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.msg{padding:11px 13px;border-radius:13px;background:#eef2ff;border:1px solid #dbe2ff;color:#2a3d9c;font-size:11px;line-height:1.6;margin-bottom:13px}
.msg.error{background:#fff1f1;border-color:#fdd7d7;color:#b91c1c}
.msg.success{background:#eafbf1;border-color:#c6f3da;color:#0f7a4c}
.match-card{display:grid;grid-template-columns:42px 1fr auto;gap:12px;align-items:center;padding:13px;border-radius:18px;background:linear-gradient(135deg,#f3f6ff,#eef8ff);border:1px solid #dbe4ff;margin-bottom:16px}
.match-ic{width:42px;height:42px;border-radius:13px;background:#e6fbf1;color:var(--green);display:grid;place-items:center;font-weight:900}
.match-card strong{display:block;font-size:13px}
.match-card span{display:block;font-size:9.5px;color:var(--muted);margin-top:2px}
.step-tag{display:inline-flex;align-items:center;gap:8px;font-size:10px;font-weight:800;color:var(--brand1);margin:14px 0 10px}
.step-tag i{width:22px;height:22px;border-radius:8px;background:#eef0ff;display:grid;place-items:center;font-style:normal;font-size:10px}
.strength-bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.strength-bar i{display:block;height:100%;background:linear-gradient(90deg,#f87171,#f59e0b,#10b981);transition:width .2s}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pin-input{text-align:center;letter-spacing:.5em;font-size:16px;font-weight:800}
.auth-home{display:flex;justify-content:center;margin-top:14px;font-size:10.5px;color:var(--muted);text-decoration:none;font-weight:600}

@media(max-width:980px){
  .auth-wrap{grid-template-columns:1fr}
  .auth-hero{display:none}
  .auth-panel{padding:20px}
}
@media(max-width:480px){
  .auth-card{padding:22px;border-radius:24px}
  .two-col{grid-template-columns:1fr}
}

/* ============================================================
   PORTAL SHELL
   ============================================================ */
.shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(190deg,#0e1230,#1a1650 55%,#1f1f5c);color:#fff;padding:22px 16px;display:flex;flex-direction:column}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 20px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.sb-brand strong{display:block;font-size:15px;font-weight:800}
.sb-brand small{display:block;color:#a6aee0;font-size:9.5px;margin-top:2px}
.sb-student{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;padding:13px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);margin-bottom:16px}
.sb-avatar{width:42px;height:42px;border-radius:13px;background:var(--grad-brand);display:grid;place-items:center;font-weight:800;font-size:16px}
.sb-student b{display:block;font-size:12px}
.sb-student span{display:block;font-size:9px;color:#a9b0e0;margin-top:2px}
.sb-nav{display:grid;gap:5px;flex:1;overflow-y:auto}
.sb-nav button{display:grid;grid-template-columns:36px 1fr auto;gap:10px;align-items:center;border:0;background:transparent;color:#b7bce6;border-radius:14px;padding:10px 11px;text-align:left;font-weight:600;font-size:11.5px;position:relative}
.sb-nav button .ic{width:36px;height:36px;border-radius:11px;background:rgba(255,255,255,.05);display:grid;place-items:center;font-size:14px}
.sb-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.sb-nav button.active{background:var(--grad-brand);color:#fff;box-shadow:0 14px 26px -16px rgba(124,58,237,.7)}
.sb-nav button.active .ic{background:rgba(255,255,255,.18)}
.nav-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--pink);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.sb-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);display:grid;gap:8px}
.sb-foot button{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);color:#fff;border-radius:13px}
.theme-toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 12px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);font-size:10.5px;color:#d6dafc}
.theme-toggle button{width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.18);position:relative;border:0}
.theme-toggle button::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
.theme-toggle button.on::after{transform:translateX(18px)}

.main{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 26px;background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
.tb-title .eyebrow-sm{font-size:8.5px;font-weight:800;letter-spacing:.15em;color:var(--brand1)}
.tb-title h1{margin:4px 0 0;font-size:22px;font-weight:800;letter-spacing:-.02em}
.tb-title p{margin:2px 0 0;font-size:10.5px;color:var(--muted)}
.tb-tools{display:flex;align-items:center;gap:9px}
.tb-search{width:min(300px,26vw);height:42px;border-radius:13px;background:var(--surface-soft);border:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 12px}
.tb-search input{border:0;background:transparent;outline:0;width:100%;font-size:11.5px}
.tb-icon{width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;position:relative}
.tb-icon .dot{position:absolute;top:-4px;right:-4px;width:18px;height:18px;border-radius:99px;background:var(--pink);color:#fff;font-size:8.5px;display:grid;place-items:center;font-weight:800;border:2px solid var(--surface)}
.tb-chip{display:flex;align-items:center;gap:8px;padding:5px 11px 5px 5px;border-radius:13px;border:1px solid var(--line);background:var(--surface)}
.tb-chip .av{width:30px;height:30px;border-radius:9px;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:800}
.tb-chip b{display:block;font-size:10px}
.tb-chip span{display:block;font-size:8px;color:var(--faint)}

.content{padding:22px 26px 100px;max-width:1500px;margin:0 auto;animation:fadeUp .32s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Cards / generic ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:20px;box-shadow:var(--shadow-md)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}
.sec-head h2{margin:0;font-size:18px;font-weight:800}
.sec-head p{margin:4px 0 0;font-size:11px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:99px;font-size:10px;font-weight:700;background:var(--surface-soft);border:1px solid var(--line);color:var(--muted)}
.chip.green{background:#e9fbf1;color:var(--green);border-color:#c6f3da}
.chip.amber{background:#fff5e6;color:#b9720e;border-color:#fde3b8}
.chip.red{background:#fff0f0;color:var(--red);border-color:#fdd4d4}
.chip.blue{background:#eef2ff;color:var(--brand1);border-color:#dbe2ff}
.progress{height:8px;border-radius:99px;background:var(--surface-soft);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad-brand);border-radius:inherit;transition:width .5s ease}
.empty{padding:36px 20px;text-align:center;color:var(--faint);font-size:12px}

/* ---------- Dashboard ---------- */
.grid-2{display:grid;grid-template-columns:.95fr 1.35fr;gap:16px}
.welcome-card{position:relative;overflow:hidden;padding:22px;background:radial-gradient(circle at 0 0,rgba(79,70,229,.1),transparent 45%),linear-gradient(160deg,var(--surface),var(--surface-soft));border:1px solid var(--line);border-radius:var(--radius-xl);box-shadow:var(--shadow-md)}
.wc-head{display:flex;align-items:center;gap:13px}
.wc-avatar{width:64px;height:64px;border-radius:50%;padding:3px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow-sm)}
.wc-avatar div{width:100%;height:100%;border-radius:50%;background:var(--grad-brand);display:grid;place-items:center;color:#fff;font-size:24px;font-weight:800}
.wc-name{font-size:19px;font-weight:800}
.wc-badge{display:inline-flex;margin-left:6px;padding:3px 8px;border-radius:99px;background:#e9fbf1;color:var(--green);font-size:8px;font-weight:800;border:1px solid #c6f3da}
.wc-code{margin-top:4px;font-size:10px;color:var(--muted)}
.wc-lines{display:grid;gap:8px;margin-top:16px}
.wc-line{display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;font-size:10.5px;color:var(--muted)}
.wc-line i{width:26px;height:26px;border-radius:9px;background:var(--surface-soft);display:grid;place-items:center;font-style:normal;color:var(--brand1)}
.wc-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;gap:8px}
.wc-quote{font-size:10.5px;color:var(--faint);font-style:italic}

.banner{position:relative;border-radius:var(--radius-xl);overflow:hidden;min-height:250px;box-shadow:var(--shadow-lg)}
.banner-track{display:flex;height:100%;transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.slide{min-width:100%;min-height:250px;position:relative;display:flex;align-items:center;padding:0 30px}
.slide.s0{background:linear-gradient(120deg,#4338ca,#7c3aed 55%,#06b6d4)}
.slide.s1{background:linear-gradient(120deg,#0e7490,#059669 60%,#22d3a8)}
.slide.s2{background:linear-gradient(120deg,#be185d,#f97316 60%,#f59e0b)}
.slide::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;border:38px solid rgba(255,255,255,.1)}
.slide-copy{position:relative;z-index:2;color:#fff;max-width:65%}
.slide-copy .badge{display:inline-flex;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.25);font-size:8.5px;font-weight:800;letter-spacing:.08em}

const $  = (q,r=document)=>r.querySelector(q);
const $$ = (q,r=document)=>[...r.querySelectorAll(q)];
const esc = v => String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(title, body='', type='success'){
  const host = $('#toastHost');
  const el = document.createElement('div');
  el.className = 'toast '+type;
  el.innerHTML = `<div class="ic">${type==='error'?'!':'✓'}</div><div><b>${esc(title)}</b>${body?`<span>${esc(body)}</span>`:''}</div><button aria-label="ปิด">×</button>`;
  el.querySelector('button').onclick = ()=>el.remove();
  host.appendChild(el);
  setTimeout(()=>el.remove(), 4200);
}
function showModal(title, body, actions=''){
  const m = $('#modal');
  m.classList.remove('hidden');
  m.innerHTML = `<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button data-close aria-label="ปิด">×</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions||'<button class="btn" data-close>ปิด</button>'}</div></div>`;
  $$('[data-close]', m).forEach(b=>b.onclick = ()=>m.classList.add('hidden'));
}

function passwordStrength(p){
  p = String(p||'');
  let score = 0;
  if(p.length>=8) score++;
  if(/[A-Za-z]/.test(p)) score++;
  if(/\d/.test(p)) score++;
  if(/[^A-Za-z0-9]/.test(p)) score++;
  if(/[a-z]/.test(p)&&/[A-Z]/.test(p)) score++;
  return {score, pct:Math.min(100,score*20), label:['ยังไม่กรอก','อ่อน','พอใช้','ปานกลาง','รัดกุม','รัดกุมมาก'][score]||'ยังไม่กรอก'};
}

function bindAuth(){
  if(S.signupResult) return;
  $$('[data-view]').forEach(b=>b.onclick = ()=>{ S.authView=b.dataset.view; S.signupMatch=null; if(S.authView!=='quick') S.quickResult=null; renderAuth(); });
  $('#quickAgain')?.addEventListener('click', ()=>{ S.quickResult=null; renderAuth(); });
  $('#changePhone')?.addEventListener('click', ()=>{ S.signupMatch=null; renderAuth(); });
  $$('[data-pw-toggle]').forEach(btn=>btn.onclick=()=>{
    const input = btn.closest('.pw-wrap').querySelector('input');
    const show = input.type==='password';
    input.type = show?'text':'password';
    btn.textContent = show?'ซ่อน':'แสดง';
  });
  $('#pwInput')?.addEventListener('input', e=>{
    const s = passwordStrength(e.target.value);
    $('#pwBar').style.width = s.pct+'%';
    $('#pwLabel').textContent = s.label;
  });
  $('#lookupBtn')?.addEventListener('click', ()=>{
    const phone = $('input[name=phone]').value.trim();
    const box = $('#authMsg');
    if(phone.replace(/\D/g,'').length < 9){ box.innerHTML = '<div class="msg error">กรุณากรอกเบอร์ให้ครบ</div>'; return; }
    box.innerHTML = '<div class="msg">กำลังค้นหา…</div>';
    setTimeout(()=>{
      S.signupMatch = {name:'ธันวา ใจสวรรค์', code:'AWS-2026-004821', school:'โรงเรียนสาธิตแห่งมหาวิทยาลัย'};
      renderAuth();
    }, 700);
  });
  $('#authForm').onsubmit = e=>{
    e.preventDefault();
    const box = $('#authMsg');
    const submitBtn = e.currentTarget.querySelector('button[type=submit]');
    const old = submitBtn.innerHTML;
    submitBtn.disabled = true; submitBtn.innerHTML = '<span class="spin"></span> กำลังดำเนินการ…';
    box.innerHTML = '<div class="msg">กำลังตรวจสอบข้อมูล…</div>';
    setTimeout(()=>{
      submitBtn.disabled = false; submitBtn.innerHTML = old;
      if(S.authView==='login'){ S.authed = true; render(); toast('เข้าสู่ระบบสำเร็จ','ยินดีต้อนรับกลับสู่ Student Hub'); return; }
      if(S.authView==='quick'){
        const fd = new FormData(e.currentTarget);
        if(!/^\d{4}$/.test(String(fd.get('pin')))){ box.innerHTML = '<div class="msg error">PIN ต้องเป็นเลข 4 หลัก</div>'; return; }
        S.quickResult = {name:'ธันวา ใจสวรรค์', code:'AWS-2026-004821'};
        renderAuth();
        return;
      }
      // signup
      const fd = new FormData(e.currentTarget);
      if(fd.get('pin')!==fd.get('pin2')){ box.innerHTML = '<div class="msg error">PIN ยืนยันไม่ตรงกัน</div>'; return; }
      if(!/^\d{4}$/.test(String(fd.get('pin')))){ box.innerHTML = '<div class="msg error">PIN ต้องเป็นเลข 4 หลัก</div>'; return; }
      S.signupResult = {name:S.signupMatch.name, code:S.signupMatch.code};
      renderAuth();
    }, 900);
  };
}

/* ============================================================

   ============================================================ */
function bannerGo(i){
  const total = DATA.banners.length;
  S.bannerIndex = (i+total)%total;
  const track = $('#bannerTrack');
  if(track) track.style.transform = `translateX(-${S.bannerIndex*100}%)`;
  $$('.banner-dot').forEach((d,j)=>d.classList.toggle('active', j===S.bannerIndex));
}
function bindBanner(){
  clearInterval(S.bannerTimer);
  $('[data-banner-prev]')?.addEventListener('click', ()=>bannerGo(S.bannerIndex-1));
  $('[data-banner-next]')?.addEventListener('click', ()=>bannerGo(S.bannerIndex+1));
  $$('[data-banner-dot]').forEach(b=>b.onclick = ()=>bannerGo(+b.dataset.bannerDot));
  if(DATA.banners.length>1) S.bannerTimer = setInterval(()=>bannerGo(S.bannerIndex+1), 6000);
}

/* ============================================================
   RENDER ORCHESTRATION
   ============================================================ */
const RENDERERS = {
  dashboard:renderDashboard, schedule:renderSchedule, courses:renderCourses,
  wallet:renderWallet, payments:renderPayments, notifications:renderNotifications, profile:renderProfile
};

function render(){
  clearInterval(S.bannerTimer);
  clearInterval(S.countdownTimer);
  document.body.classList.toggle('dark', S.theme==='dark');
  if(!S.authed){ renderAuth(); return; }
  const app = $('#app');
  app.innerHTML = shell(RENDERERS[S.tab]());
  bindPortal();
  if(S.tab==='dashboard') bindBanner();
  if(S.tab==='payments') startCountdown();
}

function startCountdown(){
  let secs = 14*60+59;
  const el = ()=>$('#qrCountdown');
  const tick = ()=>{
    if(!el()) return;
    const m = String(Math.floor(secs/60)).padStart(2,'0');
    const s = String(secs%60).padStart(2,'0');
    el().textContent = `${m}:${s}`;
    if(secs>0) secs--;
  };
  tick();
  S.countdownTimer = setInterval(tick, 1000);
}

function bindPortal(){
  $$('[data-tab]').forEach(b=>b.onclick = ()=>{ S.tab=b.dataset.tab; if(S.tab!=='courses'){S.courseId=null;S.lessonId=null;} render(); });
  $$('[data-tab-jump]').forEach(b=>b.onclick = ()=>{ S.tab=b.dataset.tabJump; render(); });
  $('#logoutBtn')?.addEventListener('click', doLogout);
  $('#logoutBtn2')?.addEventListener('click', doLogout);
  $('#themeSwitch')?.addEventListener('click', ()=>{ S.theme = S.theme==='dark'?'light':'dark'; render(); });
  $$('[data-open-course]').forEach(b=>b.onclick = ()=>{ S.courseId=b.dataset.openCourse; S.lessonId=null; render(); });
  $('#backToCourses')?.addEventListener('click', ()=>{ S.courseId=null; S.lessonId=null; render(); });
  $$('[data-lesson]').forEach(b=>b.onclick = ()=>{ S.lessonId=b.dataset.lesson; render(); });
  $('#completeLesson')?.addEventListener('click', ()=>{
    const ts = DATA.topics[S.courseId]; const t = ts.find(x=>x.id===S.lessonId);
    if(t && !t.done){ t.done=true; toast('บันทึกแล้ว','มาร์คบทเรียนว่าเรียนจบแล้ว'); }
    render();
  });
  $('#prevLesson')?.addEventListener('click', ()=>{
    const ts = DATA.topics[S.courseId]; const i = ts.findIndex(t=>t.id===S.lessonId);
    if(i>0){ S.lessonId=ts[i-1].id; render(); }
  });
  $('#nextLesson')?.addEventListener('click', ()=>{
    const ts = DATA.topics[S.courseId]; const i = ts.findIndex(t=>t.id===S.lessonId);
    if(i<ts.length-1){ S.lessonId=ts[i+1].id; render(); }
  });
  $$('[data-read]').forEach(b=>b.onclick = ()=>{ DATA.notifications[+b.dataset.read].unread=false; render(); toast('อ่านแล้ว'); });
  $('#uploadSlipBtn')?.addEventListener('click', ()=>{
    showModal('อัปโหลดสลิปการชำระเงิน', `
      <div class="msg">ค่าคอร์สพันธุศาสตร์ & วิวัฒนาการ · ${money(3500)}</div>
      <div class="f-field"><label>ไฟล์สลิป</label><input class="f-input" type="file" accept="image/*"></div>
      <div class="f-field"><label>หมายเหตุ (ถ้ามี)</label><textarea class="f-input" rows="3" style="resize:vertical"></textarea></div>
    `, `<button class="btn soft" data-close>ยกเลิก</button><button class="btn primary" id="confirmSlip">ส่งสลิป</button>`);
    $('#confirmSlip').onclick = ()=>{ $('#modal').classList.add('hidden'); toast('ส่งสลิปแล้ว','รอการตรวจสอบจากแอดมิน'); };
  });
  $('#askReschedule')?.addEventListener('click', ()=>{
    showModal('ขอเลื่อนเวลาเรียน', `
      <div class="msg">ระบบหมุนเวียนเลือด · พ. 16 พ.ย. 16:30–18:30</div>
      <div class="f-field"><label>วันเวลาใหม่ที่สะดวก</label><input class="f-input" type="datetime-local"></div>
      <div class="f-field"><label>เหตุผล</label><textarea class="f-input" rows="3" style="resize:vertical"></textarea></div>
    `, `<button class="btn soft" data-close>ยกเลิก</button><button class="btn primary" id="confirmReschedule">ส่งคำขอ</button>`);
    $('#confirmReschedule').onclick = ()=>{ $('#modal').classList.add('hidden'); toast('ส่งคำขอแล้ว','รอการอนุมัติจากผู้สอน'); };
  });
  $('#editProfileBtn')?.addEventListener('click', ()=>toast('เร็ว ๆ นี้','ฟีเจอร์แก้ไขโปรไฟล์กำลังพัฒนา','error'));
}

function doLogout(){
  S.authed=false; S.tab='dashboard'; S.courseId=null; S.lessonId=null;
  S.signupMatch=null; S.signupResult=null; S.quickResult=null; S.authView='login';
  render();
  toast('ออกจากระบบแล้ว');
}

/* ============================================================
   BOOT
   ============================================================ */
function boot(){
  setTimeout(()=>{
    const splash = $('#splash');
    splash.style.opacity = '0';
    setTimeout(()=>splash.remove(), 400);
    render();
  }, 900);
}

if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot, {once:true});
else boot();

})();
</script>
