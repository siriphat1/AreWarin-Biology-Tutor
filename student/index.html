<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="aw-student-v193-cache-reset">
(async()=>{
  const BUILD='21.0.0-biology-learning-os';
  const KEY='aw_student_live_build';
  try{
    const previous=localStorage.getItem(KEY);
    if(previous!==BUILD){
      localStorage.setItem(KEY,BUILD);

      // Old student/sw.js versions can keep serving stale index.html.
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>{
          const scope=String(r.scope||'');
          return scope.includes('/student') ? r.unregister() : Promise.resolve(false);
        }));
      }

      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(
          keys
            .filter(k=>/student|arewarin|bioare/i.test(k))
            .map(k=>caches.delete(k))
        );
      }

      // A single reload after clearing old PWA caches.
      if(!sessionStorage.getItem('aw_v20_reloaded')){
        sessionStorage.setItem('aw_v20_reloaded','1');
        location.replace(location.pathname+'?v='+Date.now()+location.hash);
        return;
      }
    }
  }catch(e){
    console.warn('[AreWarin Student] cache reset warning',e);
  }
})();
</script>

async function callStudentAuth(action,payload){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),20000);
  let r;
  try{
    r=await fetch(`${CONFIG.url}/functions/v1/student-auth`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':CONFIG.key,
        'Authorization':`Bearer ${CONFIG.key}`,
        'x-client-info':'arewarin-student-v17.2'
      },
      body:JSON.stringify({action,...payload}),
      signal:controller.signal
    });
  }catch(err){
    const aborted=err?.name==='AbortError';
    const e=new Error(aborted
      ?'ระบบบัญชีนักเรียนตอบช้าเกิน 20 วินาที กรุณาลองใหม่'
      :'เชื่อมต่อระบบบัญชีนักเรียนไม่ได้ กรุณาตรวจว่า Edge Function student-auth ถูก Deploy แล้ว');
    e.code=aborted?'student_auth_timeout':'student_auth_unreachable';
    throw e;
  }finally{
    clearTimeout(timer);
  }
  const raw=await r.text();
  let d={};
  try{d=raw?JSON.parse(raw):{}}
  catch{d={message:raw||'ระบบสมัครสมาชิกตอบกลับไม่ถูกต้อง'}}
  if(!r.ok||!d.ok){
    const e=new Error(d.message||`student-auth HTTP ${r.status}`);
    e.code=d.code||`http_${r.status}`;
    e.status=r.status;
    e.details=d.details||null;
    throw e;
  }
  return d;
}
function friendly(e){
  const c=String(e?.code||'').toLowerCase(),m=String(e?.message||'');
  if(c==='invalid_credentials'||/invalid login credentials/i.test(m))return'อีเมลหรือรหัสผ่านไม่ถูกต้อง หากลืมรหัสให้ใช้ PIN 4 หลัก';
  if(c==='account_exists')return'บัญชีนี้สมัครแล้ว กรุณาใช้แท็บ “เข้าสู่ระบบ”';
  if(c==='email_mismatch')return m||'อีเมลไม่ตรงกับข้อมูลนักเรียนที่สถาบันบันทึกไว้';
  if(c==='student_not_found')return m||'ไม่พบข้อมูลนักเรียนจากเบอร์นี้';
  if(c==='invalid_pin'||c==='pin_locked'||c==='pin_not_set')return m;
  if(c==='student_auth_schema')return'ฐานข้อมูล Student Portal ยังติดตั้งไม่ครบ กรุณารัน STUDENT_PORTAL_AUTH_V17_REPAIR.sql';
  if(c==='student_auth_unreachable')return m;
  if(c==='student_auth_timeout')return m;
  if(e?.status===404)return'ไม่พบ Edge Function student-auth กรุณา Deploy ฟังก์ชันจากชุดติดตั้งนี้';
  if(e?.status===401||e?.status===403)return'Edge Function ปฏิเสธสิทธิ์ กรุณา Deploy student-auth แบบ --no-verify-jwt';
  if(e?.status===500)return m&&m!=='Internal Server Error'?`ระบบสมัครสมาชิก: ${m}`:'ระบบสมัครสมาชิกมีปัญหาภายใน กรุณาตรวจ Edge Function log';
  return m||'เกิดข้อผิดพลาด';
}

function normCourseText(v){return String(v||'').toLowerCase().replace(/[()\[\]{}·•:–—_\-]/g,' ').replace(/\s+/g,' ').trim()}
function paymentResolvedByCourse(p){const eid=String(p?.enrollment_id||p?.source_enrollment_id||'');if(eid&&resolvedEnrollmentIds().has(eid))return true;const renewal=/renew|ต่อคอร์ส/i.test(String(p?.request_type||'')+' '+String(p?.title||'')+' '+String(p?.note||''));if(renewal)return false;const target=normCourseText(p?.course_text||p?.title);if(!target)return false;return activeEnroll().some(e=>{const c=course(e.course_id),name=normCourseText(c?.title||e.course_label);return name&&(name===target||name.includes(target)||target.includes(name))})}

function courseCard(e){const c=course(e.course_id);if(!c)return '';const pending=e.status==='pending',topicCount=topics(c.id).length,pct=courseProgress(c.id),newC=!pending&&(S.data.topics||[]).filter(t=>String(t.course_id)===String(c.id)).some(isNewTopic),cover=c.cover_url||'',remain=Math.max(0,n(e.hours_total)-n(e.hours_used)),renew=renewalReady(e),primaryAction=topicCount?`<button class="btn primary" data-open-course="${c.id}">${pct?'ดูบทเรียน / เอกสาร':'เปิดบทเรียน / เอกสาร'}</button>`:`<button class="btn primary" data-tab-jump="attendance">ดูประวัติเรียนสด</button>`;return `<article class="card course-card ${pending?'course-pending':''}"><div class="course-cover" style="${cover?`background-image:url('${esc(cover)}')`:''}">${pending?'<span class="new-dot pending-dot">รอเปิดใช้งาน</span>':renew?'<span class="new-dot renewal-dot">ใกล้หมดคอร์ส</span>':newC?'<span class="new-dot">มีบทใหม่</span>':''}<div class="course-cover-meta"><span>${pending?'สมัครแล้ว · รอตรวจการชำระ':e.hours_unlimited?'รายปี':`${remain.toFixed(1)} ชม. คงเหลือ`}</span></div><div class="cover-title">${esc(c.title)}</div></div><div class="course-body">${pending?`<div class="pending-course-note"><b>คอร์สอยู่ในบัญชีแล้ว</b><span>เมื่อ Manager ยืนยันและเปิด Active ระบบจะซ่อนการชำระเงินและเปิดข้อมูลคอร์สให้อัตโนมัติ</span></div><div class="course-actions"><button class="btn primary" data-go-pay>ดูสถานะ</button><button class="btn soft" data-go-catalog>ดูคอร์สอื่น</button></div>`:`<div class="progress-row"><span>${topicCount?`เอกสาร / บทเรียน ${pct}%`:'คอร์สสอนสด'}</span><span>${topicCount?`${topics(c.id).filter(t=>progress(t.id)?.status==='completed').length}/${topics(c.id).length} รายการ`:(e.hours_unlimited?'แพ็กเกจรายปี':`${remain.toFixed(1)} ชม. คงเหลือ`)}</span></div><div class="progress"><i style="width:${topicCount?pct:Math.min(100,Math.max(12,100-(remain/(Math.max(1,n(e.hours_total)||1))*100)))}%"></i></div><div class="course-hours">${topicCount?(e.hours_unlimited?'แพ็กเกจรายปี · ไม่จำกัดชั่วโมง function paymentCard(p){const st=paymentStatus(p),sub=(S.data.payment_submissions||[]).find(x=>x.payment_request_id===p.id&&x.status==='pending'),amount=money(p.amount);if(st==='expired')return `<article class="card payment-card expired-payment-card"><div class="expired-payment-icon">⌛</div><div class="expired-payment-copy"><span class="chip amber">QR หมดอายุ</span><h2>${esc(p.title||'รายการชำระเงิน')}</h2><p>QR เดิมหมดอายุแล้วและถูกปิด เพื่อป้องกันการชำระด้วยรายการเก่า</p><div class="expired-payment-meta"><span>ยอด <b>${amount}</b></span><span>PromptPay ${CONFIG.promptpay}</span></div></div><button class="btn warn" data-refresh-payment="${p.id}">สร้าง QR ใหม่</button></article>`;if(st==='rejected')return `<article class="card payment-card expired-payment-card rejected-payment-card"><div class="expired-payment-icon">!</div><div class="expired-payment-copy"><span class="chip amber">ต้องแก้ไข</span><h2>${esc(p.title||'รายการชำระเงิน')}</h2><p>${esc(p.note||'รายการเดิมถูกปฏิเสธ กรุณาสร้าง QR ใหม่และส่งสลิปอีกครั้ง')}</p><div class="expired-payment-meta"><span>ยอด <b>${amount}</b></span></div></div><button class="btn warn" data-refresh-payment="${p.id}">สร้างรายการใหม่</button></article>`;if(st==='slip_submitted'||sub)return `<article class="card payment-card review-payment-card"><div class="review-payment-icon">✓</div><div><span class="chip">ส่งสลิปแล้ว</span><h2>${esc(p.title||'รายการชำระเงิน')}</h2><p>กำลังรอ Manager ตรวจสอบ เมื่อยืนยันและเปิดคอร์ส Active หน้านี้จะอัปเดตอัตโนมัติ</p></div><strong>${amount}</strong></article>`;return `<article class="card payment-card live-payment-card"><div class="section-head"><div><span class="chip gray">รอชำระ</span><h2 style="margin-top:8px">${esc(p.title)}</h2><p>${esc(p.note||'')}</p></div><strong>${amount}</strong></div><div class="qr-wrap qr-live"><canvas data-qr="${p.id}"></canvas><div class="countdown" data-countdown="${p.id}">--:--</div><div class="sub">PromptPay ${CONFIG.promptpay}<br>${esc(CONFIG.payee)}</div></div><div function scheduleHtml(){const rows=(S.data?.v16_schedule||[]).slice().sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)),next=nextSchedule();return `${next?`<section class="next-class next-class-live"><div><span class="section-kicker">NEXT LIVE CLASS</span><h2>${esc(next.title||course(next.course_id)?.title||'คาบเรียนถัดไป')}</h2><p>${dateTime(next.start_at)} · ${next.mode==='online'?'เรียนออนไลน์':esc(next.location||'สถานที่เรียนจะแจ้งภายหลัง')} · ${Math.max(.5,(new Date(next.end_at)-new Date(next.start_at))/3600000).toFixed(1)} ชม.${next.tutor_name?' · '+esc(next.tutor_name):''}</p></div><div class="inline-actions">${next.source!=='tutor_os_v19'?`<button class="btn soft" data-reschedule="${next.id}">ขอเลื่อนเวลา</button>`:''}<button class="btn" data-tab-jump="attendance">ดูประวัติเรียน</button></div></section>`:`<section class="card"><div class="section-head"><div><span class="section-kicker">LIVE CLASS SCHEDULE</span><h2>ตารางนัดเรียนของฉัน</h2><p>คอร์สนี้เป็นแบบสอนสด เมื่อผู้สอนจัดตารางแล้วจะมาแสดงที่นี่อัตโนมัติ</p></div></div><div class="empty">ยังไม่มีคาบที่นัดไว้</div></section>`}<section class="card"><div class="section-head"><div><span class="section-kicker">MY SCHEDULE</span><h2>ตารางนัดเรียนทั้งหมด</h2><p>ตารางที่ผู้สอนจัดใน Tutor OS · แก้ไขแล้วอัปเดตที่นี่อัตโนมัติ</p></div></div><div class="schedule-list">${rows.map(x=>`<article class="schedule-row ${x.status}"><div class="schedule-date"><b>${new Intl.DateTimeFormat('th-TH',{day:'2-digit'}).format(new Date(x.start_at))}</b><span>${new Intl.DateTimeFormat('th-TH',{month:'short'}).format(new Date(x.start_at))}</span></div><div class="schedule-copy"><b>${esc(x.title||course(x.course_id)?.title||'คาบเรียน')}</b><span>${dateTime(x.start_at)} – ${new Intl.DateTimeFormat('th-TH',{timeStyle:'short'}).format(new Date(x.end_at))}</span><small>${x.mode==='online'?'เรียนออนไลน์':`สถานที่เรียน: ${esc(x.location||'จะแจ้งภายหลัง')}`} ${x.tutor_name?'· '+esc(x.tutor_name):''}</small></div><span class="chip ${x.status==='completed'?'green':x.status==='cancelled'?'amber':'gray'}">${esc(({scheduled:'นัดเรียน',rescheduled:'เลื่อนแล้ว',in_progress:'กำลังเรียน',completed:'เรียนแล้ว',cancelled:'ยกเลิก'})[x.status]||x.status)}</span>${['scheduled','rescheduled'].includes(x.status)&&new Date(x.start_at)>new Date()&&x.source!=='tutor_os_v19'?`<button class="btn small" data-reschedule="${x.id}">ขอเลื่อน</button>`:''}</article>`).join('')||'<div class="empty">ยังไม่มีตารางเรียน</div>'}</div></section>${(S.data?.v16_reschedule_requests||[]).length?`<section class="card service-list-card"><div class="section-head"><div><h2>คำขอเลื่อนเรียน</h2></div></div>${S.data.v16_reschedule_requests.map(r=>`<div class="service-row"><div><b>${dateTime(r.requested_start_at)}</b><p>${esc(r.reason||'')}</p></div><span class="chip ${r.status==='approved'?'green':r.status==='rejected'?'amber':'gray'}">${esc(r.status)}</span></div>`).join('')}</section>`:''}`}

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',n(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}function renderQrs(){$$('[data-qr]').forEach(c=>{const p=(S.data.payment_requests||[]).find(x=>x.id===c.dataset.qr);if(!p||paymentResolvedByCourse(p))return;if(window.QRCode){QRCode.toCanvas(c,promptpayPayload(p.promptpay_id||CONFIG.promptpay,p.amount),{width:220,margin:1,errorCorrectionLevel:'M'}).catch(()=>{const wrap=c.closest('.qr-wrap');if(wrap)wrap.insertAdjacentHTML('beforeend','<div class="message error">สร้าง QR ไม่สำเร็จ กรุณากดรีเฟรชหรือใช้เลข PromptPay ที่แสดงด้านล่าง</div>')})}})}function startCountdowns(){const tick=()=>$$('[data-countdown]').forEach(el=>{const p=S.data.payment_requests.find(x=>x.id===el.dataset.countdown),ms=new Date(p.expires_at)-new Date();if(ms<=0){el.textContent='00:00';return}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});tick();S.timer=setInterval(tick,1000)}
function showModal(title,body,actions=''){modal.classList.remove('hidden');modal.innerHTML=`<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="btn small" data-close>✕</button></div><div class="modal-body">${body}</div><div class="modal-actions">${actions||'<button class="btn" data-close>ปิด</button>'}</div></div>`;$$('[data-close]',modal).forEach(b=>b.onclick=()=>modal.classList.add('hidden'))}

async function load(renderNow=true){
  if(renderNow)app.innerHTML='<div class="loading"><div><div class="spinner"></div><b>กำลังโหลดข้อมูลนักเรียน...</b></div></div>';
  try{
    // Production currently exposes student_v11_bootstrap.
    // Calling older missing v17/v16/v12 functions first only creates 404 noise.
    S.data=await rpc('student_v11_bootstrap');

    // Optional Tutor OS V19 schedule.
    try{
      const tutorSchedule=await rpc('student_v19_schedule');
      if(Array.isArray(tutorSchedule))S.data.v16_schedule=tutorSchedule;
    }catch(scheduleErr){}

    // Manager-controlled content used by Student Hub V20.
    try{
      const [bannerRes,brandRes,promoRes]=await Promise.all([
        sb.from('home_banners').select('*').eq('active',true).order('sort_order').order('created_at'),
        sb.from('site_branding').select('*').eq('id',1).maybeSingle(),
        sb.from('promotions').select('*').eq('active',true).order('created_at',{ascending:false}).limit(4)
      ]);
      if(!bannerRes.error)S.data.home_banners=bannerRes.data||[];
      if(!brandRes.error&&brandRes.data)S.data.site_branding=brandRes.data;
      if(!promoRes.error){const now=Date.now();S.data.active_promotions=(promoRes.data||[]).filter(x=>(!x.starts_at||new Date(x.starts_at).getTime()<=now)&&(!x.ends_at||new Date(x.ends_at).getTime()>=now));}
    }catch(contentErr){S.data.home_banners=S.data.home_banners||[];S.data.active_promotions=S.data.active_promotions||[];}

    const optionalArrays=[
      'enrollments','courses','open_courses','topics','assets','progress',
      'notifications','hour_ledger','hour_pools','payment_requests','core_payments',
      'attendance','sessions','groups','codes','v16_schedule','v16_reschedule_requests',
      'v171_recent_lessons','home_banners','active_promotions'
    ];
    optionalArrays.forEach(k=>{if(!Array.isArray(S.data?.[k]))S.data[k]=[]});

    if(renderNow)S.signed={};
    if(renderNow||S.tab!=='learning')render();
  }catch(e){
    app.innerHTML=`<div class="loading"><div class="auth-card"><h2>เปิด Student Portal ไม่สำเร็จ</h2><div class="message error">${esc(e.message)}</div><form id="claim"><div class="field"><label>เบอร์โทรเพื่อเชื่อมบัญชี</label><input class="input" name="phone" required></div><button class="btn primary wide">เชื่อมบัญชี</button></form><button class="btn wide" data-logout style="margin-top:8px">ออกจากระบบ</button></div></div>`;
    $('#claim').onsubmit=async ev=>{
      ev.preventDefault();
      const {error}=await sb.rpc('claim_student_account_by_phone',{p_phone:normalizePhone(new FormData(ev.currentTarget).get('phone'))});
      if(error)return toast(error.message,true);
      await load();
    };
    $('[data-logout]').onclick=logout;
  }
}

function bindAuth(){if(S.signupResult){$('#enter').onclick=()=>{S.signupResult=null;load()};$('#later').onclick=()=>{S.signupResult=null;S.mode='login';app.innerHTML=authHtml();bindAuth()};return}if(S.mode==='recovery'){const f=$('#recovery');f.onsubmit=async e=>{e.preventDefault();const fd=new FormData(f),box=$('#msg'),phone=normalizePhone(fd.get('phone')),email=String(fd.get('email')).trim().toLowerCase(),pin=String(fd.get('pin')),password=String(fd.get('password'));if(password!==fd.get('confirm'))return box.innerHTML='<div class="message error">รหัสผ่านไม่ตรงกัน</div>';box.innerHTML='<div class="message">กำลังเปลี่ยนรหัส...</div>';try{await callStudentAuth('reset_password',{phone,email,pin,new_password:password});const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;await load()}catch(x){box.innerHTML=`<div class="message error">${esc(friendly(x))}</div>`}};$('#back').onclick=()=>{S.mode='login';app.innerHTML=authHtml();bindAuth()};return}$$('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.signupMatch=null;if(S.mode!=='quick')S.quickResult=null;app.innerHTML=authHtml();bindAuth()});$('#quickAgain')?.addEventListener('click',()=>{S.quickResult=null;app.innerHTML=authHtml();bindAuth()});$('#forgot')?.addEventListener('click',()=>{S.mode='recovery';app.innerHTML=authHtml();bindAuth()});$('#lookup')?.addEventListener('click',lookup);$('#change-phone')?.addEventListener('click',()=>{S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});$('#password')?.addEventListener('input',e=>{const i=passwordInfo(e.target.value,$('input[name=email]')?.value,S.signupPhone);$('#strength').style.width=i.pct+'%';$('#strength-label').textContent=i.label});$$('[data-toggle-password]').forEach(btn=>btn.onclick=()=>{const input=btn.closest('.password-wrap')?.querySelector('input');if(!input)return;const show=input.type==='password';input.type=show?'text':'password';btn.textContent=show?'ซ่อน':'แสดง'});$('#auth-form').onsubmit=S.mode==='quick'?submitQuickHours:submitAuth}
async function submitQuickHours(e){
  e.preventDefault();
  const fd=new FormData(e.currentTarget),box=$('#msg'),
        studentCode=String(fd.get('student_code')||'').trim().toUpperCase(),
        pin=String(fd.get('pin')||'');
  box.innerHTML='<div class="message">กำลังตรวจสอบชั่วโมงล่าสุด...</div>';
  try{
    let res=await sb.rpc('student_portal_quick_hours',{p_student_code:studentCode,p_pin:pin});
    if(res.error||res.data?.code==='pin_not_set'){
      const legacy=await sb.rpc('student_quick_hours',{p_student_code:studentCode,p_pin:pin});
      if(!legacy.error)res=legacy;
    }
    if(res.error)throw res.error;
    if(!res.data?.ok)throw new Error(res.data?.message||'ตรวจสอบไม่สำเร็จ');
    S.quickResult=res.data;
    app.innerHTML=authHtml();
    bindAuth();
  }catch(x){
    box.innerHTML=`<div class="message error">${esc(x.message||'ตรวจสอบไม่สำเร็จ')}</div>`;
  }
}
async function lookup(){const phone=normalizePhone($('#phone').value),box=$('#msg');S.signupPhone=phone;if(phone.length<9)return box.innerHTML='<div class="message error">กรุณากรอกเบอร์ให้ครบ</div>';box.innerHTML='<div class="message">กำลังค้นหา...</div>';try{const {data,error}=await sb.rpc('lookup_student_by_phone',{p_phone:phone});if(error)throw error;if(!data?.found)throw new Error(data?.message||'ไม่พบข้อมูล');S.signupMatch={...data,phone};app.innerHTML=authHtml();bindAuth()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function submitAuth(e){
  e.preventDefault();
  const form=e.currentTarget,fd=new FormData(form),box=$('#msg'),
        email=String(fd.get('email')||'').trim().toLowerCase(),
        password=String(fd.get('password')||'');
  const submit=form.querySelector('button[type="submit"],button:not([type])');
  const oldSubmit=submit?.innerHTML||'';
  if(submit){submit.disabled=true;submit.classList.add('is-loading');submit.innerHTML='<span class="auth-btn-spinner"></span><span>กำลังดำเนินการ...</span>'}
  box.innerHTML='<div class="message">กำลังตรวจสอบและเชื่อมบัญชี...</div>';
  try{
    if(S.mode==='login'){
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      S.session=data.session;
      await load();
      return;
    }
    if(!S.signupMatch)throw new Error('กรุณาตรวจสอบเบอร์ก่อน');
    if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('กรุณากรอกอีเมลให้ถูกต้อง');
    if(email!==String(fd.get('confirm_email')||'').trim().toLowerCase())throw new Error('อีเมลและยืนยันอีเมลไม่ตรงกัน');
    if(password!==String(fd.get('confirm_password')||''))throw new Error('รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน');
    const pin=String(fd.get('pin')||''),confirmPin=String(fd.get('confirm_pin')||'');
    if(!/^\d{4}$/.test(pin)||pin!==confirmPin)throw new Error('PIN ต้องเป็นเลข 4 หลักและตรงกัน');

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',pn(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}
function insts(plan){return(P.data.installments||[]).filter(i=>i.payment_plan_id===plan.id).sort((a,b)=>pn(a.installment_no)-pn(b.installment_no))}function activeReq(inst){return(P.data.requests||[]).filter(r=>r.installment_id===inst.id&&(r.status==='slip_submitted'||(r.status==='pending'&&new Date(r.expires_at)>new Date()))).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at))[0]}function subFor(req){return(P.data.submissions||[]).find(s=>s.payment_request_id===req?.id&&s.status==='pending')}

function renderPay(){const plans=P.data?.plans||[];payLayer.innerHTML=`<div class="awv9p-panel"><div class="awv9p-head"><div><h2>แผนแบ่งชำระและผ่อนจ่าย</h2><div style="font-size:11px;color:#d9def7">PromptPay 1901001151577 · AreWarin Biology</div></div><div><button class="awv9p-btn" data-p-refresh>รีเฟรช</button> <button class="awv9p-btn danger" data-p-close>ปิด</button></div></div><div class="awv9p-body"><div class="awv9p-message">เลือกชำระเต็มงวดหรือใส่ยอดบางส่วน ระบบจะสร้าง QR ที่มีอายุ 15 นาที แล้วอัปโหลดสลิปให้แอดมินตรวจสอบ</div>${plans.length?`<div class="awv9p-grid">${plans.map(planCard).join('')}</div>`:'<div class="awv9p-empty">ยังไม่มีแผนแบ่งชำระ</div>'}${(P.data.teaching_notes||[]).length?`<div class="awv9p-card" style="margin-top:14px"><h3 style="margin-top:0">บันทึกจากผู้สอน</h3>${P.data.teaching_notes.slice(0,20).map(x=>`<div style="padding:11px;border:1px solid #e6eaf3;border-radius:13px;margin-top:8px"><b>${pe(x.topic||'บันทึกหลังเรียน')}</b><div style="font-size:10px;color:#8993a9">${pdate(x.lesson_date)}</div><div style="margin-top:6px">${pe(x.lesson_summary||'')}</div>${x.homework?`<div class="awv9p-message" style="margin-top:8px;margin-bottom:0"><b>การบ้าน:</b> ${pe(x.homework)}</div>`:''}</div>`).join('')}</div>`:''}</div></div>`;bindPay();renderPqrs();startPtimer()}

async function loadPay(){payLayer.classList.add('open');payLayer.innerHTML='<div class="awv9p-panel" style="display:grid;place-items:center;min-height:300px">กำลังโหลดแผนชำระ...</div>';try{P.data=await prpc('student_v9_payment_bootstrap');renderPay()}catch(e){payLayer.innerHTML=`<div class="awv9p-panel" style="padding:22px"><div class="awv9p-message">${pe(e.message)}</div><button class="awv9p-btn danger" data-p-close>ปิด</button></div>`;payLayer.querySelector('[data-p-close]').onclick=()=>payLayer.classList.remove('open')}}
