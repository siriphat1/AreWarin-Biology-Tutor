<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script>
<script>
(function(){
  const STYLE_ID='aw-notice-style';
  const HOST_ID='aw-notice-host';
  let loadingNode=null;
  let loadingTimer=null;
  function setup(){
    if(document.body && document.body.style.overflow==='hidden') document.body.style.overflow='';
    if(!document.getElementById(STYLE_ID)){
      const style=document.createElement('style');
      style.id=STYLE_ID;
      style.textContent=`
        #${HOST_ID}{position:fixed;z-index:2147483000;top:max(14px,env(safe-area-inset-top));right:max(14px,env(safe-area-inset-right));display:grid;gap:10px;width:min(420px,calc(100vw - 28px));pointer-events:none}
        .aw-notice{pointer-events:auto;display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;padding:13px 14px;border:1px solid #dfe4ef;border-radius:16px;background:rgba(255,255,255,.98);color:#17203a;box-shadow:0 18px 55px rgba(20,28,60,.20);animation:awNoticeIn .18s ease-out}
        .aw-notice.success{border-color:#cdeede}.aw-notice.error{border-color:#ffd1da}.aw-notice.info{border-color:#d7e5ff}.aw-notice.loading{border-color:#d8dafd}
        .aw-notice-icon{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:900;background:#eef0ff;color:#5557d9}
        .aw-notice.success .aw-notice-icon{background:#e8faf2;color:#08744f}.aw-notice.error .aw-notice-icon{background:#fff0f3;color:#b82d4b}.aw-notice.info .aw-notice-icon{background:#eef6ff;color:#315f8d}
        .aw-notice-copy b{display:block;font-size:13px}.aw-notice-copy span{display:block;margin-top:3px;color:#6f7992;font-size:11px;line-height:1.55;overflow-wrap:anywhere}
        .aw-notice-close{border:0;background:transparent;color:#8b94aa;font-size:18px;line-height:1;cursor:pointer;padding:2px}
        .aw-notice-spin{width:18px;height:18px;border:3px solid #d9dcfb;border-top-color:#5757df;border-radius:50%;animation:awNoticeSpin .75s linear infinite}
        @keyframes awNoticeSpin{to{transform:rotate(360deg)}}@keyframes awNoticeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
        @media(max-width:620px){#${HOST_ID}{left:10px;right:10px;top:max(10px,env(safe-area-inset-top));width:auto}.aw-notice{border-radius:14px}}
      `;
      document.head.appendChild(style);
    }
    let host=document.getElementById(HOST_ID);
    if(!host){host=document.createElement('div');host.id=HOST_ID;host.setAttribute('aria-live','polite');document.body.appendChild(host)}
    return host;
  }
  function remove(node){if(node?.isConnected)node.remove();if(node===loadingNode)loadingNode=null}
  function show(type,title,text='',duration=3500){
    const host=setup();
    const node=document.createElement('div');
    node.className=`aw-notice ${type}`;
    const icon=document.createElement('div');icon.className='aw-notice-icon';
    if(type==='loading'){const spin=document.createElement('i');spin.className='aw-notice-spin';icon.appendChild(spin)}
    else icon.textContent=type==='success'?'✓':type==='error'?'!':'i';
    const copy=document.createElement('div');copy.className='aw-notice-copy';
    const strong=document.createElement('b');strong.textContent=String(title||'');copy.appendChild(strong);
    if(text){const span=document.createElement('span');span.textContent=String(text);copy.appendChild(span)}
    const close=document.createElement('button');close.type='button';close.className='aw-notice-close';close.setAttribute('aria-label','ปิด');close.textContent='×';close.onclick=()=>remove(node);
    node.append(icon,copy,close);host.appendChild(node);
    if(duration>0)setTimeout(()=>remove(node),duration);
    return node;
  }
  function closeLoading(){clearTimeout(loadingTimer);loadingTimer=null;remove(loadingNode)}
  window.AWAlert={
    loading:(title='กำลังดำเนินการ',text='กรุณารอสักครู่')=>{closeLoading();loadingNode=show('loading',title,text,0);loadingTimer=setTimeout(()=>remove(loadingNode),30000);return Promise.resolve({isConfirmed:true})},
    close:()=>closeLoading(),
    success:(title='สำเร็จ',text='')=>{closeLoading();show('success',title,text,3800);return Promise.resolve({isConfirmed:true})},
    error:(title='เกิดข้อผิดพลาด',text='')=>{closeLoading();show('error',title,text,6500);return Promise.resolve({isConfirmed:true})},
    info:(title='แจ้งข้อมูล',text='')=>{closeLoading();show('info',title,text,4800);return Promise.resolve({isConfirmed:true})},
    confirm:(title,text='',confirmText='ยืนยัน')=>Promise.resolve({isConfirmed:window.confirm([title,text,`กด OK เพื่อ${confirmText}`].filter(Boolean).join('\n'))}),
    toast:(title,icon='success')=>{show(icon==='error'?'error':icon==='info'?'info':'success',title,'',icon==='error'?5500:3200);return Promise.resolve({isConfirmed:true})}
  };
  const boot=()=>setup();
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

<script id="aw-student-v193-cache-reset">
(async()=>{
  const BUILD='20.0.0-premium-student-hub';
  const KEY='aw_student_live_build';
  try{
    const previous=localStorage.getItem(KEY);
    if(previous!==BUILD){
      localStorage.setItem(KEY,BUILD);

      // Old student/sw.js versions can keep serving stale index.html.
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(r=>{
          const scope=String(r.scope||'');
          return scope.includes('/student') ? r.unregister() : Promise.resolve(false);
        }));
      }

      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(
          keys
            .filter(k=>/student|arewarin|bioare/i.test(k))
            .map(k=>caches.delete(k))
        );
      }

      // A single reload after clearing old PWA caches.
      if(!sessionStorage.getItem('aw_v20_reloaded')){
        sessionStorage.setItem('aw_v20_reloaded','1');
        location.replace(location.pathname+'?v='+Date.now()+location.hash);
        return;
      }
    }
  }catch(e){
    console.warn('[AreWarin Student] cache reset warning',e);
  }
})();
</script>

function toast(m,e=false){if(window.AWAlert){window.AWAlert.toast(String(m),e?'error':'success');return}const x=document.createElement('div');x.className='toast'+(e?' error':'');x.textContent=m;document.body.append(x);setTimeout(()=>x.remove(),3500)}async function rpc(name,args={}){

async function callStudentAuth(action,payload){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),20000);
  let r;
  try{
    r=await fetch(`${CONFIG.url}/functions/v1/student-auth`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'apikey':CONFIG.key,
        'Authorization':`Bearer ${CONFIG.key}`,
        'x-client-info':'arewarin-student-v17.2'
      },
      body:JSON.stringify({action,...payload}),
      signal:controller.signal
    });
  }catch(err){
    const aborted=err?.name==='AbortError';
    const e=new Error(aborted
      ?'ระบบบัญชีนักเรียนตอบช้าเกิน 20 วินาที กรุณาลองใหม่'
      :'เชื่อมต่อระบบบัญชีนักเรียนไม่ได้ กรุณาตรวจว่า Edge Function student-auth ถูก Deploy แล้ว');
    e.code=aborted?'student_auth_timeout':'student_auth_unreachable';
    throw e;
  }finally{
    clearTimeout(timer);
  }
  const raw=await r.text();
  let d={};
  try{d=raw?JSON.parse(raw):{}}
  catch{d={message:raw||'ระบบสมัครสมาชิกตอบกลับไม่ถูกต้อง'}}
  if(!r.ok||!d.ok){
    const e=new Error(d.message||`student-auth HTTP ${r.status}`);
    e.code=d.code||`http_${r.status}`;
    e.status=r.status;
    e.details=d.details||null;
    throw e;
  }
  return d;
}
function friendly(e){
  const c=String(e?.code||'').toLowerCase(),m=String(e?.message||'');

function os232PomoRender(){
  const p=os232Pomo(),m=Math.floor(p.left/60),s=p.left%60;

function os232PomoMode(mode){

  p.mode=mode;p.seconds=(mode==='break'?5:25)*60;p.left=p.seconds;p.running=false;
  $('#os232FocusTab')?.classList.toggle('active',mode==='focus');
  $('#os232BreakTab')?.classList.toggle('active',mode==='break');

}
function os232PomoStart(){

    p.left=Math.max(0,p.left-1);os232PomoRender();
    if(p.left<=0){
      clearInterval(p.timer);p.timer=null;p.running=false;
      if(p.mode==='focus'){os232SetFocusCount(os232FocusCount()+1);toast('Focus session สำเร็จ 🌱')}

  },1000)

function normCourseText(v){return String(v||'').toLowerCase().replace(/[()\[\]{}·•:–—_\-]/g,' ').replace(/\s+/g,' ').trim()}
function paymentResolvedByCourse(p){const eid=String(p?.enrollment_id||p?.source_enrollment_id||'');if(eid&&resolvedEnrollmentIds().has(eid))return true;const renewal=/renew|ต่อคอร์ส/i.test(String(p?.request_type||'')+' '+String(p?.title||'')+' '+String(p?.note||''));if(renewal)return false;const target=normCourseText(p?.course_text||p?.title);if(!target)return false;return activeEnroll().some(e=>{const c=course(e.course_id),name=normCourseText(c?.title||e.course_label);return name&&(name===target||name.includes(target)||target.includes(name))})}

function courseLearning(courseId){const c=course(courseId),ts=topics(courseId);if(!S.lessonId)S.lessonId=ts.find(t=>progress(t.id)?.status!=='completed')?.id||ts[0]?.id;const current=ts.find(t=>String(t.id)===String(S.lessonId))||ts[0],pct=courseProgress(courseId),bookmark=current?os23IsBookmarked(current.id):false;return `<div class="os23-study-shell"><div class="os23-study-top"><button class="os23-study-back" data-back-learning><i class="fa-solid fa-arrow-left"></i><span>คอร์ส</span></button><div class="os23-study-title"><small>${pct}% COMPLETE</small><b>${esc(c?.title||'คอร์ส')}</b></div><div class="os23-study-actions"><button data-study-theme><i class="fa-regular fa-moon"></i><span>Dark</span></button><button data-focus-study><i class="fa-solid fa-expand"></i><span>Focus</span></button></div></div><div class="os23-study-workspace"><aside class="os23-chapters"><div class="os23-chapter-head"><span>CHAPTERS</span><b>${ts.length} บท</b></div><div class="os23-chapter-progress"><i style="width:${pct}%"></i></div><div class="os23-chapter-list">${ts.map((t,i)=>`<button class="${String(t.id)===String(current?.id)?'active':''} ${progress(t.id)?.status==='completed'?'done':''}" data-lesson="${t.id}"><span>${progress(t.id)?.status==='completed'?'<i class="fa-solid fa-check"></i>':String(i+1).padStart(2,'0')}</span><div><b>${esc(t.title)}</b><small>${assets(t.id).length} สื่อ${os23IsBookmarked(t.id)?' · ★':''}</small></div></button>`).join('')||'<div class="os23-empty compact">ยังไม่มีบทเรียน</div>'}</div></aside><main class="os23-player">${current?lessonPlayer(current,ts):'<div class="os23-empty large">ยังไม่มีบทเรียน</div>'}</main><aside class="os23-study-notes">${current?`<div class="os23-notes-head"><span>NOTES</span><button data-bookmark-topic="${current.id}" class="${bookmark?'active':''}"><i class="${bookmark?'fa-solid':'fa-regular'} fa-bookmark"></i></button></div><div class="os23-note-topic"><small>บทปัจจุบัน</small><b>${esc(current.title)}</b></div><textarea id="os iv><h2>กลุ่มเรียนของฉัน</h2><p>Group Locker ใช้สำหรับจัดรายชื่อผู้สอน ชั่วโมงยังคิดแยกเป็นรายบุคคล</p></div></div>${groups.map(g=>`<span class="group-inline">👥 ${esc(g.group_code)} · ${esc(g.name)}</span>`).join('')}</section>`:''}<section class="card"><div class="section-head"><div><h2>ประวัติการเข้าเรียน</h2><p>ติวเตอร์ลงเวลา เริ่ม–จบ และตัดชั่วโมงแล้วข้อมูลจะเข้าหน้านี้แบบเรียลไทม์</p></div></div><div class="table-wrap"><table class="table"><thead><tr><th>วันที่</th><th>คอร์ส/คาบ</th><th>เวลา</th><th>สถานะ</th><th>ตัดชม.</th><th>หมายเหตุ</th></tr></thead><tbody>${(lessons.length?lessons:S.data.attendance).map(a=>{const ss=lessons.length?a:S.data.sessions.find(x=>x.id===a.session_id),g=groups.find(x=>String(x.id)===String(ss?.group_id)),st=lessons.length?a.attendance_status:a.status,dh=lessons.length?a.deducted_hours:a.deducted_hours;const start=ss?.actual_start_at?new Intl.DateTimeFormat('th-TH',{timeStyle:'short'}).format(new Date(ss.actual_start_at)):String(ss?.start_time||'').slice(0,5),end=ss?.actual_end_at?new Intl.DateTimeFormat('th-TH',{timeStyle:'short'}).format(new Date(ss.actual_end_at)):String(ss?.end_time||'').slice(0,5);return `<tr><td>${date(ss?.session_date||a.created_at)}</td><td><div class="name">${esc(ss?.title||'คาบเรียน')}</div><div class="sub">${esc(lessons.length?(ss?.course_name||''):course(ss?.course_id)?.title||'')}${g?' · '+esc(g.group_code):''}</div></td><td>${start||'—'}${end?'–'+end:''}</td><td><span class="chip ${st==='present'?'green':st==='late'?'amber':'gray'}">${statusThai(st)}</span></td><td><b>${n(dh).toFixed(2)}</b> ชม.</td><td>${esc(ss?.note||a.note||'—')}</td></tr>`}).join('')||'<tr><td colspan="6" class="empty">ยังไม่มีประวัติ</td></tr>'}</tbody></table></div></section>`}


function walletHtml(){

function paymentStatus(p){const exp=p?.expires_at?new Date(p.expires_at):null;return p?.status==='pending'&&exp&&!Number.isNaN(exp.getTime())&&exp<=new Date()?'expired':p?.status}

        rows=all.filter(p=>!paymentResolvedByCourse(p)),

function studyTimeHtml(){

async function studentSyncNow(reason='manual'){
  if(OS22_SYNC_BUSY||!S.session?.user)return;
  OS22_SYNC_BUSY=true;
  try{
    await load(false);
    console.info('[AreWarin Student][SYNC]',reason,new Date().toISOString());
  }catch(e){
    console.warn('[AreWarin Student][SYNC FAILED]',reason,e?.message||e);
  }finally{
    OS22_SYNC_BUSY=false;
  }
}

function stopStudentLiveSync(){
  if(OS22_SYNC_TIMER){clearInterval(OS22_SYNC_TIMER);OS22_SYNC_TIMER=null}
  if(OS22_SYNC_CHANNEL){
    try{sb.removeChannel(OS22_SYNC_CHANNEL)}catch(_){}
    OS22_SYNC_CHANNEL=null;
  }
}

function startStudentLiveSync(){
  stopStudentLiveSync();
  const sid=S.data?.student?.id;
  if(!sid||!S.session?.user)return;

  // Fallback polling: Manager changes appear even when Realtime publication
  // is not enabled for a table.
  OS22_SYNC_TIMER=setInterval(()=>{
    if(document.visibilityState==='visible' && !S.courseId){
      studentSyncNow('poll');
    }
  },15000);

  // Realtime: instant refresh when Manager/Tutor OS changes this student's
  // course wallet or hour pool. If Realtime is unavailable, polling still works.
  try{
    OS22_SYNC_CHANNEL=sb.channel('student-os-sync-'+sid)
      .on('postgres_changes',{
        event:'*',schema:'public',table:'os_student_course_enrollments',
        filter:`student_id=eq.${sid}`
      },()=>studentSyncNow('course-wallet'))
      .on('postgres_changes',{
        event:'*',schema:'public',table:'os_hour_pools',
        filter:`student_id=eq.${sid}`
      },()=>studentSyncNow('hour-pool'))
      .subscribe();
  }catch(e){
    console.warn('[AreWarin Student] realtime sync unavailable; polling enabled',e);
  }
}

function tlv(id,v){return id+String(v.length).padStart(2,'0')+v}function crc16(s){let crc=0xffff;for(let i=0;i<s.length;i++){crc^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)crc=(crc&0x8000)?((crc<<1)^0x1021):(crc<<1);crc&=0xffff}return crc.toString(16).toUpperCase().padStart(4,'0')}function promptpayPayload(id,amount){let d=String(id).replace(/\D/g,''),tag='02',target=d;if(d.length===10&&d.startsWith('0')){tag='01';target='0066'+d.slice(1)}const mai=tlv('00','A000000677010111')+tlv(tag,target);let p=tlv('00','01')+tlv('01','12')+tlv('29',mai)+tlv('53','764')+tlv('54',n(amount).toFixed(2))+tlv('58','TH')+tlv('59','AREWARIN BIOLOGY')+tlv('60','THAILAND')+'6304';return p+crc16(p)}function renderQrs(){$$('[data-qr]').forEach(c=>{const p=(S.data.payment_requests||[]).find(x=>x.id===c.dataset.qr);if(!p||paymentResolvedByCourse(p))return;if(window.QRCode){QRCode.toCanvas(c,promptpayPayload(p.promptpay_id||CONFIG.promptpay,p.amount),{width:220,margin:1,errorCorrectionLevel:'M'}).catch(()=>{const wrap=c.closest('.qr-wrap');if(wrap)wrap.insertAdjacentHTML('beforeend','<div class="message error">สร้าง QR ไม่สำเร็จ กรุณากดรีเฟรชหรือใช้เลข PromptPay ที่แสดงด้านล่าง</div>')})}})}function startCountdowns(){const tick=()=>$$('[data-countdown]').forEach(el=>{const p=S.data.payment_requests.find(x=>x.id===el.dataset.countdown),ms=new Date(p.expires_at)-new Date();if(ms<=0){el.textContent='00:00';return}const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);el.textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`});tick();S.timer=setInterval(tick,1000)}

async function ensureStudentLinked(){
  if(!S.session?.user)return false;
  const status=await rpc('student_account_status');
  if(status?.linked===true)return true;
  renderStudentLinkGate(status||{});
  return false;
}

async function load(renderNow=true){
  if(renderNow)app.innerHTML='<div class="loading"><div><div class="spinner"></div><b>กำลังโหลดข้อมูลนักเรียน...</b></div></div>';
  try{
    const linked=await ensureStudentLinked();
    if(!linked)return;

    S.data=await rpc('student_v11_bootstrap');

    try{
      const tutorSchedule=await rpc('student_v19_schedule');
      if(Array.isArray(tutorSchedule))S.data.v16_schedule=tutorSchedule;
    }catch(scheduleErr){}

    try{
      const [bannerRes,brandRes,promoRes]=await Promise.all([
        sb.from('home_banners').select('*').eq('active',true).order('sort_order').order('created_at'),
        sb.from('site_branding').select('*').eq('id',1).maybeSingle(),
        sb.from('promotions').select('*').eq('active',true).order('created_at',{ascending:false}).limit(4)
      ]);
      if(!bannerRes.error)S.data.home_banners=bannerRes.data||[];
      if(!brandRes.error&&brandRes.data)S.data.site_branding=brandRes.data;
      if(!promoRes.error){const now=Date.now();S.data.active_promotions=(promoRes.data||[]).filter(x=>(!x.starts_at||new Date(x.starts_at).getTime()<=now)&&(!x.ends_at||new Date(x.ends_at).getTime()>=now));}
    }catch(contentErr){S.data.home_banners=S.data.home_banners||[];S.data.active_promotions=S.data.active_promotions||[];}

    const optionalArrays=[
      'enrollments','courses','open_courses','topics','assets','progress',
      'notifications','hour_ledger','hour_pools','payment_requests','core_payments',
      'attendance','sessions','groups','codes','v16_schedule','v16_reschedule_requests',
      'v16_assignments','v16_assignment_submissions','v171_recent_lessons',
      'v16_support_tickets','v16_support_messages','v16_parent_links','v16_devices',
      'home_banners','active_promotions'
    ];
    optionalArrays.forEach(k=>{if(!Array.isArray(S.data?.[k]))S.data[k]=[]});

    if(renderNow)S.signed={};
    if(renderNow||S.tab!=='learning')render();
    startStudentLiveSync();
  }catch(e){
    const diag=[
      e.rpc?`RPC: ${e.rpc}`:'',
      e.code?`Code: ${e.code}`:'',
      e.details?`Details: ${e.details}`:'',
      e.hint?`Hint: ${e.hint}`:''
    ].filter(Boolean).join('\n');

    console.error('[AreWarin Student][BOOT FAILED]',{
      rpc:e.rpc||null,code:e.code||null,message:e.message||null,
      details:e.details||null,hint:e.hint||null
    });

    app.innerHTML=`<div class="loading"><div class="auth-card">
      <h2>เปิด Student Portal ไม่สำเร็จ</h2>
      <div class="message error"><b>${esc(e.message||'Unknown error')}</b>${diag?`<pre style="white-space:pre-wrap;margin:8px 0 0;font:500 10px/1.6 ui-monospace,monospace">${esc(diag)}</pre>`:''}</div>
      <button class="btn wide" id="copyStudentDiagnostic" type="button">คัดลอกข้อมูล Error</button>
      <button class="btn wide" data-logout style="margin-top:8px">ออกจากระบบ</button>
    </div></div>`;

    const copyBtn=$('#copyStudentDiagnostic');
    if(copyBtn)copyBtn.onclick=async()=>{
      const t=`RPC: ${e.rpc||'-'}\nCode: ${e.code||'-'}\nMessage: ${e.message||'-'}\nDetails: ${e.details||'-'}\nHint: ${e.hint||'-'}`;
      try{await navigator.clipboard.writeText(t);toast('คัดลอก Error แล้ว')}catch(_){console.log(t)}
    };
    $('[data-logout]').onclick=logout;
  }
}

function bindAuth(){
  bindPwaInstall();

  if(S.signupResult){
    $('#enter').onclick=()=>{os231RememberEmail(S.signupResult.email);S.signupResult=null;load()};
    $('#later').onclick=()=>{os231RememberEmail(S.signupResult.email);S.signupResult=null;S.mode='login';app.innerHTML=authHtml();bindAuth()};
    return
  }

  if(S.mode==='recovery'){
    const f=$('#recovery');
    f.onsubmit=async e=>{
      e.preventDefault();
      const fd=new FormData(f),box=$('#msg'),phone=normalizePhone(fd.get('phone')),
            email=String(fd.get('email')).trim().toLowerCase(),
            pin=String(fd.get('pin')),password=String(fd.get('password'));
      if(password!==fd.get('confirm'))return box.innerHTML='<div class="message error">รหัสผ่านไม่ตรงกัน</div>';
      box.innerHTML='<div class="message">กำลังเปลี่ยนรหัส...</div>';
      try{
        await callStudentAuth('reset_password',{phone,email,pin,new_password:password});
        const {data,error}=await sb.auth.signInWithPassword({email,password});
        if(error)throw error;
        os231RememberEmail(email);
        S.session=data.session;
        await load()
      }catch(x){
        box.innerHTML=`<div class="message error">${esc(friendly(x))}</div>`
      }
    };
    const back=()=>{S.mode='login';app.innerHTML=authHtml();bindAuth()};
    $('#back')?.addEventListener('click',back);
    $('#back2')?.addEventListener('click',back);
    $$('[data-toggle-password]').forEach(btn=>btn.onclick=()=>{
      const input=btn.closest('.os231-field')?.querySelector('input[type=password],input[type=text]');
      if(!input)return;
      const show=input.type==='password';input.type=show?'text':'password';
      btn.innerHTML=`<i class="fa-regular ${show?'fa-eye-slash':'fa-eye'}"></i>`
    });
    return
  }

  $$('[data-mode]').forEach(b=>b.onclick=()=>{
    S.mode=b.dataset.mode;
    S.signupMatch=null;
    if(S.mode!=='quick')S.quickResult=null;
    app.innerHTML=authHtml();
    bindAuth()
  });

  $('#forgetAccount')?.addEventListener('click',()=>{
    os231ForgetEmail();
    app.innerHTML=authHtml();
    bindAuth()
  });

  $('#quickAgain')?.addEventListener('click',()=>{
    S.quickResult=null;app.innerHTML=authHtml();bindAuth()
  });
  $('#forgot')?.addEventListener('click',()=>{
    S.mode='recovery';app.innerHTML=authHtml();bindAuth()
  });
  $('#lookup')?.addEventListener('click',lookup);
  $('#change-phone')?.addEventListener('click',()=>{
    S.signupMatch=null;app.innerHTML=authHtml();bindAuth()
  });
  $('#password')?.addEventListener('input',e=>{
    const i=passwordInfo(e.target.value,$('input[name=email]')?.value,S.signupPhone);
    if($('#strength'))$('#strength').style.width=i.pct+'%';
    if($('#strength-label'))$('#strength-label').textContent=i.label
  });

  $$('[data-toggle-password]').forEach(btn=>btn.onclick=()=>{
    const wrap=btn.closest('.password-wrap')||btn.closest('.os231-field');
    const input=wrap?.querySelector('input[type=password],input[type=text]');
    if(!input)return;
    const show=input.type==='password';input.type=show?'text':'password';
    if(btn.classList.contains('os231-eye'))btn.innerHTML=`<i class="fa-regular ${show?'fa-eye-slash':'fa-eye'}"></i>`;
    else btn.textContent=show?'ซ่อน':'แสดง'
  });

  const f=$('#auth-form');
  if(!f){
    console.error('[AreWarin Student][AUTH] #auth-form not found', {mode:S.mode});
    return;
  }
  f.onsubmit=S.mode==='quick'?submitQuickHours:submitAuth;
  console.info('[AreWarin Student][AUTH] form bound', S.mode);
}
async function submitQuickHours(e){
  e.preventDefault();
  const fd=new FormData(e.currentTarget),box=$('#msg'),
        studentCode=String(fd.get('student_code')||'').trim().toUpperCase(),
        pin=String(fd.get('pin')||'');
  box.innerHTML='<div class="message">กำลังตรวจสอบชั่วโมงล่าสุด...</div>';
  try{
    let res=await sb.rpc('student_portal_quick_hours',{p_student_code:studentCode,p_pin:pin});
    if(res.error||res.data?.code==='pin_not_set'){
      const legacy=await sb.rpc('student_quick_hours',{p_student_code:studentCode,p_pin:pin});
      if(!legacy.error)res=legacy;
    }
    if(res.error)throw res.error;
    if(!res.data?.ok)throw new Error(res.data?.message||'ตรวจสอบไม่สำเร็จ');
    S.quickResult=res.data;
    app.innerHTML=authHtml();
    bindAuth();
  }catch(x){
    box.innerHTML=`<div class="message error">${esc(x.message||'ตรวจสอบไม่สำเร็จ')}</div>`;
  }
}
async function lookup(){const phone=normalizePhone($('#phone').value),box=$('#msg');S.signupPhone=phone;if(phone.length<9)return box.innerHTML='<div class="message error">กรุณากรอกเบอร์ให้ครบ</div>';box.innerHTML='<div class="message">กำลังค้นหา...</div>';try{const {data,error}=await sb.rpc('lookup_student_by_phone',{p_phone:phone});if(error)throw error;if(!data?.found)throw new Error(data?.message||'ไม่พบข้อมูล');S.signupMatch={...data,phone};app.innerHTML=authHtml();bindAuth()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function submitAuth(e){
  e.preventDefault();
  const form=e.currentTarget,fd=new FormData(form),box=$('#msg'),
        email=String(fd.get('email')||'').trim().toLowerCase(),
        password=String(fd.get('password')||'');
  const submit=form.querySelector('button[type="submit"],button:not([type])');
  const oldSubmit=submit?.innerHTML||'';
  if(submit){submit.disabled=true;submit.classList.add('is-loading');submit.innerHTML='<span class="auth-btn-spinner"></span><span>กำลังดำเนินการ...</span>'}
  box.innerHTML='<div class="message">กำลังตรวจสอบและเชื่อมบัญชี...</div>';
  try{
    if(S.mode==='login'){
      if(!email)throw new Error('กรุณากรอกอีเมล');
      if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('กรุณากรอกอีเมลให้ถูกต้อง');
      if(!password)throw new Error('กรุณากรอกรหัสผ่าน');
      const {data,error}=await sb.auth.signInWithPassword({email,password});
      if(error)throw error;
      S.session=data.session;
      os231RememberEmail(email);
      await load();
      return;
    }
    if(!S.signupMatch)throw new Error('กรุณาตรวจสอบเบอร์ก่อน');
    if(!/^\S+@\S+\.\S+$/.test(email))throw new Error('กรุณากรอกอีเมลให้ถูกต้อง');
    if(email!==String(fd.get('confirm_email')||'').trim().toLowerCase())throw new Error('อีเมลและยืนยันอีเมลไม่ตรงกัน');
    if(password!==String(fd.get('confirm_password')||''))throw new Error('รหัสผ่านและยืนยันรหัสผ่านไม่ตรงกัน');
    const pin=String(fd.get('pin')||''),confirmPin=String(fd.get('confirm_pin')||'');
    if(!/^\d{4}$/.test(pin)||pin!==confirmPin)throw new Error('PIN ต้องเป็นเลข 4 หลักและตรงกัน');
    if(['0000','1111','1234','4321'].includes(pin))throw new Error('PIN เดาง่ายเกินไป กรุณาเลือกเลขอื่น');
    const info=passwordInfo(password,email,S.signupPhone);
    if(!info.checks.len||!info.checks.number||!info.checks.letter||!info.checks.nospace||info.score<3)
      throw new Error('รหัสผ่านยังไม่รัดกุมพอ กรุณาใช้ 8 ตัวขึ้นไปและผสมตัวอักษรกับตัวเลข');

    const r=await callStudentAuth('register',{
      phone:S.signupPhone,
      email,
      password,
      pin,
      student_code:S.signupMatch.student_code||null
    });

    const signed=await sb.auth.signInWithPassword({email,password});
    if(signed.error){
      S.mode='login';
      S.signupMatch=null;
      throw new Error('สร้างบัญชีสำเร็จแล้ว แต่เข้าสู่ระบบอัตโนมัติไม่สำเร็จ กรุณาเลือก “เข้าสู่ระบบ” แล้วใช้อีเมลและรหัสผ่านที่เพิ่งตั้ง');
    }

    S.session=signed.data.session;
    os231RememberEmail(email);
    S.signupResult={
      display_name:r.display_name||S.signupMatch.display_name||S.signupMatch.name,
      email,
      student_code:r.student_code||S.signupMatch.student_code
    };
    app.innerHTML=authHtml();
    bindAuth();
  }catch(x){
    box.innerHTML=`<div class="message error"><b>ดำเนินการไม่สำเร็จ</b><br>${esc(friendly(x))}${x?.code?`<div class="auth-error-code">รหัส: ${esc(x.code)}</div>`:''}</div>`;
  }finally{
    if(submit&&submit.isConnected){
      submit.disabled=false;
      submit.classList.remove('is-loading');
      submit.innerHTML=oldSubmit;
    }
  }
}

function planCard(p){const pct=p.total_amount?Math.min(100,Math.round(pn(p.amount_paid)/pn(p.total_amount)*100)):0;return `<article class="awv9p-card"><div class="awv9p-row"><div><span class="awv9p-chip ${p.status==='paid'?'green':'amber'}">${p.status==='paid'?'ชำระครบ':'กำลังผ่อน'}</span><h3 style="margin:8px 0 3px">${pe(p.title)}</h3></div><b>${pmoney(p.balance_amount)}<div style="font-size:10px;color:#8993a9">คงเหลือ</div></b></div><div class="awv9p-row" style="font-size:11px;color:#77819b"><span>ยอดรวม ${pmoney(p.total_amount)}</span><span>รับแล้ว ${pmoney(p.amount_paid)}</span></div><div class="awv9p-progress"><i style="width:${pct}%"></i></div>${insts(p).map(installmentCard).join('')}</article>`}
