<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AreWarin Certificate</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>body{margin:0;background:#eef4ff;font-family:Prompt,sans-serif;color:#172033}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.cert{width:min(1050px,100%);aspect-ratio:1.414/1;background:#fff;border:14px solid #eef6ff;outline:2px solid #bfdbfe;box-shadow:0 30px 80px rgba(15,23,42,.16);display:grid;place-items:center;text-align:center;padding:55px;position:relative;overflow:hidden}.cert:before,.cert:after{content:'';position:absolute;border-radius:50%;border:40px solid rgba(59,130,246,.08);width:340px;height:340px}.cert:before{left:-190px;top:-170px}.cert:after{right:-190px;bottom:-170px}.brand{letter-spacing:.18em;color:#0284c7;font-weight:700;font-size:13px}.cert h1{font-size:52px;margin:12px 0 4px}.cert h2{font-size:34px;color:#1d4ed8;margin:18px 0 6px}.muted{color:#64748b}.no{font-family:monospace;margin-top:22px}.actions{position:fixed;right:20px;bottom:20px;display:flex;gap:8px}.actions button{border:0;border-radius:14px;padding:11px 15px;background:#0f172a;color:#fff;font-family:inherit;font-weight:700}@media print{body{background:#fff}.wrap{padding:0}.cert{box-shadow:none;width:100%;height:100vh;aspect-ratio:auto}.actions{display:none}}</style></head><body><div class="wrap"><div class="cert" id="cert"><div><div class="brand">AREWARIN BIOLOGY</div><h1>Certificate of Completion</h1><p class="muted">This certificate is proudly presented to</p><h2 id="name">กำลังโหลด...</h2><p>for successfully completing</p><h3 id="course">AreWarin Biology Course</h3><p class="muted" id="issued"></p><div class="no" id="no"></div></div></div></div><div class="actions"><button onclick="window.print()">พิมพ์ / บันทึก PDF</button></div><script>(async()=>{const cfg=window.AREWARIN_CONFIG||{};const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const id=new URLSearchParams(location.search).get('id');const{data,error}=await sb.rpc('student_v16_certificate',{p_certificate_id:id});if(error||!data?.found){document.getElementById('name').textContent='ไม่พบ Certificate';return}document.getElementById('name').textContent=data.student_name;document.getElementById('course').textContent=data.course_label;document.getElementById('issued').textContent='Issued '+new Intl.DateTimeFormat('th-TH',{dateStyle:'long'}).format(new Date(data.issued_at));document.getElementById('no').textContent=data.certificate_no})()</script></body></html>
