<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AreWarin · เว็บไซต์ & Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body>
<header class="awmod-top">
  <div class="awmod-topin">
    <div class="awmod-brand"><div class="awmod-icon"><i class="fas fa-palette"></i></div><div><b>เว็บไซต์ & Content</b><small>Homepage · Reviews · Hall of Fame · Speakers · V28 Modular Shell</small></div></div>
    <div class="awmod-actions">
      <button id="moduleHub" class="awmod-btn"><i class="fas fa-house"></i><span>Control Hub</span></button>
      <button id="moduleRefresh" class="awmod-btn"><i class="fas fa-rotate"></i><span>รีเฟรช</span></button>
      <button id="moduleLegacy" class="awmod-btn dark"><i class="fas fa-up-right-from-square"></i><span>Legacy Manager</span></button>

  </div>
  <nav class="awmod-nav"><button class="awmod-tab" data-aw-section="homepage">หน้าแรก & แบรนด์</button><button class="awmod-tab" data-aw-section="reviews">รีวิว</button><button class="awmod-tab" data-aw-section="halloffame">ทำเนียบคนเก่ง</button><button class="awmod-tab" data-aw-section="speakers">จ้างวิทยากร</button></nav>

<div class="awmod-framewrap">
  <div class="awmod-framebox">
    <div id="moduleLoading" class="awmod-loading"><div><i class="fas fa-spinner fa-spin"></i>กำลังเปิดโมดูล...</div></div>
    <iframe id="legacyFrame" class="awmod-frame" title="เว็บไซต์ & Content" referrerpolicy="same-origin"></iframe>
  </div>
</div>
<div class="awmod-note">Security: ใช้ Login / RLS / Manager RPC ชุดเดิมของระบบหลัก ไม่มี Service Role Key ในหน้าเว็บ และไม่ส่ง Token ผ่าน URL</div>
<script>window.AW_MODULE_CONFIG={"module": "content", "defaultSection": "homepage"};</script>
<script src="../shared/module-shell.js"></script>
