<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>AreWarin Parent Summary</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><style>:root{--ink:#172033;--muted:#64748b;--line:#dbe7f5}*{box-sizing:border-box}body{margin:0;font-family:Prompt,sans-serif;color:var(--ink);background:radial-gradient(circle at top left,#e0f2fe,transparent 30%),linear-gradient(180deg,#f8fbff,#eef4ff);min-height:100vh}.shell{max-width:1100px;margin:auto;padding:24px}.brand{display:flex;gap:11px;align-items:center}.logo{width:48px;height:48px;border-radius:17px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#38bdf8,#4f46e5);font-weight:800}.hero{margin-top:30px;padding:28px;border-radius:30px;background:rgba(255,255,255,.88);border:1px solid #fff;box-shadow:0 24px 60px -35px rgba(15,23,42,.3)}h1{font-size:36px;margin:10px 0}.muted{color:var(--muted);font-size:12px}.lookup{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:18px;max-width:600px}.input,.btn{font:inherit;border-radius:15px;padding:12px 14px}.input{border:1px solid var(--line);background:#fff}.btn{border:0;background:linear-gradient(135deg,#0ea5e9,#4f46e5);color:#fff;font-weight:700}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{padding:18px;border-radius:22px;background:#fff;border:1px solid #e3edf9;box-shadow:0 18px 38px -34px rgba(15,23,42,.3)}.metric b{font-size:28px;display:block}.metric span{font-size:9px;color:#64748b}.list{display:grid;gap:8px}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #edf2f7}.row:first-child{border-top:0}.row b{font-size:10px}.row span,.row small{font-size:8px;color:#64748b}.section{margin-top:14px}.hidden{display:none}.error{color:#be123c;background:#fff1f2;padding:11px;border-radius:14px;margin-top:10px}@media(max-width:760px){.shell{padding:14px}.grid{grid-template-columns:1fr 1fr}.lookup{grid-template-columns:1fr}.hero{padding:20px}h1{font-size:29px}}</style></head><body><main class="shell"><div class="brand"><div class="logo">A</div><div><b>AreWarin Parent Summary</b><div class="muted">ดูความคืบหน้าการเรียนแบบจำกัดสิทธิ์</div></div></div><section class="hero" id="login"><span class="muted">PARENT ACCESS</span><h1>ติดตามการเรียนของน้อง<br>โดยไม่ต้องเข้าบัญชีนักเรียน</h1><p class="muted">กรอกรหัสที่นักเรียนสร้างให้ ระบบจะแสดงเฉพาะตาราง ชั่วโมง Attendance การบ้าน และสถานะการชำระที่จำเป็น</p><form id="form" class="lookup"><input class="input" name="token" required placeholder="เช่น AWP-XXXXXXXXXX"><button class="btn">เปิด Parent Summary</button></form><div id="err"></div></section><div id="app" class="hidden"></div></main><script>(()=>{const cfg=window.AREWARIN_CONFIG||{};const sb=window.supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const dt=v=>v?new Intl.DateTimeFormat('th-TH',{dateStyle:'medium',timeStyle:'short'}).format(new Date(v)):'—';document.getElementById('form').onsubmit=async e=>{e.preventDefault();document.getElementById('err').innerHTML='';const token=new FormData(e.currentTarget).get('token');const{data,error}=await sb.rpc('parent_v16_view',{p_token:String(token).trim().toUpperCase()});if(error||!data?.found){document.getElementById('err').innerHTML='<div class="error">รหัสไม่ถูกต้อง หมดอายุ หรือถูกปิดสิทธิ์แล้ว</div>';return}document.getElementById('login').classList.add('hidden');const a=document.getElementById('app');a.classList.remove('hidden');const rem=(data.courses||[]).reduce((s,x)=>s+(x.unlimited?0:Math.max(0,Number(x.hours_total||0)-Number(x.hours_used||0))),0);a.innerHTML=`<section class="hero"><span class="muted">PARENT VIEW</span><h1>${esc(data.student_name)}</h1><p class="muted">${esc(data.school||'')} · อัปเดต ${dt(data.generated_at)}</p></section><div class="grid"><div class="card metric"><span>คอร์ส</span><b>${(data.courses||[]).length}</b></div><div class="card metric"><span>ชั่วโมงคงเหลือ</span><b>${rem.toFixed(1)}</b></div><div class="card metric"><span>การบ้านค้าง</span><b>${(data.assignments||[]).filter(x=>!x.submitted).length}</b></div><div class="card metric"><span>รายการชำระค้าง</span><b>${Number(data.payment_due_count||0)}</b></div></div><section class="card section"><h3>ตารางเรียนถัดไป</h3><div class="list">${(data.schedule||[]).map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${dt(x.start_at)}</small></div><span>${esc(x.mode||'')}</span></div>`).join('')||'<div class="muted">ยังไม่มีตาราง</div>'}</div></section><section class="card section"><h3>Attendance ล่าสุด</h3><div class="list">${(data.attendance||[]).map(x=>`<div class="row"><div><b>${esc(x.title||'คาบเรียน')}</b><small>${dt(x.session_at)}</small></div><span>${esc(x.status)}</span></div>`).join('')||'<div class="muted">ยังไม่มีข้อมูล</div>'}</div></section><section class="card section"><h3>การบ้าน</h3><div class="list">${(data.assignments||[]).map(x=>`<div class="row"><div><b>${esc(x.title)}</b><small>${x.due_at?'กำหนด '+dt(x.due_at):'ไม่กำหนด'}</small></div><span>${x.submitted?'ส่งแล้ว':'รอส่ง'}</span></div>`).join('')||'<div class="muted">ไม่มีการบ้าน</div>'}</div></section>`}})()</script></body></html>
