<script type="module">

function loginHtml(msg=''){
 const saved=savedPhones(),q=new URLSearchParams(location.search),code=q.get('code')||'';
 return `<div class="login"><section class="login-copy"><div class="brand"><span class="brandmark">A</span><span><b>AreWarin Biology</b><small>Parent View</small></span></div><div class="hero"><span>PARENT · READ ONLY</span><h1>ดูการเรียน<br>ได้อย่างสบายใจ</h1><p>ติดตามคอร์ส ชั่วโมงเรียน ตาราง Attendance, Tutor Feedback และสถานะการชำระ โดยไม่ต้องใช้รหัสผ่านของนักเรียน</p><div class="hero-chips"><span><i class="fa-solid fa-shield-halved"></i> Secure Parent Session</span><span><i class="fa-solid fa-eye"></i> Read-only</span><span><i class="fa-solid fa-mobile-screen"></i> Mobile Ready</span></div></div><div class="brand"><small>Parent access สร้างโดยนักเรียนจาก Student OS</small></div></section><main class="login-panel"><form class="login-card" id="loginForm"><span>PARENT ACCESS</span><h2>เข้าสู่ระบบผู้ปกครอง</h2><p>กรอกข้อมูลที่นักเรียนส่งให้ ทั้งเบอร์ผู้ปกครอง เบอร์นักเรียน และ Access Code</p>${msg?`<div class="login-error">${esc(msg)}</div>`:''}<div class="field"><label>เบอร์ผู้ปกครอง</label><input class="input" name="parent_phone" inputmode="tel" autocomplete="tel" value="${esc(saved.parent_phone||'')}" placeholder="08xxxxxxxx" required></div><div class="field"><label>เบอร์นักเรียน</label><input class="input" name="student_phone" inputmode="tel" value="${esc(saved.student_phone||'')}" placeholder="09xxxxxxxx" required></div><div class="field"><label>Access Code</label><input class="input code-input" name="access_code" autocomplete="one-time-code" value="${esc(code)}" maxlength="16" placeholder="XXXXXXXXXX" required></div><label class="remember"><input type="checkbox" name="remember" checked> จำเบอร์โทรบนอุปกรณ์นี้</label><button class="login-btn" type="submit">เข้าสู่ Parent View <i class="fa-solid fa-arrow-right"></i></button><div class="login-help"><b>ไม่มี Access Code?</b><br>ให้นักเรียนเข้า Student OS → ผู้ปกครอง → เพิ่มผู้ปกครอง หรือกดสร้างรหัสใหม่</div></form></main></div>`
}

function portalHtml(){
 const d=DATA||{},s=d.student||{},parent=d.parent||{},courses=d.courses||[],schedule=d.schedule||[],attendance=d.attendance||[],orders=d.orders||[],feedback=d.feedback||[],leaves=d.leave_requests||[],member=d.membership;
 const upcoming=schedule.filter(x=>new Date(x.end_at||x.start_at)>=new Date()&&['scheduled','rescheduled','in_progress'].includes(x.status)).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at)),next=upcoming[0];

 return `<header class="header"><div class="brand"><span class="brandmark">A</span><span><b>AreWarin Biology</b><small>Parent View</small></span></div><div class="parent-chip"><span class="readonly"><i class="fa-solid fa-eye"></i> READ ONLY</span><div class="parent-name"><b>${esc(parent.name||'ผู้ปกครอง')}</b><span>${esc(parent.relationship||'')}</span></div><button class="icon-btn" id="refreshBtn" title="รีเฟรช"><i class="fa-solid fa-rotate"></i></button><button class="icon-btn" id="logoutBtn" title="ออกจากระบบ"><i class="fa-solid fa-arrow-right-from-bracket"></i></button></div></header><main class="main"><section class="welcome"><div class="welcome-copy"><span>PARENT DASHBOARD</span><h1>${esc(s.display_name||'นักเรียน')}</h1><p>ข้อมูลนี้เป็นมุมมองสำหรับผู้ปกครองแบบ Read-only และเชื่อมจาก Student / Tutor OS โดยตรง</p></div><div class="student-card"><i class="fa-solid fa-graduation-cap"></i><small>STUDENT</small><b>${esc(s.student_code||'—')}</b><em>${esc(s.school||'')}${s.grade?' · '+esc(s.grade):''}</em></div></section><section class="metrics"><article class="metric"><i class="fa-regular fa-clock"></i><span><small>ชั่วโมงคงเหลือ</small><b>${unlim?'∞':remain.toFixed(1)}</b><em>ชม.</em></span></article><article class="metric"><i class="fa-solid fa-graduation-cap"></i><span><small>คอร์ส Active</small><b>${active.length}</b><em>คอร์ส</em></span></article><article class="metric"><i class="fa-regular fa-calendar"></i><span><small>คลาสถัดไป</small><b>${next?new Intl.DateTimeFormat('th-TH',{hour:'2-digit',minute:'2-digit'}).format(new Date(next.start_at)):'—'}</b><em>${next?date(next.start_at):'ยังไม่มีนัด'}</em></span></article><article class="metric"><i class="fa-solid fa-credit-card"></i><span><small>Payment</small><b>${pendingPay.length}</b><em>ต้องดำเนินการ</em></span></article></section><div class="grid"><div><section class="section"><div class="section-head"><div><span>SCHEDULE</span><h2>ตารางเรียน</h2></div><b>${upcoming.length} upcoming</b></div><div class="schedule-list">${upcoming.slice(0,8).map(x=>`<article class="schedule-row"><div class="row-icon"><i class="fa-regular fa-calendar"></i></div><div class="row-copy"><b>${esc(x.title||x.course_name||'คาบเรียน')}</b><small>${dt(x.start_at)} · ${esc(x.tutor_name||'Tutor')} · ${x.mode==='online'?'ออนไลน์':esc(x.location||'')}</small></div>${pill(x.status)}</article>`).join('')||'<div class="empty"><i class="fa-regular fa-calendar-check"></i><b>ยังไม่มีตารางเรียนถัดไป</b></div>'}</div></section><section class="section"><div class="section-head"><div><span>COURSE WALLET</span><h2>คอร์สและชั่วโมง</h2></div><b>${courses.length}</b></div><div class="course-list">${courses.map(x=>{const pct=x.hours_unlimited?0:(n(x.hours_total)?Math.min(100,Math.round(n(x.hours_used)/n(x.hours_total)*100)):0);return `<article class="course-row"><div class="row-copy"><b>${esc(x.course_name)}</b><small>${esc(x.status)} · ใช้ไป ${n(x.hours_used).toFixed(1)} / ${x.hours_unlimited?'∞':n(x.hours_total).toFixed(1)} ชม.</small>${!x.hours_unlimited?`<div class="progress"><i style="width:${pct}%"></i></div>`:''}</div><div class="course-hours"><strong>${x.hours_unlimited?'∞':n(x.hours_remaining).toFixed(1)}</strong><small>ชม. เหลือ</small></div></article>`}).join('')||'<div class="empty"><b>ยังไม่มีคอร์ส</b></div>'}</div></section><section class="section"><div class="section-head"><div><span>TUTOR FEEDBACK</span><h2>คำแนะนำจากผู้สอน</h2></div><b>${feedback.length}</b></div><div class="feedback-list">${feedback.slice(0,10).map(f=>`<article class="feedback-item"><small>${date(f.lesson_date)} · ${esc(f.course_name||'คอร์ส')} · ${esc(f.tutor_name||'Tutor')}</small><h3>${esc(f.tutor_note||f.positive_note||'Tutor Feedback')}</h3><div class="feedback-boxes">${f.positive_note?`<div class="good"><span>ทำได้ดี</span><p>${esc(f.positive_note)}</p></div>`:''}${f.improve_note?`<div class="improve"><span>ควรทบทวน</span><p>${esc(f.improve_note)}</p></div>`:''}${f.homework?`<div class="homework"><span>การบ้าน</span><p>${esc(f.homework)}</p></div>`:''}</div></article>`).join('')||'<div class="empty"><i class="fa-regular fa-comment-dots"></i><b>ยังไม่มี Feedback</b></div>'}</div></section></div><aside>${member?`<section class="membership"><small>AREWARIN MEMBER</small><h3>${esc(member.plan_name||'Member')}</h3><p>Active ถึง ${date(member.ends_at)}</p><div class="membership-stats"><div><b>${n(member.course_discount_pct)}%</b><span>Course discount</span></div><div><b>${n(member.renewal_discount_pct)}%</b><span>Renewal discount</span></div></div></section>`:''}<section class="section"><div class="section-head"><div><span>ATTENDANCE</span><h2>การเข้าเรียนล่าสุด</h2></div><b>${attendance.length}</b></div><div class="attendance-list">${attendance.slice(0,8).map(a=>`<article class="attendance-row"><div class="row-icon"><i class="fa-solid fa-user-check"></i></div><div class="row-copy"><b>${esc(a.title||'คาบเรียน')}</b><small>${date(a.session_date)} · ตัด ${n(a.deducted_hours).toFixed(2)} ชม.</small></div>${pill(a.attendance_status)}</article>`).join('')||'<div class="empty"><b>ยังไม่มีประวัติ Attendance</b></div>'}</div></section><section class="section"><div class="section-head"><div><span>PAYMENT</span><h2>สถานะการชำระ</h2></div><b>${orders.length}</b></div><div class="payment-list">${orders.slice(0,8).map(o=>`<article class="payment-row"><div class="row-icon"><i class="fa-solid fa-receipt"></i></div><div class="row-copy"><b>${esc(o.title)}</b><small>${money(o.total_amount)} · ${date(o.created_at)}</small></div>${pill(o.status)}</article>`).join('')||'<div class="empty"><i class="fa-solid fa-circle-check"></i><b>ไม่มีรายการ Payment</b></div>'}</div></section><section class="section"><div class="section-head"><div><span>LEAVE</span><h2>คำขอลา</h2></div><b>${leaves.length}</b></div><div class="leave-list">${leaves.slice(0,8).map(l=>`<article class="leave-row"><div class="row-icon"><i class="fa-solid fa-calendar-minus"></i></div><div class="row-copy"><b>${esc(l.schedule_title||'คาบเรียน')}</b><small>${dt(l.schedule_start_at)}${l.manager_note?' · '+esc(l.manager_note):''}</small></div>${pill(l.status)}</article>`).join('')||'<div class="empty"><b>ยังไม่มีคำขอลา</b></div>'}</div></section></aside></div><div class="footer">AreWarin Biology Parent View · ข้อมูล Read-only · Session หมดอายุ ${date(d.session_expires_at)}</div></main>`
}
async function loadSession(showLoader=true){const token=localStorage.getItem(KEY);if(!token){app.innerHTML=loginHtml();bindLogin();return}if(showLoader)loading();try{DATA=await rpc('parent_v25_bootstrap',{p_session_token:token});app.innerHTML=portalHtml();bindPortal();clearInterval(TIMER);TIMER=setInterval(()=>loadSession(false),60000)}catch(e){localStorage.removeItem(KEY);clearInterval(TIMER);app.innerHTML=loginHtml(errorText(e));bindLogin()}}
function bindLogin(){document.getElementById('loginForm')?.addEventListener('submit',async e=>{e.preventDefault();const f=e.currentTarget,fd=new FormData(f),parent_phone=String(fd.get('parent_phone')||''),student_phone=String(fd.get('student_phone')||''),access_code=String(fd.get('access_code')||'');const btn=f.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='กำลังตรวจสอบ...';try{const r=await rpc('parent_v25_sign_in',{p_parent_phone:parent_phone,p_student_phone:student_phone,p_access_code:access_code,p_device_key:getDevice(),p_device_name:`${navigator.platform||'Device'} · ${/Mobile|Android|iPhone/i.test(navigator.userAgent)?'Mobile':'Browser'}`});localStorage.setItem(KEY,r.session_token);if(fd.get('remember'))localStorage.setItem(PHONE_KEY,JSON.stringify({parent_phone,student_phone}));else localStorage.removeItem(PHONE_KEY);history.replaceState({},'',location.pathname);await loadSession()}catch(x){app.innerHTML=loginHtml(errorText(x));bindLogin()}})}
function bindPortal(){document.getElementById('refreshBtn')?.addEventListener('click',async e=>{const i=e.currentTarget.querySelector('i');i.classList.add('refreshing');await loadSession(false);i.classList.remove('refreshing')});document.getElementById('logoutBtn')?.addEventListener('click',async()=>{const token=localStorage.getItem(KEY);if(token)try{await rpc('parent_v25_sign_out',{p_session_token:token})}catch(_){}localStorage.removeItem(KEY);clearInterval(TIMER);DATA=null;app.innerHTML=loginHtml();bindLogin()})}
loadSession();
