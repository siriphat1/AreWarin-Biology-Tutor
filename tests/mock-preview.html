<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tutor OS Test Harness (MOCK only)</title><style>body{margin:0;background:#f6f8fc;font:14px system-ui} .test-banner{background:#fff7ed;padding:13px 18px;color:#92400e;text-align:center}.shell{display:grid;grid-template-columns:235px 1fr;max-width:1420px;margin:0 auto;gap:18px;padding:20px}.sidebar{background:#fff;border-radius:20px;padding:13px;height:fit-content}.nav-btn{display:block;width:100%;border:0;background:#fff;padding:14px;margin:4px 0;text-align:left;border-radius:12px}.nav-btn.active{background:#0f172a;color:#fff}.section{display:none}.section.active{display:block}.main{min-width:0}@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{display:flex}.nav-btn{width:auto}}</style></head><body><div class="test-banner">PREVIEW ONLY — Supabase mock simulation · ไม่ใช่ฐานข้อมูลจริง</div><div class="shell"><aside class="sidebar"><button class="nav-btn" onclick="document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.querySelector('#section-today').classList.add('active')">หน้าแรก</button><button class="nav-btn" id="awosAttendanceNav" data-section="attendance">⏱ ลงเวลาเรียน</button></aside><main class="main"><section id="section-today" class="section active">คลิกลงเวลาเรียน</section><section id="section-attendance" class="section"></section></main></div>
<script>
const data={actor:{user_id:'U1',role:'admin',display_name:'AreWarin Admin',enabled:true},roster:[{student_ref:'ST01',student_name:'น้องเอ · Biology',tutor_ref:'T01',target_minutes:2400,used_minutes:90,active:true},{student_ref:'ST02',student_name:'น้องบี · Biology',tutor_ref:'T01',target_minutes:1800,used_minutes:0,active:true},{student_ref:'ST03',student_name:'น้องซี · A-Level',tutor_ref:'T01',target_minutes:2400,used_minutes:120,active:true}],records:[{id:'REC0',student_ref:'ST01',tutor_ref:'T01',lesson_date:'2026-10-20',status:'present',start_time:'17:00:00',end_time:'18:30:00',duration_minutes:90,topic:'Cell Biology',note:'',created_at:'2026-10-20T11:00:00Z'}],access:[]};
window.confirm=()=>true;
window.supabaseClient={auth:{getUser:async()=>({data:{user:{id:'U1'}},error:null})},rpc:async(n,p)=>{
 if(n==='awos_bootstrap'){data.roster.forEach(r=>r.used_minutes=data.records.filter(x=>x.student_ref===r.student_ref&&x.status==='present').reduce((a,x)=>a+x.duration_minutes,0));return{data:JSON.parse(JSON.stringify(data)),error:null}}
 if(n==='awos_catalog')return {data:{students:data.roster.map(x=>({id:x.student_ref,nickname:x.student_name})),tutors:[{id:'T01',display_name:'ครูชีววิทยา'}]},error:null};
 if(n==='awos_save_records'){let total=0;for(const r of p.p_records){const a=r.start_time?.split(':').map(Number),b=r.end_time?.split(':').map(Number);const minutes=r.status==='leave'?0:(b[0]*60+b[1])-(a[0]*60+a[1]);data.records.unshift({...r,id:'REC'+String(data.records.length+1),tutor_ref:p.p_tutor_ref,duration_minutes:minutes,start_time:r.status==='leave'?null:r.start_time,end_time:r.status==='leave'?null:r.end_time,created_at:new Date().toISOString()});total+=minutes}return {data:{inserted:p.p_records.length,minutes:total},error:null}}
 if(n==='awos_delete_record'){data.records=data.records.filter(x=>x.id!==p.p_id);return{data:{deleted:true},error:null}}
 if(n==='awos_update_record'){const rec=data.records.find(x=>x.id===p.p_id);Object.assign(rec,p.p_record);rec.duration_minutes=rec.status==='leave'?0:(+rec.end_time.slice(0,2)*60+ +rec.end_time.slice(3,5))-(+rec.start_time.slice(0,2)*60+ +rec.start_time.slice(3,5));return{data:rec,error:null}}
 if(n==='awos_roster_upsert'){data.roster.push({...p,student_ref:p.p_student_ref,student_name:p.p_student_name,tutor_ref:p.p_tutor_ref,target_minutes:p.p_target_minutes,active:true});return{data:p,error:null}}
 if(n==='awos_access_upsert'){data.access.push({...p,role:p.p_role,display_name:p.p_display_name});return{data:p,error:null}}
 return{data:null,error:{message:'Unexpected '+n}};
}};
</script><script src="../tutor-os/attendance-os.js"></script></body></html>
