<style>
:root{--navy:#102944;--navy2:#173f6b;--blue:#2f65d5;--ink:#172236;--muted:#708198;--line:#e3e9f1;--bg:#f4f7fb;--card:#fff;--green:#168368;--red:#d94b67;--amber:#c98716}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:"Prompt",system-ui,sans-serif;background:radial-gradient(circle at 8% 0,#e8f3ff 0,transparent 28%),linear-gradient(180deg,#f8faff,#eef3f8);color:var(--ink);font-size:14px}.hidden{display:none!important}button,input,select,textarea{font:inherit}button{cursor:pointer}.btn{border:1px solid var(--line);background:#fff;color:#52647c;border-radius:12px;padding:10px 13px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:7px;text-decoration:none}.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}.btn.green{background:var(--green);border-color:var(--green);color:#fff}.btn.red{background:#fff1f3;border-color:#f4ccd5;color:#bd3650}.btn:disabled{opacity:.45;cursor:not-allowed}.input,select,textarea{width:100%;border:1px solid #dce4ee;background:#fff;border-radius:12px;padding:10px 11px;font-size:12px;color:#35455d;outline:none}.input:focus,select:focus,textarea:focus{border-color:#8eb2f7;box-shadow:0 0 0 3px #edf4ff}.field{display:grid;gap:5px}.field label{font-size:10px;font-weight:700;color:#62738a}.hint{font-size:9px;color:#92a0b2;line-height:1.6}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;font-size:9px;font-weight:700}.pill.student{background:#edf5ff;color:#315fa9}.pill.staff{background:#f2efff;color:#6650b0}.pill.admin{background:#e9faf4;color:#0e7a5d}.pill.new{background:#fff0f3;color:#cc3d59}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;height:72px;background:rgba(255,255,255,.93);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 max(18px,calc((100vw - 1280px)/2))}.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:inherit}.brandmark{width:42px;height:42px;border-radius:14px;background:linear-gradient(145deg,var(--navy),#335d9d);color:#fff;display:grid;place-items:center;font-weight:800}.brand b{display:block;font-size:14px}.brand span{display:block;font-size:9px;color:#8d9aac}.top-actions{display:flex;align-items:center;gap:8px}.hero{background:linear-gradient(145deg,#102944,#1c4d82 65%,#3663a5);color:#fff;padding:48px 18px 74px;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;width:430px;height:430px;border-radius:50%;right:-180px;top:-230px;background:rgba(255,255,255,.07)}.hero-in{max-width:1280px;margin:auto;position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}.hero-kicker{font-size:10px;letter-spacing:.16em;color:#bcd2f2;font-weight:700}.hero h1{font-size:clamp(30px,5vw,54px);line-height:1.12;margin:8px 0 12px}.hero p{font-size:13px;line-height:1.8;color:#d7e3f4;max-width:650px}.hero-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.hero-card{padding:14px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);border-radius:16px}.hero-card i{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.1);display:grid;place-items:center}.hero-card b{display:block;font-size:11px;margin-top:8px}.hero-card span{display:block;font-size:9px;color:#cad9ee;margin-top:2px}.content{max-width:1280px;margin:-38px auto 0;padding:0 18px 50px;position:relative;z-index:3}.toolbar{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:0 22px 50px -40px rgba(18,45,82,.5);display:grid;grid-template-columns:1fr 220px auto;gap:9px;align-items:center}.search{display:flex;align-items:center;gap:8px;border:1px solid #dfe6ef;border-radius:12px;padding:0 11px;background:#fbfcfe}.search input{border:0;background:transparent;outline:0;width:100%;padding:10px 0;font-size:12px}.search i{color:#9aa8b8}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:26px 0 12px}.section-head h2{font-size:20px;margin:0}.section-head p{font-size:10px;color:var(--muted);margin:4px 0 0}.category-chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.cat{border:1px solid var(--line);background:#fff;padding:8px 11px;border-radius:999px;font-size:10px;font-weight:650;color:#617087;white-space:nowrap}.cat.active{background:#edf4ff;border-color:#cfe0fb;color:#2458a9}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.book{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 16px 40px -34px rgba(15,39,71,.45);display:flex;flex-direction:column;transition:.18s}.book:hover{transform:translateY(-3px);box-shadow:0 25px 46px -34px rgba(15,39,71,.55)}.cover{aspect-ratio:3/4;background:linear-gradient(135deg,#e9f2ff,#f2f4ff);position:relative;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.cover-ph{height:100%;display:grid;place-items:center;text-align:center;color:#7f93ad}.cover-ph i{font-size:34px;display:block;margin-bottom:6px}.cover-badges{position:absolute;left:10px;top:10px;right:10px;display:flex;justify-content:space-between;pointer-events:none}.fav{position:absolute;right:10px;bottom:10px;width:34px;height:34px;border:0;border-radius:11px;background:rgba(255,255,255,.92);color:#75849a;display:grid;place-items:center;box-shadow:0 7px 20px -14px #172236}.fav.active{color:#d64461}.book-body{padding:14px;display:flex;flex-direction:column;gap:8px;flex:1}.book-cat{font-size:9px;color:#3b68b1;font-weight:700}.book h3{font-size:13px;line-height:1.45;margin:0}.book-sub{font-size:9.5px;color:#7e8ca0;line-height:1.5}.tags{display:flex;gap:5px;flex-wrap:wrap}.tag{font-size:8px;padding:4px 6px;border-radius:7px;background:#f4f7fa;color:#77869a}.progress{height:6px;background:#eef2f6;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,#2f65d5,#16a17d)}.book-actions{display:flex;gap:7px;margin-top:auto}.book-actions .btn{flex:1;padding:8px}.empty{grid-column:1/-1;padding:55px 20px;text-align:center;color:#92a0b2}.empty i{font-size:34px;color:#d4dce7;display:block;margin-bottom:8px}.auth-page{min-height:100vh;display:grid;grid-template-columns:1.05fr .95fr}.auth-side{padding:clamp(28px,6vw,74px);background:linear-gradient(145deg,#102944,#1c4d82 60%,#3b5da1);color:#fff;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.auth-side:after{content:"";position:absolute;width:500px;height:500px;border-radius:50%;right:-250px;bottom:-270px;background:rgba(255,255,255,.06)}.auth-side h1{font-size:clamp(38px,5vw,65px);line-height:1.07;margin:15px 0}.auth-side p{color:#d5e1f2;line-height:1.8;max-width:620px}.auth-features{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:25px}.auth-feature{padding:12px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.06)}.auth-feature b{font-size:10px}.auth-feature span{display:block;font-size:8.5px;color:#cbd8ea;margin-top:3px}.auth-panel{display:grid;place-items:center;padding:24px}.auth-card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:0 30px 70px -48px rgba(15,39,71,.55)}.auth-card h2{font-size:22px;margin:0}.auth-card>p{font-size:11px;color:var(--muted);line-height:1.65}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f1f4f8;padding:4px;border-radius:12px;margin:15px 0}.tabs button{border:0;background:transparent;border-radius:9px;padding:9px;font-size:10px;font-weight:700;color:#7b899c}.tabs button.active{background:#fff;color:#265caa;box-shadow:0 5px 15px -12px rgba(0,0,0,.35)}.message{padding:10px 11px;border-radius:11px;background:#eef5ff;border:1px solid #d8e7fb;color:#315f8d;font-size:10px;line-height:1.6;margin-bottom:10px}.message.error{background:#fff1f3;border-color:#f4d0d8;color:#a3344a}.message.success{background:#ebfaf4;border-color:#ceefe3;color:#147157}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}.reader{position:fixed;inset:0;background:#111827;z-index:100;display:grid;grid-template-rows:auto 1fr}.reader-head{height:60px;background:#0b1322;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)}.reader-head .title{min-width:0}.reader-head b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55vw}.reader-head span{font-size:9px;color:#9badc4}.reader-tools{display:flex;align-items:center;gap:7px}.reader-tools button{border:1px solid rgba(255,255,255,.13);background:#172033;color:#fff;border-radius:9px;height:35px;min-width:35px;padding:0 9px}.reader-body{overflow:auto;display:grid;place-items:start center;padding:22px;position:relative}.page-wrap{position:relative;background:#fff;box-shadow:0 20px 55px rgba(0,0,0,.35)}#pdfCanvas{display:block;max-width:100%;height:auto}.watermark{position:absolute;inset:0;pointer-events:none;overflow:hidden;opacity:.13;background-repeat:repeat;background-size:320px 180px;mix-blend-mode:multiply}.reader-loading{color:#c8d3e0;padding:60px;text-align:center}.admin{max-width:1280px;margin:20px auto 50px;padding:0 18px}.admin-tabs{display:flex;gap:7px;margin:15px 0}.admin-tabs button.active{background:#edf4ff;border-color:#cfe0fb;color:#2458a9}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:13px}.panel h3{font-size:14px;margin:0 0 11px}.admin-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;min-width:800px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left;font-size:9px}.table th{background:#f8fafc;color:#7d8b9e}.thumb{width:42px;height:54px;border-radius:7px;object-fit:cover;background:#eef2f7}.import-box{border:1px dashed #bfcde0;border-radius:15px;padding:16px;background:#f8fbff}.import-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.upload-status{margin-top:10px;font-size:9px;color:#61748c;line-height:1.7}.loading{min-height:100vh;display:grid;place-items:center;color:#75849a}.spinner{width:35px;height:35px;border:4px solid #dce5ef;border-top-color:#3466c5;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 10px}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.hero-in{grid-template-columns:1fr}.hero-cards{max-width:600px}.admin-grid{grid-template-columns:1fr}}@media(max-width:780px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.toolbar{grid-template-columns:1fr}.auth-page{grid-template-columns:1fr}.auth-side{min-height:360px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.import-grid{grid-template-columns:1fr}.top{padding:0 12px}.brand span{display:none}}@media(max-width:500px){.grid{grid-template-columns:1fr 1fr;gap:9px}.book-body{padding:10px}.book h3{font-size:11px}.hero{padding-top:35px}.hero-cards{grid-template-columns:1fr 1fr}.reader-body{padding:8px}}
</style></head>
<body><div id="app"><div class="loading"><div><div class="spinner"></div>กำลังเปิด AreWarin Library…</div></div></div>
<script src="../config.js"></script>
<script>
const CONFIG={url:window.AREWARIN_CONFIG?.SUPABASE_URL||'',key:window.AREWARIN_CONFIG?.SUPABASE_ANON_KEY||''};
const sb=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const app=document.getElementById('app');
const S={session:null,me:null,mode:'login',signupMatch:null,catalog:[],categories:[],search:'',category:'',newOnly:false,admin:false,adminData:null,reader:null,pdf:null,page:1,scale:1.25};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const safePath=p=>String(p||'').split('/').map(encodeURIComponent).join('/');
const coverUrl=p=>p?`${CONFIG.url}/storage/v1/object/public/library-covers/${safePath(p)}`:'';
const toast=(m,i='success')=>Swal.fire({toast:true,position:'top-end',timer:2200,showConfirmButton:false,icon:i,title:m});
function rolePill(){const r=S.me?.role||'student';return `<span class="pill ${r}">${r==='admin'?'Admin':r==='staff'?'Tutor / Staff':'Student'}</span>`}
async function callStudentAuth(action,payload){const r=await fetch(`${CONFIG.url}/functions/v1/student-auth`,{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.key,'Authorization':`Bearer ${CONFIG.key}`},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'ระบบบัญชีนักเรียนไม่พร้อม');return d}
function authHtml(){const signup=S.mode==='signup';return `<div class="auth-page"><section class="auth-side"><div><a class="brand" href="../" style="color:#fff"><div class="brandmark">AW</div><div><b>AreWarin Library</b><span style="color:#c6d6eb">Digital Learning Library</span></div></a><div style="margin-top:60px"><div style="font-size:10px;letter-spacing:.15em;color:#bcd0eb;font-weight:700">AREWARIN DIGITAL LIBRARY</div><h1>อ่านตำราในระบบเดียว<br>กับบัญชี AreWarin</h1><p>คลังตำรา เอกสาร และหนังสือสำหรับนักเรียน ครู และทีมงาน เข้าถึงตามสิทธิ์ด้วยบัญชีเดิมของ AreWarin</p><div class="auth-features"><div class="auth-feature"><b>Private Reader</b><span>เปิดอ่านใน Library</span></div><div class="auth-feature"><b>Course Categories</b><span>ค้นหาเป็นหมวดหมู่</span></div><div class="auth-feature"><b>Reading Progress</b><span>จำหน้าที่อ่านล่าสุด</span></div></div></div></div><div style="font-size:10px;color:#b9c8dc"><i class="fa-solid fa-lock"></i> ไฟล์หนังสือเก็บใน Private Storage และเปิดผ่านระบบสิทธิ์</div></section><section class="auth-panel"><form id="authForm" class="auth-card"><h2>${signup?'สมัครบัญชีนักเรียน':'เข้าสู่ห้องสมุด'}</h2><p>${signup?'สำหรับนักเรียนที่มี Student Profile แล้ว แต่ยังไม่เคยสร้างบัญชี':'ครู แอดมิน และนักเรียน ใช้บัญชี AreWarin เดิมได้เลย'}</p><div class="tabs"><button type="button" data-mode="login" class="${!signup?'active':''}">เข้าสู่ระบบ</button><button type="button" data-mode="signup" class="${signup?'active':''}">สมัครบัญชีนักเรียน</button></div><div id="authMsg"></div>${signup?signupHtml():`<div class="field"><label>อีเมล</label><input class="input" name="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:9px"><label>รหัสผ่าน</label><input class="input" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button>`}<a class="btn" style="width:100%;margin-top:8px" href="../student/">ไป Student Hub</a></form></section></div>`}
function signupHtml(){if(!S.signupMatch)return `<div class="field"><label>เบอร์โทรที่มีข้อมูลอยู่ในระบบ</label><input id="signupPhone" class="input" inputmode="tel" placeholder="08xxxxxxxx"></div><button id="lookupStudent" class="btn blue" type="button" style="width:100%;margin-top:10px">ค้นหา Student Profile</button><div class="hint" style="margin-top:8px">ถ้ายังไม่มี Student Profile กรุณาสมัครเรียนหรือกรอกข้อมูลนักเรียนเก่าก่อน</div>`;const m=S.signupMatch;return `<div class="message success"><b>${esc(m.display_name||m.nickname||m.name||'นักเรียน')}</b><br>Student ID: ${esc(m.student_code||'—')}</div><div class="formgrid"><div class="field full"><label>อีเมล</label><input class="input" name="email" type="email" required value="${esc(m.email||'')}"></div><div class="field"><label>รหัสผ่าน</label><input class="input" name="password" type="password" minlength="8" required></div><div class="field"><label>ยืนยันรหัสผ่าน</label><input class="input" name="confirm_password" type="password" minlength="8" required></div><div class="field"><label>PIN 4 หลัก</label><input class="input" name="pin" inputmode="numeric" maxlength="4" required></div><div class="field"><label>ยืนยัน PIN</label><input class="input" name="confirm_pin" inputmode="numeric" maxlength="4" required></div></div><button class="btn primary" style="width:100%;margin-top:13px">สร้างบัญชีและเข้าห้องสมุด</button><button id="changeStudent" type="button" class="btn" style="width:100%;margin-top:7px">เปลี่ยนเบอร์โทร</button>`}
function bindAuth(){document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{S.mode=x.dataset.mode;S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});document.getElementById('lookupStudent')?.addEventListener('click',lookupStudent);document.getElementById('changeStudent')?.addEventListener('click',()=>{S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});document.getElementById('authForm').onsubmit=submitAuth}
async function lookupStudent(){const p=String(document.getElementById('signupPhone').value||'').replace(/\D/g,'');const box=document.getElementById('authMsg');if(p.length<9)return box.innerHTML='<div class="message error">กรุณากรอกเบอร์โทรให้ครบ</div>';box.innerHTML='<div class="message">กำลังค้นหา Student Profile…</div>';try{const {data,error}=await sb.rpc('lookup_student_by_phone',{p_phone:p});if(error)throw error;if(!data?.found)throw new Error(data?.message||'ไม่พบข้อมูลนักเรียน');if(data.account_exists){S.mode='login';app.innerHTML=authHtml();bindAuth();return Swal.fire('มีบัญชีแล้ว','Student Profile นี้มีบัญชีเข้าสู่ระบบแล้ว กรุณาใช้อีเมลและรหัสผ่านเดิม','info')}S.signupMatch={...data,phone:p};app.innerHTML=authHtml();bindAuth()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function submitAuth(e){e.preventDefault();const fd=new FormData(e.currentTarget),box=document.getElementById('authMsg');box.innerHTML='<div class="message">กำลังตรวจสอบบัญชี…</div>';try{if(S.mode==='login'){const {data,error}=await sb.auth.signInWithPassword({email:String(fd.get('email')).trim().toLowerCase(),password:String(fd.get('password'))});if(error)throw error;S.session=data.session;return bootSigned()}if(!S.signupMatch)throw new Error('กรุณาค้นหา Student Profile ก่อน');const email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password')),pin=String(fd.get('pin'));if(password!==String(fd.get('confirm_password')))throw new Error('รหัสผ่านไม่ตรงกัน');if(pin!==String(fd.get('confirm_pin'))||!/^[0-9]{4}$/.test(pin))throw new Error('PIN ต้องเป็นตัวเลข 4 หลักและตรงกัน');await callStudentAuth('register',{phone:S.signupMatch.phone,email,password,pin,student_code:S.signupMatch.student_code||null});const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;await bootSigned()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message||'ดำเนินการไม่สำเร็จ')}</div>`}}
async function bootSigned(){const {data,error}=await sb.rpc('library_whoami');if(error||!data?.ok){await sb.auth.signOut();throw new Error(error?.message||data?.message||'บัญชีนี้ไม่มีสิทธิ์ใช้ห้องสมุด')}S.me=data;S.admin=new URLSearchParams(location.search).get('admin')==='1'&&data.role==='admin';await loadCatalog();render()}
async function loadCatalog(){const {data,error}=await sb.rpc('library_catalog',{p_search:S.search||null,p_category_id:S.category||null,p_new_only:S.newOnly});if(error)throw error;S.catalog=data?.items||[];S.categories=data?.categories||[]}
function topHtml(){return `<header class="top"><a class="brand" href="../"><div class="brandmark">AW</div><div><b>AreWarin Library</b><span>Digital Learning Library</span></div></a><div class="top-actions">${S.me?.role==='admin'?`<button class="btn" id="adminToggle"><i class="fa-solid fa-gear"></i> ${S.admin?'กลับหน้าห้องสมุด':'จัดการห้องสมุด'}</button>`:''}${rolePill()}<button class="btn" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>`}
function catalogHtml(){return `${topHtml()}<section class="hero"><div class="hero-in"><div><div class="hero-kicker">AREWARIN DIGITAL LIBRARY</div><h1>คลังความรู้สำหรับ<br>การเรียนที่ต่อเนื่อง</h1><p>อ่านตำราและเอกสารในระบบ AreWarin โดยใช้บัญชีเดิม ค้นหาเป็นหมวดหมู่ ติดตามหน้าที่อ่านล่าสุด และดูหนังสือใหม่ได้จากที่เดียว</p></div><div class="hero-cards"><div class="hero-card"><i class="fa-solid fa-book-open"></i><b>Private Reader</b><span>เปิดอ่านผ่านระบบห้องสมุด</span></div><div class="hero-card"><i class="fa-solid fa-layer-group"></i><b>Categories</b><span>จัดหมวดหมู่และค้นหาง่าย</span></div><div class="hero-card"><i class="fa-solid fa-clock-rotate-left"></i><b>Continue Reading</b><span>จำหน้าที่อ่านล่าสุด</span></div><div class="hero-card"><i class="fa-solid fa-sparkles"></i><b>New Collection</b><span>มีป้าย NEW สำหรับเล่มใหม่</span></div></div></div></section><main class="content"><div class="toolbar"><div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="search" value="${esc(S.search)}" placeholder="ค้นหาชื่อหนังสือ ผู้แต่ง ISBN หรือ tag"></div><select id="category"><option value="">ทุกหมวดหมู่</option>${S.categories.map(c=>`<option value="${c.id}" ${S.category===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label class="btn"><input id="newOnly" type="checkbox" ${S.newOnly?'checked':''}> NEW เท่านั้น</label></div><div class="section-head"><div><h2>หนังสือและเอกสาร</h2><p>${S.catalog.length} รายการที่คุณมีสิทธิ์เข้าถึง</p></div></div><div class="category-chips"><button class="cat ${!S.category?'active':''}" data-cat="">ทั้งหมด</button>${S.categories.map(c=>`<button class="cat ${S.category===c.id?'active':''}" data-cat="${c.id}">${esc(c.icon||'▤')} ${esc(c.name)}</button>`).join('')}</div><div class="grid" id="bookGrid">${booksHtml()}</div></main>`}
function booksHtml(){if(!S.catalog.length)return '<div class="empty"><i class="fa-solid fa-book-open"></i><b>ยังไม่พบหนังสือในหมวดนี้</b><br><span>ลองเปลี่ยนคำค้นหาหรือหมวดหมู่</span></div>';return S.catalog.map(b=>`<article class="book"><div class="cover">${b.cover_path?`<img src="${coverUrl(b.cover_path)}" alt="${esc(b.title)}">`:`<div class="cover-ph"><div><i class="fa-solid fa-book"></i>${esc(b.category_name||'AreWarin Library')}</div></div>`}<div class="cover-badges">${b.is_new?'<span class="pill new">NEW</span>':'<span></span>'}<span class="pill" style="background:rgba(255,255,255,.92);color:#617087">${esc(b.category_name||'ทั่วไป')}</span></div><button class="fav ${b.favorite?'active':''}" data-fav="${b.id}"><i class="${b.favorite?'fa-solid':'fa-regular'} fa-heart"></i></button></div><div class="book-body"><div class="book-cat">${esc(b.author||b.publisher||'AreWarin')}</div><h3>${esc(b.title)}</h3>${b.subtitle?`<div class="book-sub">${esc(b.subtitle)}</div>`:''}<div class="tags">${(b.tags||[]).slice(0,3).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>${b.progress_pct>0?`<div><div class="progress"><i style="width:${Math.min(100,b.progress_pct)}%"></i></div><div class="hint" style="margin-top:4px">อ่านแล้ว ${Math.round(b.progress_pct)}% · หน้าล่าสุด ${b.last_page||1}</div></div>`:''}<div class="book-actions"><button class="btn primary" data-open="${b.id}"><i class="fa-solid fa-book-open-reader"></i> ${b.progress_pct>0?'อ่านต่อ':'เปิดอ่าน'}</button></div></div></article>`).join('')}
function bindCatalog(){document.getElementById('logout').onclick=logout;document.getElementById('adminToggle')?.addEventListener('click',async()=>{S.admin=!S.admin;if(S.admin)await loadAdmin();render()});let t;document.getElementById('search').oninput=e=>{clearTimeout(t);S.search=e.target.value;t=setTimeout(refreshCatalog,350)};document.getElementById('category').onchange=e=>{S.category=e.target.value;refreshCatalog()};document.getElementById('newOnly').onchange=e=>{S.newOnly=e.target.checked;refreshCatalog()};document.querySelectorAll('[data-cat]').forEach(x=>x.onclick=()=>{S.category=x.dataset.cat;refreshCatalog()});document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openReader(x.dataset.open));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(x.dataset.fav)})}
async function refreshCatalog(){await loadCatalog();document.querySelector('#bookGrid').innerHTML=booksHtml();document.querySelectorAll('[data-open]').forEach(x=>x.onclick=()=>openReader(x.dataset.open));document.querySelectorAll('[data-fav]').forEach(x=>x.onclick=e=>{e.stopPropagation();toggleFav(x.dataset.fav)});document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('active',x.dataset.cat===S.category))}
async function toggleFav(id){const {error}=await sb.rpc('library_toggle_favorite',{p_item_id:id});if(error)return toast(error.message,'error');await refreshCatalog()}
async function readerToken(id){const r=await fetch(`${CONFIG.url}/functions/v1/library-reader`,{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.key,'Authorization':`Bearer ${S.session.access_token}`},body:JSON.stringify({item_id:id})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'ไม่สามารถเปิดหนังสือได้');return d}
async function openReader(id){try{Swal.fire({title:'กำลังเตรียมหนังสือ',allowOutsideClick:false,didOpen:()=>Swal.showLoading(),showConfirmButton:false});const d=await readerToken(id);Swal.close();S.reader={...d,item_id:id};S.page=d.last_page||1;S.scale=1.25;app.insertAdjacentHTML('beforeend',readerHtml());bindReader();const task=pdfjsLib.getDocument({url:d.signed_url});S.pdf=await task.promise;S.page=Math.min(Math.max(1,S.page),S.pdf.numPages);await renderPage()}catch(e){Swal.close();Swal.fire('เปิดหนังสือไม่ได้',e.message,'error')}}
function readerHtml(){return `<div id="reader" class="reader"><div class="reader-head"><div class="title"><b>${esc(S.reader.title)}</b><span>อ่านภายใน AreWarin Library · ${esc(S.reader.watermark||'')}</span></div><div class="reader-tools"><button id="prev"><i class="fa-solid fa-chevron-left"></i></button><span id="pageLabel" style="font-size:10px;color:#fff">—</span><button id="next"><i class="fa-solid fa-chevron-right"></i></button><button id="zoomOut">−</button><button id="zoomIn">+</button><button id="closeReader"><i class="fa-solid fa-xmark"></i></button></div></div><div class="reader-body" id="readerBody"><div id="pageWrap" class="page-wrap"><canvas id="pdfCanvas"></canvas><div id="wm" class="watermark"></div></div><div id="readerLoading" class="reader-loading hidden">กำลังโหลดหน้า…</div></div></div>`}
function bindReader(){const r=document.getElementById('reader');r.oncontextmenu=e=>e.preventDefault();document.addEventListener('keydown',readerKeys,true);document.getElementById('closeReader').onclick=closeReader;document.getElementById('prev').onclick=()=>changePage(-1);document.getElementById('next').onclick=()=>changePage(1);document.getElementById('zoomOut').onclick=()=>{S.scale=Math.max(.7,S.scale-.15);renderPage()};document.getElementById('zoomIn').onclick=()=>{S.scale=Math.min(2.2,S.scale+.15);renderPage()};const wm=esc(S.reader.watermark||'AreWarin Library');document.getElementById('wm').style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='320' height='180'><text x='25' y='90' transform='rotate(-25 160 90)' fill='%23172944' font-size='15' font-family='Arial'>${wm}</text></svg>`)}")`}
function readerKeys(e){if(!document.getElementById('reader'))return;if((e.ctrlKey||e.metaKey)&&['s','p'].includes(e.key.toLowerCase())){e.preventDefault();toast('หนังสือเล่มนี้เปิดอ่านภายในระบบเท่านั้น','info')}if(e.key==='ArrowRight')changePage(1);if(e.key==='ArrowLeft')changePage(-1);if(e.key==='Escape')closeReader()}
async function changePage(d){if(!S.pdf)return;S.page=Math.min(S.pdf.numPages,Math.max(1,S.page+d));await renderPage()}
async function renderPage(){if(!S.pdf)return;const page=await S.pdf.getPage(S.page),vp=page.getViewport({scale:S.scale}),canvas=document.getElementById('pdfCanvas'),ctx=canvas.getContext('2d');canvas.width=vp.width;canvas.height=vp.height;await page.render({canvasContext:ctx,viewport:vp}).promise;document.getElementById('pageLabel').textContent=`${S.page} / ${S.pdf.numPages}`;document.getElementById('prev').disabled=S.page<=1;document.getElementById('next').disabled=S.page>=S.pdf.numPages;const pct=Math.round(S.page/S.pdf.numPages*100);sb.rpc('library_progress_save',{p_item_id:S.reader.item_id,p_last_page:S.page,p_total_pages:S.pdf.numPages}).then(()=>{}).catch(()=>{})}
function closeReader(){document.removeEventListener('keydown',readerKeys,true);document.getElementById('reader')?.remove();S.pdf=null;S.reader=null;refreshCatalog()}
async function loadAdmin(){const {data,error}=await sb.rpc('library_admin_bootstrap');if(error)throw error;S.adminData=data}
function adminHtml(){const d=S.adminData||{categories:[],items:[]};return `${topHtml()}<main class="admin"><div class="section-head"><div><h2>จัดการ AreWarin Library</h2><p>หมวดหมู่ หนังสือ ไฟล์ PDF ปก และ Excel Import</p></div><button class="btn primary" id="backLibrary"><i class="fa-solid fa-book-open"></i> กลับหน้าห้องสมุด</button></div><div class="admin-tabs"><button class="btn active" data-admin-tab="items">หนังสือ</button><button class="btn" data-admin-tab="categories">หมวดหมู่</button><button class="btn" data-admin-tab="import">Excel Import</button></div><div id="adminPanel">${adminItemsHtml(d)}</div></main>`}
function adminItemsHtml(d){return `<div class="panel"><h3>เพิ่ม / แก้ไขหนังสือ</h3><form id="bookForm"><input type="hidden" name="id"><input type="hidden" name="old_file_path"><input type="hidden" name="old_cover_path"><div class="formgrid"><div class="field full"><label>ชื่อหนังสือ *</label><input class="input" name="title" required></div><div class="field full"><label>ชื่อรอง</label><input class="input" name="subtitle"></div><div class="field"><label>หมวดหมู่</label><select name="category_id"><option value="">ไม่ระบุ</option>${d.categories.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>ผู้แต่ง</label><input class="input" name="author"></div><div class="field"><label>สำนักพิมพ์</label><input class="input" name="publisher"></div><div class="field"><label>ปีพิมพ์</label><input class="input" name="publication_year" type="number"></div><div class="field"><label>ISBN</label><input class="input" name="isbn"></div><div class="field"><label>Audience</label><select name="audience"><option value="all">ทุกคน</option><option value="students">นักเรียน</option><option value="staff">ครู/แอดมิน</option></select></div><div class="field full"><label>คำอธิบาย</label><textarea name="description" rows="3"></textarea></div><div class="field full"><label>Tags (คั่นด้วย comma)</label><input class="input" name="tags"></div><div class="field"><label>ไฟล์ PDF *</label><input id="bookPdf" type="file" accept="application/pdf"></div><div class="field"><label>ภาพปก</label><input id="bookCover" type="file" accept="image/*"></div><div class="field"><label><input type="checkbox" name="is_new"> แสดง NEW</label><input class="input" name="new_until" type="date"></div><div class="field"><label>Status</label><select name="status"><option value="published">published</option><option value="draft">draft</option><option value="archived">archived</option></select></div></div><div style="display:flex;gap:7px;margin-top:12px"><button class="btn primary">บันทึกหนังสือ</button><button id="resetBook" class="btn" type="button">ล้างฟอร์ม</button></div></form></div><div class="panel"><h3>รายการหนังสือ</h3><div class="tablewrap"><table class="table"><thead><tr><th>ปก</th><th>ชื่อ</th><th>หมวด</th><th>Audience</th><th>Status</th><th>NEW</th><th></th></tr></thead><tbody>${d.items.map(x=>`<tr><td>${x.cover_path?`<img class="thumb" src="${coverUrl(x.cover_path)}">`:'—'}</td><td><b>${esc(x.title)}</b><br><span class="hint">${esc(x.author||'')}</span></td><td>${esc(x.category_name||'—')}</td><td>${esc(x.audience)}</td><td>${esc(x.status)}</td><td>${x.is_new?'NEW':'—'}</td><td><button class="btn" data-edit="${x.id}">แก้ไข</button></td></tr>`).join('')}</tbody></table></div></div>`}
function adminCategoriesHtml(d){return `<div class="admin-grid"><div class="panel"><h3>เพิ่มหมวดหมู่</h3><form id="catForm"><div class="field"><label>รหัสหมวดหมู่ *</label><input class="input" name="code" required placeholder="BIO_ALEVEL"></div><div class="field" style="margin-top:8px"><label>ชื่อหมวด *</label><input class="input" name="name" required></div><div class="field" style="margin-top:8px"><label>ไอคอน / Emoji</label><input class="input" name="icon" placeholder="🧬"></div><div class="field" style="margin-top:8px"><label>คำอธิบาย</label><textarea name="description" rows="3"></textarea></div><button class="btn primary" style="margin-top:10px">เพิ่มหมวดหมู่</button></form></div><div class="panel"><h3>หมวดหมู่ปัจจุบัน</h3>${d.categories.map(c=>`<div style="display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #edf1f5"><span><b>${esc(c.icon||'▤')} ${esc(c.name)}</b><br><span class="hint">${esc(c.code)}</span></span><span class="hint">${c.item_count||0} เล่ม</span></div>`).join('')||'<div class="empty">ยังไม่มีหมวดหมู่</div>'}</div></div>`}
function adminImportHtml(){return `<div class="panel"><h3>นำเข้าหนังสือด้วย Excel</h3><div class="import-box"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px"><div><b>1. ดาวน์โหลด Template</b><div class="hint">กรอก metadata และชื่อไฟล์ PDF / ปก ให้ตรงกับไฟล์ที่จะเลือก</div></div><a class="btn blue" href="./arewarin-library-import-template.xlsx" download><i class="fa-solid fa-file-excel"></i> ดาวน์โหลด Template</a></div><div class="import-grid"><div class="field"><label>2. Excel (.xlsx)</label><input id="importExcel" type="file" accept=".xlsx,.xls"></div><div class="field"><label>3. PDF ทั้งหมด</label><input id="importPdfs" type="file" accept="application/pdf" multiple></div><div class="field"><label>4. ภาพปกทั้งหมด</label><input id="importCovers" type="file" accept="image/*" multiple></div></div><button id="runImport" class="btn primary" style="margin-top:12px"><i class="fa-solid fa-cloud-arrow-up"></i> Import และ Upload</button><div id="importStatus" class="upload-status"></div></div></div>`}
function bindAdmin(){document.getElementById('logout').onclick=logout;document.getElementById('backLibrary').onclick=()=>{S.admin=false;render()};document.getElementById('adminToggle').onclick=()=>{S.admin=false;render()};document.querySelectorAll('[data-admin-tab]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-admin-tab]').forEach(y=>y.classList.remove('active'));x.classList.add('active');const p=document.getElementById('adminPanel');p.innerHTML=x.dataset.adminTab==='categories'?adminCategoriesHtml(S.adminData):x.dataset.adminTab==='import'?adminImportHtml():adminItemsHtml(S.adminData);bindAdminPanel(x.dataset.adminTab)});bindAdminPanel('items')}
function bindAdminPanel(tab){if(tab==='items'){document.getElementById('bookForm').onsubmit=saveBook;document.getElementById('resetBook').onclick=()=>document.getElementById('bookForm').reset();document.querySelectorAll('[data-edit]').forEach(x=>x.onclick=()=>fillBook(x.dataset.edit))}if(tab==='categories')document.getElementById('catForm').onsubmit=saveCategory;if(tab==='import')document.getElementById('runImport').onclick=runImport}
function fillBook(id){const x=S.adminData.items.find(i=>i.id===id),f=document.getElementById('bookForm');if(!x||!f)return;for(const k of ['id','title','subtitle','category_id','author','publisher','publication_year','isbn','description','audience','new_until','status'])if(f.elements[k])f.elements[k].value=x[k]??'';f.elements.tags.value=(x.tags||[]).join(',');f.elements.is_new.checked=!!x.is_new;f.elements.old_file_path.value=x.file_path||'';f.elements.old_cover_path.value=x.cover_path||'';window.scrollTo({top:0,behavior:'smooth'})}
function cleanName(n){return String(n||'file').replace(/[^A-Za-z0-9._-]+/g,'-').slice(-120)}
async function uploadFile(bucket,file,folder){const path=`${folder}/${crypto.randomUUID()}-${cleanName(file.name)}`;const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
async function saveBook(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f);try{let filePath=fd.get('old_file_path')||'',coverPath=fd.get('old_cover_path')||'';const pdf=document.getElementById('bookPdf').files[0],cover=document.getElementById('bookCover').files[0];if(pdf)filePath=await uploadFile('library-books',pdf,'books');if(cover)coverPath=await uploadFile('library-covers',cover,'covers');if(!filePath)throw new Error('กรุณาเลือกไฟล์ PDF');const payload={id:fd.get('id')||null,title:fd.get('title'),subtitle:fd.get('subtitle'),category_id:fd.get('category_id')||null,author:fd.get('author'),publisher:fd.get('publisher'),publication_year:fd.get('publication_year')?Number(fd.get('publication_year')):null,isbn:fd.get('isbn'),description:fd.get('description'),tags:String(fd.get('tags')||'').split(',').map(x=>x.trim()).filter(Boolean),file_path:filePath,cover_path:coverPath,audience:fd.get('audience'),is_new:fd.get('is_new')==='on',new_until:fd.get('new_until')||null,status:fd.get('status')};const {data,error}=await sb.rpc('library_admin_save_item',{p_payload:payload});if(error||!data?.ok)throw new Error(error?.message||data?.message);toast('บันทึกหนังสือแล้ว');await loadAdmin();render()}catch(e){Swal.fire('บันทึกไม่สำเร็จ',e.message,'error')}}
async function saveCategory(e){e.preventDefault();const fd=new FormData(e.currentTarget);const {data,error}=await sb.rpc('library_admin_save_category',{p_payload:{code:String(fd.get('code')).trim().toUpperCase(),name:fd.get('name'),icon:fd.get('icon'),description:fd.get('description')}});if(error||!data?.ok)return Swal.fire('บันทึกไม่สำเร็จ',error?.message||data?.message,'error');toast('เพิ่มหมวดหมู่แล้ว');await loadAdmin();render()}
async function runImport(){const ex=document.getElementById('importExcel').files[0],pdfs=[...document.getElementById('importPdfs').files],covers=[...document.getElementById('importCovers').files],st=document.getElementById('importStatus');if(!ex)return toast('กรุณาเลือกไฟล์ Excel','warning');try{const buf=await ex.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''}).filter(r=>r.title);if(!rows.length)throw new Error('ไม่พบรายการหนังสือใน Excel');const pm=new Map(pdfs.map(f=>[f.name,f])),cm=new Map(covers.map(f=>[f.name,f])),out=[];for(let i=0;i<rows.length;i++){const r=rows[i];st.innerHTML=`กำลังอัปโหลด ${i+1}/${rows.length}: <b>${esc(r.title)}</b>`;let fp='',cp='';if(r.pdf_file){const f=pm.get(String(r.pdf_file).trim());if(!f)throw new Error(`ไม่พบ PDF: ${r.pdf_file}`);fp=await uploadFile('library-books',f,'books')}if(r.cover_file){const f=cm.get(String(r.cover_file).trim());if(!f)throw new Error(`ไม่พบภาพปก: ${r.cover_file}`);cp=await uploadFile('library-covers',f,'covers')}out.push({title:r.title,subtitle:r.subtitle||'',category_code:String(r.category_code||'').trim().toUpperCase(),author:r.author||'',publisher:r.publisher||'',publication_year:r.publication_year?Number(r.publication_year):null,isbn:r.isbn||'',description:r.description||'',tags:String(r.tags||'').split(',').map(x=>x.trim()).filter(Boolean),file_path:fp,cover_path:cp,audience:r.audience||'all',is_new:String(r.is_new||'').toLowerCase()==='yes',new_until:r.new_until||null,status:r.status||'published',sort_order:r.sort_order?Number(r.sort_order):100})}const {data,error}=await sb.rpc('library_admin_bulk_upsert',{p_rows:out});if(error||!data?.ok)throw new Error(error?.message||data?.message);st.innerHTML=`<span style="color:#148164"><b>สำเร็จ</b> นำเข้า ${data.inserted||out.length} รายการ</span>`;toast('Import สำเร็จ');await loadAdmin()}catch(e){st.innerHTML=`<span style="color:#bd3650">${esc(e.message)}</span>`}}
function render(){app.innerHTML=S.admin?adminHtml():catalogHtml();S.admin?bindAdmin():bindCatalog()}
async function logout(){await sb.auth.signOut({scope:'local'});S.session=null;S.me=null;S.admin=false;S.signupMatch=null;S.mode='login';app.innerHTML=authHtml();bindAuth()}
async function boot(){const {data}=await sb.auth.getSession();S.session=data.session;if(S.session){try{await bootSigned()}catch(e){app.innerHTML=authHtml();bindAuth()}}else{app.innerHTML=authHtml();bindAuth()}sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_OUT'&&!S.session){app.innerHTML=authHtml();bindAuth()}})}boot();
</script></body></html>
