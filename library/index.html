<script>
const CONFIG={url:window.AREWARIN_CONFIG?.SUPABASE_URL||'',key:window.AREWARIN_CONFIG?.SUPABASE_ANON_KEY||''};
const sb=window.supabase.createClient(CONFIG.url,CONFIG.key,{auth:{persistSession:true,autoRefreshToken:true}});
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const app=document.getElementById('app'),modalMount=document.getElementById('modalMount');
const S={session:null,me:null,mode:'login',signupMatch:null,home:null,items:[],categories:[],collections:[],filter:'all',search:'',category:'',collection:'',author:'',year:'',admin:false,adminData:null,adminTab:'dashboard',adminBook:null,selected:new Set(),importRows:[],reader:null,pdf:null,page:1,scale:1.2,fit:'width',theme:'light',outline:[],readerState:{bookmarks:[],notes:[]},sideTab:'toc',deviceKey:null};
console.info('[AreWarin Library V2.3.1] PDF null-path guard loaded');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const safePath=p=>String(p||'').split('/').map(encodeURIComponent).join('/');
const coverUrl=p=>p?`${CONFIG.url}/storage/v1/object/public/library-covers/${safePath(p)}`:'';
const toast=(m,i='success')=>Swal.fire({toast:true,position:'top-end',timer:2100,showConfirmButton:false,icon:i,title:m});
const money=n=>Number(n||0).toLocaleString('th-TH');
const dt=v=>{if(!v)return '—';try{return new Date(v).toLocaleString('th-TH',{dateStyle:'medium',timeStyle:'short'})}catch(_){return String(v)}};
function rolePill(){const r=S.me?.role||'student';return `<span class="pill ${r}">${r==='admin'?'Admin':r==='staff'?'Tutor / Staff':'Student'}</span>`}
function modal(title,body,footer=''){modalMount.innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modalhead"><b>${esc(title)}</b><button class="btn iconbtn" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button></div><div class="modalbody">${body}</div>${footer?`<div class="modalfoot">${footer}</div>`:''}</div></div>`}
function closeModal(){modalMount.innerHTML=''}
async function callStudentAuth(action,payload){const r=await fetch(`${CONFIG.url}/functions/v1/student-auth`,{method:'POST',headers:{'Content-Type':'application/json','apikey':CONFIG.key,'Authorization':`Bearer ${CONFIG.key}`},body:JSON.stringify({action,...payload})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.ok)throw new Error(d.message||'ระบบบัญชีนักเรียนไม่พร้อม');return d}
function authHtml(){const signup=S.mode==='signup';return `<div class="auth-page"><section class="auth-side"><div><a class="brand" href="../" style="color:#fff"><div class="brandmark">AW</div><div><b>AreWarin Library</b><span style="color:#c6d6eb">Digital Learning Library V2</span></div></a><div style="margin-top:58px"><div style="font-size:10px;letter-spacing:.15em;color:#bcd0eb;font-weight:700">PRIVATE DIGITAL LEARNING LIBRARY</div><h1>ห้องสมุดที่จำ<br>สิ่งที่คุณกำลังเรียน</h1><p>อ่านตำรา เก็บเล่มโปรด ปักหมุด จดโน้ต Bookmark และอ่านต่อจากหน้าล่าสุด ด้วยบัญชี AreWarin เดิม</p><div class="auth-features"><div class="auth-feature"><b>My Shelf</b><span>Favorite + Pin</span></div><div class="auth-feature"><b>Reader Notes</b><span>Bookmark & Notes</span></div><div class="auth-feature"><b>Course Library</b><span>หนังสือตามคอร์ส</span></div></div></div></div><div style="font-size:10px;color:#b9c8dc"><i class="fa-solid fa-lock"></i> PDF อยู่ใน Private Storage และเปิดตามสิทธิ์ของบัญชี</div></section><section class="auth-panel"><form id="authForm" class="auth-card"><h2>${signup?'สมัครบัญชีนักเรียน':'เข้าสู่ AreWarin Library'}</h2><p>${signup?'สำหรับนักเรียนที่มี Student Profile แล้ว แต่ยังไม่ได้สร้างบัญชี':'นักเรียน ครู และแอดมิน ใช้บัญชี AreWarin เดิม'}</p><div class="tabs"><button type="button" data-mode="login" class="${!signup?'active':''}">เข้าสู่ระบบ</button><button type="button" data-mode="signup" class="${signup?'active':''}">สมัครบัญชีนักเรียน</button></div><div id="authMsg"></div>${signup?signupHtml():`<div class="field"><label>อีเมล</label><input class="input" name="email" type="email" autocomplete="email" required></div><div class="field" style="margin-top:9px"><label>รหัสผ่าน</label><input class="input" name="password" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%;margin-top:14px">เข้าสู่ระบบ</button>`}<a class="btn" style="width:100%;margin-top:8px" href="../student/">ไป Student Hub</a></form></section></div>`}
function signupHtml(){if(!S.signupMatch)return `<div class="field"><label>เบอร์โทรที่มี Student Profile อยู่ในระบบ</label><input id="signupPhone" class="input" inputmode="tel" placeholder="08xxxxxxxx"></div><button id="lookupStudent" class="btn blue" type="button" style="width:100%;margin-top:10px">ค้นหา Student Profile</button><div class="hint" style="margin-top:8px">ถ้ายังไม่มี Student Profile ให้สมัครเรียนหรือกรอกข้อมูลนักเรียนเก่าก่อน</div>`;const m=S.signupMatch;return `<div class="message success"><b>${esc(m.display_name||m.nickname||m.name||'นักเรียน')}</b><br>Student ID: ${esc(m.student_code||'—')}</div><div class="formgrid"><div class="field full"><label>อีเมล</label><input class="input" name="email" type="email" required value="${esc(m.email||'')}"></div><div class="field"><label>รหัสผ่าน</label><input class="input" name="password" type="password" minlength="8" required></div><div class="field"><label>ยืนยันรหัสผ่าน</label><input class="input" name="confirm_password" type="password" minlength="8" required></div><div class="field"><label>PIN 4 หลัก</label><input class="input" name="pin" inputmode="numeric" maxlength="4" required></div><div class="field"><label>ยืนยัน PIN</label><input class="input" name="confirm_pin" inputmode="numeric" maxlength="4" required></div></div><button class="btn primary" style="width:100%;margin-top:13px">สร้างบัญชีและเข้าห้องสมุด</button><button id="changeStudent" type="button" class="btn" style="width:100%;margin-top:7px">เปลี่ยนเบอร์โทร</button>`}
function bindAuth(){document.querySelectorAll('[data-mode]').forEach(x=>x.onclick=()=>{S.mode=x.dataset.mode;S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});document.getElementById('lookupStudent')?.addEventListener('click',lookupStudent);document.getElementById('changeStudent')?.addEventListener('click',()=>{S.signupMatch=null;app.innerHTML=authHtml();bindAuth()});document.getElementById('authForm').onsubmit=submitAuth}
async function lookupStudent(){const p=String(document.getElementById('signupPhone').value||'').replace(/\D/g,'');const box=document.getElementById('authMsg');if(p.length<9)return box.innerHTML='<div class="message error">กรุณากรอกเบอร์โทรให้ครบ</div>';box.innerHTML='<div class="message">กำลังค้นหา Student Profile…</div>';try{const {data,error}=await sb.rpc('lookup_student_by_phone',{p_phone:p});if(error)throw error;if(!data?.found)throw new Error(data?.message||'ไม่พบข้อมูลนักเรียน');if(data.account_exists){S.mode='login';app.innerHTML=authHtml();bindAuth();return Swal.fire('มีบัญชีแล้ว','กรุณาใช้อีเมลและรหัสผ่านเดิม','info')}S.signupMatch={...data,phone:p};app.innerHTML=authHtml();bindAuth()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message)}</div>`}}
async function submitAuth(e){e.preventDefault();const fd=new FormData(e.currentTarget),box=document.getElementById('authMsg');box.innerHTML='<div class="message">กำลังตรวจสอบบัญชี…</div>';try{if(S.mode==='login'){const {data,error}=await sb.auth.signInWithPassword({email:String(fd.get('email')).trim().toLowerCase(),password:String(fd.get('password'))});if(error)throw error;S.session=data.session;return bootSigned()}if(!S.signupMatch)throw new Error('กรุณาค้นหา Student Profile ก่อน');const email=String(fd.get('email')).trim().toLowerCase(),password=String(fd.get('password')),pin=String(fd.get('pin'));if(password!==String(fd.get('confirm_password')))throw new Error('รหัสผ่านไม่ตรงกัน');if(pin!==String(fd.get('confirm_pin'))||!/^[0-9]{4}$/.test(pin))throw new Error('PIN ต้องเป็นตัวเลข 4 หลักและตรงกัน');await callStudentAuth('register',{phone:S.signupMatch.phone,email,password,pin,student_code:S.signupMatch.student_code||null});const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;S.session=data.session;await bootSigned()}catch(e){box.innerHTML=`<div class="message error">${esc(e.message||'ดำเนินการไม่สำเร็จ')}</div>`}}
function deviceKey(){let k=localStorage.getItem('aw_library_device');if(!k){k=crypto.randomUUID();localStorage.setItem('aw_library_device',k)}return k}
async function bootSigned(){const {data,error}=await sb.rpc('library_whoami');if(error||!data?.ok){await sb.auth.signOut();throw new Error(error?.message||data?.message||'บัญชีนี้ไม่มีสิทธิ์ใช้ห้องสมุด')}S.me=data;S.deviceKey=deviceKey();const {data:dev,error:devErr}=await sb.rpc('library_session_touch',{p_session_key:S.deviceKey,p_device_label:`${navigator.platform||''} · ${navigator.userAgent.slice(0,120)}`});if(devErr||!dev?.ok){await sb.auth.signOut({scope:'local'});throw new Error(devErr?.message||dev?.message||'จำนวนอุปกรณ์เกินที่กำหนด')}S.admin=new URLSearchParams(location.search).get('admin')==='1'&&data.role==='admin';await loadHome();if(S.admin)await loadAdmin();render()}
async function loadHome(){const {data,error}=await sb.rpc('library_home');if(error)throw error;S.home=data||{};S.items=data?.items||[];S.categories=data?.categories||[];S.collections=data?.collections||[]}
function topHtml(){const n=Number(S.home?.unseen_new||0);return `<header class="top"><a class="brand" href="../"><div class="brandmark">AW</div><div><b>${esc(S.me?.settings?.library_name||'AreWarin Library')}</b><span>Digital Learning Library</span></div></a><div class="top-actions"><button class="btn iconbtn newbell" id="newBell" title="หนังสือใหม่"><i class="fa-solid fa-bell"></i>${n?`<em>${n>99?'99+':n}</em>`:''}</button><button class="btn labelhide" id="requestBook"><i class="fa-solid fa-book-medical"></i> ขอหนังสือ</button>${S.me?.role==='admin'?`<button class="btn" id="adminToggle"><i class="fa-solid fa-gear"></i> <span class="labelhide">${S.admin?'กลับห้องสมุด':'Library Studio'}</span></button>`:''}${rolePill()}<button class="btn iconbtn" id="logout"><i class="fa-solid fa-right-from-bracket"></i></button></div></header>`}
function getFiltered(){const q=S.search.trim().toLowerCase();return S.items.filter(b=>{if(S.category&&b.category_id!==S.category)return false;if(S.collection&&!(b.collections||[]).some(c=>c.id===S.collection))return false;if(S.author&&b.author!==S.author)return false;if(S.year&&String(b.publication_year||'')!==String(S.year))return false;if(q&&!([b.title,b.subtitle,b.author,b.publisher,b.isbn,(b.tags||[]).join(' ')].join(' ').toLowerCase().includes(q)))return false;switch(S.filter){case'new':return b.computed_new;case'favorite':return b.favorite;case'pinned':return b.pinned;case'reading':return b.progress_pct>0&&!b.completed;case'completed':return b.completed;case'course':return b.for_my_course;case'featured':return b.featured||b.recommended;default:return true}})}
function shelf(title,sub,rows){if(!rows.length)return'';return `<section><div class="section-head"><div><h2>${title}</h2><p>${sub}</p></div></div><div class="shelf">${rows.map(bookCard).join('')}</div></section>`}
function defaultExternalLabel(t){t=normalizeContentType(t);return 'เปิดลิงก์'}
function linkButtonLabel(item){return String(item?.external_label||'').trim()||defaultExternalLabel(item?.content_type)}
const externalCoverCache=new Map();
const externalCoverPending=new Map();

function googleDriveId(url){
  const s=String(url||'');
  const m=s.match(/\/d\/([A-Za-z0-9_-]{10,})/)
    || s.match(/[?&]id=([A-Za-z0-9_-]{10,})/)
    || s.match(/\/file\/d\/([A-Za-z0-9_-]{10,})/);
  return m?m[1]:'';
}


function googleWorkspacePreviewUrl(url){
  if(!validHttpUrl(url))return'';
  try{
    const u=new URL(String(url));
    const host=u.hostname.toLowerCase();
    const p=u.pathname;

    // Google Docs / Sheets / Slides native preview.
    let m=p.match(/^\/(document|spreadsheets|presentation)\/d\/([A-Za-z0-9_-]{10,})/);
    if(host==='docs.google.com'&&m){
      return `https://docs.google.com/${m[1]}/d/${encodeURIComponent(m[2])}/preview`;
    }

    // Google Drive file preview, including PDF and Office files uploaded to Drive.
    const id=googleDriveId(url);
    if(id&&(host.includes('drive.google.com')||host.includes('docs.google.com'))){
      return `https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;
    }
  }catch(_){}
  return'';
}

function externalReaderInfo(url){
  if(!validHttpUrl(url))return null;
  const href=String(url).trim();

  try{
    const u=new URL(href);
    const host=u.hostname.toLowerCase();

    const gPreview=googleWorkspacePreviewUrl(href);
    if(gPreview){
      return{
        mode:'iframe',
        provider:host.includes('docs.google.com')?'Google':'Google Drive',
        reader_url:gPreview,
        original_url:href
      };
    }

    if(host.includes('dropbox.com')||host.includes('dropboxusercontent.com')){
      const candidates=externalPdfCandidates(href);
      return{
        mode:'pdfjs',
        provider:'Dropbox',
        pdf_candidates:candidates,
        iframe_url:dropboxRawUrl(href),
        original_url:href
      };
    }

    if(host.includes('1drv.ms')||host.includes('onedrive.live.com')){
      return{
        mode:'pdfjs',
        provider:'OneDrive',
        pdf_candidates:externalPdfCandidates(href),
        iframe_url:href,
        original_url:href
      };
    }

    if(host.includes('sharepoint.com')){
      return{
        mode:'pdfjs',
        provider:'SharePoint',
        pdf_candidates:externalPdfCandidates(href),
        iframe_url:href,
        original_url:href
      };
    }

    if(/\.pdf(?:[?#].*)?$/i.test(href)){
      return{
        mode:'pdfjs',
        provider:'Direct PDF',
        pdf_candidates:[href],
        iframe_url:href,
        original_url:href
      };
    }
  }catch(_){}

  return null;
}

function externalCanReadInLibrary(url){
  return !!externalReaderInfo(url);
}

function oneDriveShareToken(url){
  try{
    return btoa(unescape(encodeURIComponent(String(url||''))))
      .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  }catch(_){return''}
}

function externalProvider(url){
  if(!validHttpUrl(url))return'unknown';
  try{
    const host=new URL(String(url)).hostname.toLowerCase();
    if(host.includes('drive.google.com')||host.includes('docs.google.com')||host.includes('googleusercontent.com'))return'Google Drive';
    if(host.includes('1drv.ms')||host.includes('onedrive.live.com'))return'OneDrive';
    if(host.includes('sharepoint.com'))return'SharePoint';
    if(host.includes('dropbox.com')||host.includes('dropboxusercontent.com'))return'Dropbox';
    return'Direct URL';
  }catch(_){return'Unknown'}
}

function dropboxRawUrl(url){
  try{
    const u=new URL(String(url));
    if(!u.hostname.toLowerCase().includes('dropbox.com'))return String(url||'');
    u.searchParams.delete('dl');
    u.searchParams.set('raw','1');
    return u.toString();
  }catch(_){return String(url||'')}
}

function externalImageCandidates(url){
  if(!validHttpUrl(url))return[];
  const href=String(url).trim();
  const out=[];
  try{
    const u=new URL(href),host=u.hostname.toLowerCase();
    if(/\.(png|jpe?g|gif|webp|avif|svg)(?:[?#].*)?$/i.test(href))out.push(href);

    if(host.includes('drive.google.com')||host.includes('docs.google.com')){
      const id=googleDriveId(href);
      if(id){
        // Google Drive has more than one thumbnail route; try both.
        out.push(`https://drive.google.com/thumbnail?id=${encodeURIComponent(id)}&sz=w2000`);
        out.push(`https://lh3.googleusercontent.com/d/${encodeURIComponent(id)}=w1600`);
        out.push(`https://drive.google.com/uc?export=view&id=${encodeURIComponent(id)}`);
      }
    }

    if(host.includes('1drv.ms')||host.includes('onedrive.live.com')||host.includes('sharepoint.com')){
      const token=oneDriveShareToken(href);
      if(token){
        out.push(`https://api.onedrive.com/v1.0/shares/u!${token}/root/thumbnails/0/large/content`);
        out.push(`https://api.onedrive.com/v1.0/shares/u!${token}/root/thumbnails/0/medium/content`);
      }
    }

    if(host.includes('dropbox.com')){
      const raw=dropboxRawUrl(href);
      if(/\.(png|jpe?g|gif|webp|avif|svg)(?:[?#].*)?$/i.test(raw))out.push(raw);
    }
  }catch(_){}

  return [...new Set(out)];
}

function externalPdfCandidates(url){
  if(!validHttpUrl(url))return[];
  const href=String(url).trim();
  const out=[];
  try{
    const u=new URL(href),host=u.hostname.toLowerCase();

    if(/\.pdf(?:[?#].*)?$/i.test(href))out.push(href);

    if(host.includes('drive.google.com')||host.includes('docs.google.com')){
      const id=googleDriveId(href);
      if(id){
        out.push(`https://drive.google.com/uc?export=download&id=${encodeURIComponent(id)}`);
        out.push(`https://drive.usercontent.google.com/download?id=${encodeURIComponent(id)}&export=download&authuser=0&confirm=t`);
      }
    }

    if(host.includes('1drv.ms')||host.includes('onedrive.live.com')||host.includes('sharepoint.com')){
      const token=oneDriveShareToken(href);
      if(token)out.push(`https://api.onedrive.com/v1.0/shares/u!${token}/root/content`);
      if(/\.pdf(?:[?#].*)?$/i.test(href))out.push(href);
    }

    if(host.includes('dropbox.com')){
      const raw=dropboxRawUrl(href);
      out.push(raw);
    }

    if(!out.length && (/pdf/i.test(u.pathname)||u.searchParams.get('download')==='1'||u.searchParams.get('dl')==='1')){
      out.push(href);
    }
  }catch(_){}

  return [...new Set(out)];
}

function probeImage(url,timeoutMs=7000){
  return new Promise(resolve=>{
    let done=false;
    const img=new Image();
    const finish=v=>{if(done)return;done=true;clearTimeout(timer);resolve(v)};
    const timer=setTimeout(()=>finish(false),timeoutMs);
    img.referrerPolicy='no-referrer';
    img.onload=()=>finish((img.naturalWidth||0)>=32&&(img.naturalHeight||0)>=32);
    img.onerror=()=>finish(false);
    img.src=url;
  });
}

async function renderPdfFirstPage(url){
  if(!window.pdfjsLib||!validHttpUrl(url))return'';
  let doc=null;
  try{
    doc=await pdfjsLib.getDocument({
      url,
      withCredentials:false,
      disableAutoFetch:true,
      disableStream:false
    }).promise;
    const page=await doc.getPage(1);
    let viewport=page.getViewport({scale:1.35});
    if(viewport.width>1200){
      viewport=page.getViewport({scale:1.35*(1200/viewport.width)});
    }
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{alpha:false});
    canvas.width=Math.max(1,Math.round(viewport.width));
    canvas.height=Math.max(1,Math.round(viewport.height));
    ctx.fillStyle='#fff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    await page.render({canvasContext:ctx,viewport}).promise;
    return canvas.toDataURL('image/jpeg',0.9);
  }catch(e){
    console.debug('[Library V2.5] PDF cover fallback failed',url,e?.message||e);
    return'';
  }finally{
    try{await doc?.destroy?.()}catch(_){}
  }
}

async function resolveExternalCover(url,{force=false}={}){
  const key=String(url||'').trim();
  if(!key||!validHttpUrl(key))return'';

  if(force){
    externalCoverCache.delete(key);
    externalCoverPending.delete(key);
  }
  if(externalCoverCache.has(key))return externalCoverCache.get(key)||'';
  if(externalCoverPending.has(key))return externalCoverPending.get(key);

  const job=(async()=>{
    // 1) Provider/public thumbnail candidates.
    for(const candidate of externalImageCandidates(key)){
      if(await probeImage(candidate)){
        externalCoverCache.set(key,candidate);
        return candidate;
      }
    }

    // 2) PDF first page via PDF.js — covers direct PDF, Dropbox,
    //    Google Drive download route, OneDrive and SharePoint share links.
    for(const candidate of externalPdfCandidates(key)){
      const data=await renderPdfFirstPage(candidate);
      if(data){
        externalCoverCache.set(key,data);
        return data;
      }
    }

    externalCoverCache.set(key,'');
    return'';
  })();

  externalCoverPending.set(key,job);
  try{return await job}
  finally{externalCoverPending.delete(key)}
}

function resolvedCoverHtml(item,variant='card'){
  if(item?.cover_path){
    return`<div class="cover-stack"><img src="${coverUrl(item.cover_path)}" alt="${esc(item?.title||'book')}"></div>`;
  }
  const url=String(item?.external_url||'').trim();

async function hydrateExternalCovers(root=document){
  const slots=[...root.querySelectorAll?.('.external-cover-slot[data-external-cover-url]')||[]];
  for(const slot of slots){
    if(slot.dataset.coverResolved==='1'||slot.dataset.coverLoading==='1')continue;
    slot.dataset.coverLoading='1';
    slot.classList.add('external-cover-busy');
    const url=slot.dataset.externalCoverUrl||'';
    const src=await resolveExternalCover(url);
    if(!slot.isConnected)continue;
    slot.classList.remove('external-cover-busy');
    slot.dataset.coverLoading='0';
    slot.dataset.coverResolved='1';
    if(src){
      slot.innerHTML=`<img src="${esc(src)}" alt="External cover" loading="lazy">`;
    }
  }
}

function dataUrlToFile(dataUrl,name='auto-cover.jpg'){
  const [head,body]=String(dataUrl||'').split(',');
  if(!head||!body)return null;
  const mime=(head.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
  const bytes=atob(body);
  const arr=new Uint8Array(bytes.length);
  for(let i=0;i<bytes.length;i++)arr[i]=bytes.charCodeAt(i);
  return new File([arr],name,{type:mime,lastModified:Date.now()});
}

async function remoteImageToFile(url,name='auto-cover.jpg'){
  if(!validHttpUrl(url))return null;
  try{
    const r=await fetch(url,{mode:'cors',credentials:'omit',cache:'no-store'});
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const blob=await r.blob();
    if(!blob.type.startsWith('image/'))return null;
    return new File([blob],name,{type:blob.type,lastModified:Date.now()});
  }catch(_){return null}
}

async function fetchExternalCoverIntoForm(f){
  const url=String(f?.elements?.external_url?.value||'').trim();
  if(!validHttpUrl(url)){
    return Swal.fire('ยังไม่มีลิงก์ไฟล์','กรุณาใส่ Google Drive / OneDrive / SharePoint / Dropbox / direct URL ก่อน','warning');
  }

  const status=document.getElementById('fetchExternalCoverStatus');
  if(status){status.className='cover-fetch-status';status.textContent=`กำลังดึงปกจาก ${externalProvider(url)}…`}

  Swal.fire({title:'กำลังดึงภาพปก',text:`กำลังตรวจ ${externalProvider(url)} และ PDF หน้าแรก`,allowOutsideClick:false,didOpen:()=>Swal.showLoading()});
  try{
    const src=await resolveExternalCover(url,{force:true});
    if(!src)throw new Error('ผู้ให้บริการไม่ส่ง thumbnail และไม่สามารถอ่านหน้าแรกของ PDF ผ่าน browser ได้');

    const live=document.getElementById('liveCover');
    if(live)live.innerHTML=`<div class="cover-stack"><img src="${esc(src)}" alt="Auto cover"></div>`;

    // If PDF.js generated a data URL, it can always become a real cover file.
    // For remote image URLs, try CORS fetch. If provider blocks copying,
    // the Library still displays the cover dynamically from the source URL.
    let file=null;
    if(src.startsWith('data:image/')){
      file=dataUrlToFile(src,`auto-cover-${Date.now()}.jpg`);
    }else{
      file=await remoteImageToFile(src,`auto-cover-${Date.now()}.jpg`);
    }

    S._generatedCoverFile=file||null;
    if(file){
      const name=document.getElementById('coverName');
      if(name)name.textContent=`Auto: ${file.name}`;
      if(status){
        status.className='cover-fetch-status ok';
        status.textContent='ดึงปกสำเร็จ · จะอัปโหลดเข้า Cover Library อัตโนมัติเมื่อกดบันทึก';
      }
    }else if(status){
      status.className='cover-fetch-status warn';
      status.textContent='ดึงปกสำเร็จสำหรับแสดงผล แต่ผู้ให้บริการไม่อนุญาตให้คัดลอกไฟล์ปกเข้าระบบ · Card ยังดึงปกจากลิงก์นี้ได้อัตโนมัติ';
    }

    Swal.close();
    toast('ดึงภาพปกจากลิงก์สำเร็จ');
  }catch(e){
    S._generatedCoverFile=null;
    Swal.close();
    if(status){status.className='cover-fetch-status bad';status.textContent=e?.message||String(e)}
    Swal.fire('ดึงภาพปกไม่ได้',e?.message||String(e),'error');
  }
}

async function readerToken(id){
  const {data:meta,error:metaError}=await sb.rpc('library_open_item',{p_item_id:id});
  if(metaError||!meta?.ok)throw new Error(metaError?.message||meta?.message||'ไม่สามารถเปิดหนังสือได้');

  const type=normalizeContentType(meta.content_type);
  const filePath=typeof meta.file_path==='string'?meta.file_path.trim():'';
  const externalUrl=typeof meta.external_url==='string'?meta.external_url.trim():'';

  // Local AreWarin PDF always has priority when available.
  if(filePath){
    const seconds=Math.max(30,Math.min(600,Number(meta.signed_url_seconds||90)));
    const {data:signed,error:signError}=await sb.storage
      .from('library-books')
      .createSignedUrl(filePath,seconds);

    if(signError||!signed?.signedUrl){
      throw new Error(signError?.message||'สร้างลิงก์อ่านหนังสือไม่สำเร็จ');
    }

    return{
      ...meta,
      reader_kind:'local-pdf',
      file_path:filePath,
      signed_url:signed.signedUrl
    };
  }

  // If there is no local PDF, allow supported external file links to open
  // inside AreWarin Library rather than forcing a new tab.
  if(externalUrl){
    const info=externalReaderInfo(externalUrl);
    if(info){
      return{
        ...meta,
        ...info,
        reader_kind:info.mode==='iframe'?'external-iframe':'external-pdf'
      };
    }
  }

  if(type==='sheet'){
    throw new Error('ลิงก์นี้ยังไม่รองรับการเปิดใน Reader กรุณากด “เปิดลิงก์” เพื่อเปิดต้นฉบับ');
  }

  if(type==='hybrid'){
    throw new Error('รายการนี้ยังไม่มี PDF ใน AreWarin Library และลิงก์ภายนอกไม่ใช่ไฟล์ที่ Reader รองรับ');
  }

  throw new Error('รายการนี้ถูกตั้งเป็น PDF แต่ไม่พบไฟล์ PDF ที่เชื่อมอยู่ กรุณาให้ Admin อัปโหลด PDF ใหม่');
}

function bindExternalReader(r){
  const frame=document.getElementById('externalReaderFrame');
  const loading=document.getElementById('externalReaderLoading');

  if(frame){
    frame.addEventListener('load',()=>loading?.classList.add('hidden'));
  }

  document.getElementById('closeReader').onclick=closeReader;
  document.getElementById('fullReader').onclick=()=>{
    const el=document.getElementById('reader');
    if(!document.fullscreenElement)el.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  document.getElementById('externalOpenOriginal').onclick=()=>{
    const target=r.original_url||r.external_url;
    if(validHttpUrl(target)){
      const a=document.createElement('a');
      a.href=target;
      a.target='_blank';
      a.rel='noopener noreferrer';
      document.body.appendChild(a);
      a.click();
      a.remove();
    }
  };

  document.getElementById('reader').oncontextmenu=e=>e.preventDefault();

  // Some providers block framing. Show a fallback after a short delay
  // instead of leaving the user on a blank loading state forever.
  setTimeout(()=>{
    if(!document.getElementById('reader'))return;
    if(loading&&!loading.classList.contains('hidden')){
      loading.innerHTML=`
        <div style="max-width:420px;text-align:center;padding:24px">
          <i class="fa-solid fa-file-circle-exclamation" style="font-size:26px;color:#718299"></i>
          <div style="margin-top:12px;font-weight:800;color:#25364d">กำลังรอ ${esc(r.provider||'ผู้ให้บริการ')} แสดงเอกสาร</div>
          <div style="font-size:9px;color:#718299;line-height:1.7;margin-top:7px">
            ถ้าไฟล์ไม่ปรากฏ อาจเกิดจากสิทธิ์การแชร์ของไฟล์
          </div>
          <button class="btn primary" id="externalFallbackOpen" style="margin-top:12px">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> เปิดต้นฉบับ
          </button>
        </div>`;
      document.getElementById('externalFallbackOpen')?.addEventListener('click',()=>{
        document.getElementById('externalOpenOriginal')?.click();
      });
    }
  },9000);
}

async function tryOpenExternalPdfWithPdfJs(d,id){
  const candidates=Array.isArray(d.pdf_candidates)?d.pdf_candidates.filter(validHttpUrl):[];
  let lastError=null;

  for(const url of candidates){
    try{
      S.reader={...d,item_id:id,signed_url:url};
      S.page=Math.max(1,Number(d.last_page||1));
      S.scale=1.2;
      S.fit='width';
      S.theme='light';
      app.insertAdjacentHTML('beforeend',readerHtml());
      bindReader();

      const task=pdfjsLib.getDocument({
        url,
        disableAutoFetch:false,
        disableStream:false,
        withCredentials:false
      });

      S.pdf=await task.promise;
      S.page=Math.min(S.page,S.pdf.numPages);
      document.getElementById('pageTotal').textContent=S.pdf.numPages;
      try{S.outline=await S.pdf.getOutline()||[]}catch(_){S.outline=[]}
      renderReaderSide();
      await renderPage();
      return true;
    }catch(e){
      lastError=e;
      document.getElementById('reader')?.remove();
      S.pdf=null;
      S.reader=null;
    }
  }

  console.debug('[Library V2.6] external PDF.js failed; using provider iframe fallback',lastError);
  return false;
}

async function openExternalReader(d,id){
  // Google Drive / Google Workspace preview is intentionally iframe-first.
  if(d.reader_kind==='external-iframe'){
    S.reader={...d,item_id:id};
    app.insertAdjacentHTML('beforeend',externalReaderHtml({
      ...d,
      reader_url:d.reader_url||d.iframe_url||d.original_url
    }));
    bindExternalReader(d);
    return;
  }

  // Dropbox / OneDrive / SharePoint / direct PDF:
  // try native AreWarin PDF.js reader first.
  if(d.reader_kind==='external-pdf'){
    const ok=await tryOpenExternalPdfWithPdfJs(d,id);
    if(ok)return;

    const iframeUrl=d.iframe_url||d.original_url;
    if(validHttpUrl(iframeUrl)){
      S.reader={...d,item_id:id};
      app.insertAdjacentHTML('beforeend',externalReaderHtml({
        ...d,
        reader_url:iframeUrl
      }));
      bindExternalReader(d);
      return;
    }
  }

  throw new Error('ไม่สามารถเปิดเอกสารภายนอกใน Reader ได้');
}

async function openReader(id){
  try{
    Swal.fire({
      title:'กำลังเตรียมหนังสือ',
      allowOutsideClick:false,
      didOpen:()=>Swal.showLoading(),
      showConfirmButton:false
    });

    const d=await readerToken(id);

    let state={ok:true,bookmarks:[],notes:[]};
    try{
      const stateRes=await sb.rpc('library_reader_state',{p_item_id:id});
      if(stateRes.data?.ok)state=stateRes.data;
    }catch(_){}

    Swal.close();
    S.readerState=state;

    if(d.reader_kind!=='local-pdf'){
      await openExternalReader(d,id);
      return;
    }

    S.reader={...d,item_id:id};
    S.page=Math.max(1,Number(d.last_page||1));
    S.scale=1.2;
    S.fit='width';
    S.theme='light';

    app.insertAdjacentHTML('beforeend',readerHtml());
    bindReader();

    const task=pdfjsLib.getDocument({
      url:d.signed_url,
      disableAutoFetch:false,
      disableStream:false
    });

    S.pdf=await task.promise;
    S.page=Math.min(S.page,S.pdf.numPages);
    document.getElementById('pageTotal').textContent=S.pdf.numPages;
    try{S.outline=await S.pdf.getOutline()||[]}catch(_){S.outline=[]}
    renderReaderSide();
    await renderPage();

  }catch(e){
    Swal.close();
    document.getElementById('reader')?.remove();
    Swal.fire({
      icon:'error',
      title:'เปิดหนังสือไม่ได้',
      html:`<div style="font-size:13px;line-height:1.65;color:#64748b">${esc(e?.message||'ไม่สามารถเปิดหนังสือได้')}</div>`,
      confirmButtonText:'ตกลง'
    });
  }
}
function bindReader(){document.getElementById('closeReader').onclick=closeReader;document.getElementById('prevPage').onclick=()=>goPage(S.page-1);document.getElementById('nextPage').onclick=()=>goPage(S.page+1);document.getElementById('pageJump').onchange=e=>goPage(Number(e.target.value||1));document.getElementById('zoomOut').onclick=()=>{S.fit='manual';S.scale=Math.max(.5,S.scale-.15);document.getElementById('fitMode').value='manual';renderPage()};document.getElementById('zoomIn').onclick=()=>{S.fit='manual';S.scale=Math.min(3,S.scale+.15);document.getElementById('fitMode').value='manual';renderPage()};document.getElementById('fitMode').onchange=e=>{S.fit=e.target.value;renderPage()};document.getElementById('themeMode').onchange=e=>{S.theme=e.target.value;applyReaderTheme()};document.getElementById('readerSideBtn').onclick=()=>{const side=document.getElementById('readerSide'),main=document.getElementById('readerMain');side.classList.toggle('hidden-side');main.classList.toggle('side-off')};document.getElementById('bookmarkPage').onclick=toggleCurrentBookmark;document.getElementById('notePage').onclick=()=>openNoteModal();document.getElementById('fullReader').onclick=()=>{const el=document.getElementById('reader');if(!document.fullscreenElement)el.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelectorAll('[data-rside]').forEach(x=>x.onclick=()=>{S.sideTab=x.dataset.rside;document.querySelectorAll('[data-rside]').forEach(y=>y.classList.toggle('active',y===x));renderReaderSide()});document.getElementById('reader').oncontextmenu=e=>e.preventDefault();window.addEventListener('keydown',readerKeys)}
function readerKeys(e){if(!document.getElementById('reader'))return;if((e.ctrlKey||e.metaKey)&&['s','p'].includes(e.key.toLowerCase())){e.preventDefault();toast('เอกสารนี้เปิดอ่านผ่าน AreWarin Library เท่านั้น','info');return}if(e.key==='ArrowLeft')goPage(S.page-1);if(e.key==='ArrowRight')goPage(S.page+1)}
function applyReaderTheme(){const b=document.getElementById('readerBody');if(!b)return;b.classList.remove('dark','sepia');if(S.theme!=='light')b.classList.add(S.theme)}
async function goPage(p){if(!S.pdf)return;S.page=Math.min(Math.max(1,Number(p||1)),S.pdf.numPages);await renderPage()}
async function renderPage(){if(!S.pdf)return;const page=await S.pdf.getPage(S.page),body=document.getElementById('readerBody'),canvas=document.getElementById('pdfCanvas'),wrap=document.getElementById('pageWrap'),load=document.getElementById('readerLoading'),ctx=canvas.getContext('2d');const base=page.getViewport({scale:1});let scale=S.scale;if(S.fit==='width'){scale=Math.max(.45,(body.clientWidth-55)/base.width)}else if(S.fit==='page'){scale=Math.max(.4,Math.min((body.clientWidth-55)/base.width,(body.clientHeight-55)/base.height))}S.scale=scale;const viewport=page.getViewport({scale});canvas.width=Math.floor(viewport.width);canvas.height=Math.floor(viewport.height);await page.render({canvasContext:ctx,viewport}).promise;load.classList.add('hidden');wrap.classList.remove('hidden');document.getElementById('pageJump').value=S.page;document.getElementById('pageTotal').textContent=S.pdf.numPages;const mark=`${S.reader.watermark||'AreWarin'} · ${new Date().toLocaleString('th-TH')}`.replace(/'/g,'');const svg=encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="340" height="190"><text x="15" y="95" transform="rotate(-25 170 95)" font-family="Arial" font-size="12" fill="#28496c">${mark.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</text></svg>`);document.getElementById('watermark').style.backgroundImage=`url("data:image/svg+xml,${svg}")`;await sb.rpc('library_progress_save',{p_item_id:S.reader.item_id,p_last_page:S.page,p_total_pages:S.pdf.numPages});const b=S.items.find(x=>x.id===S.reader.item_id);if(b){b.last_page=S.page;b.total_pages=S.pdf.numPages;b.progress_pct=Math.min(100,S.page/S.pdf.numPages*100);b.completed=b.progress_pct>=95}renderReaderSide();applyReaderTheme()}
async function resolveDest(dest){try{if(typeof dest==='string')dest=await S.pdf.getDestination(dest);if(!dest)return;const ref=dest[0],idx=await S.pdf.getPageIndex(ref);goPage(idx+1)}catch(_){}}
function flattenOutline(nodes,depth=0,out=[]){for(const n of nodes||[]){out.push({title:n.title||'หัวข้อ',dest:n.dest,depth});if(n.items?.length)flattenOutline(n.items,depth+1,out)}return out}
function renderReaderSide(){const root=document.getElementById('rsideBody');if(!root)return;if(S.sideTab==='toc'){const rows=flattenOutline(S.outline);root.innerHTML=rows.length?rows.map((x,i)=>`<div class="toc-row" data-toc="${i}" style="padding-left:${8+x.depth*11}px">${esc(x.title)}</div>`).join(''):'<div class="reader-loading" style="padding:30px 8px">PDF นี้ไม่มีสารบัญฝังไว้</div>';root.querySelectorAll('[data-toc]').forEach(x=>x.onclick=()=>resolveDest(rows[Number(x.dataset.toc)].dest));return}if(S.sideTab==='bookmarks'){const rows=S.readerState.bookmarks||[];root.innerHTML=rows.length?rows.map(x=>`<div class="mark-row" data-mark-page="${x.page_no}"><b>หน้า ${x.page_no}</b>${x.label?`<br>${esc(x.label)}`:''}</div>`).join(''):'<div class="reader-loading" style="padding:30px 8px">ยังไม่มี Bookmark</div>';root.querySelectorAll('[data-mark-page]').forEach(x=>x.onclick=()=>goPage(Number(x.dataset.markPage)));return}const notes=S.readerState.notes||[];root.innerHTML=notes.length?notes.map(x=>`<div class="note-row"><small>หน้า ${x.page_no}</small><p>${esc(x.note)}</p><div style="display:flex;gap:4px"><button class="btn" style="padding:4px 6px;font-size:7px" data-note-go="${x.page_no}">ไปหน้า</button><button class="btn red" style="padding:4px 6px;font-size:7px" data-note-del="${x.id}">ลบ</button></div></div>`).join(''):'<div class="reader-loading" style="padding:30px 8px">ยังไม่มี Note</div>';root.querySelectorAll('[data-note-go]').forEach(x=>x.onclick=()=>goPage(Number(x.dataset.noteGo)));root.querySelectorAll('[data-note-del]').forEach(x=>x.onclick=()=>deleteNote(x.dataset.noteDel))}
async function toggleCurrentBookmark(){const existing=(S.readerState.bookmarks||[]).find(x=>Number(x.page_no)===S.page);const {data,error}=await sb.rpc('library_toggle_bookmark',{p_item_id:S.reader.item_id,p_page:S.page,p_label:null});if(error||!data?.ok)return toast(error?.message||data?.message,'error');if(existing)S.readerState.bookmarks=S.readerState.bookmarks.filter(x=>x.id!==existing.id);else{const {data:state}=await sb.rpc('library_reader_state',{p_item_id:S.reader.item_id});S.readerState=state}toast(data.bookmarked?'Bookmark หน้านี้แล้ว':'นำ Bookmark ออก');renderReaderSide()}
function openNoteModal(note=null){modal(`Note · หน้า ${note?.page_no||S.page}`,`<div class="rnote-modal"><textarea id="readerNoteText" class="input" placeholder="เขียนโน้ตส่วนตัวสำหรับหน้านี้…">${esc(note?.note||'')}</textarea></div>`,`<button class="btn" onclick="closeModal()">ยกเลิก</button><button class="btn primary" id="saveReaderNote">บันทึก Note</button>`);document.getElementById('saveReaderNote').onclick=async()=>{const v=document.getElementById('readerNoteText').value.trim();if(!v)return toast('กรุณาเขียน Note','warning');const {data,error}=await sb.rpc('library_note_save',{p_item_id:S.reader.item_id,p_page:note?.page_no||S.page,p_note:v,p_note_id:note?.id||null});if(error||!data?.ok)return toast(error?.message||data?.message,'error');const {data:state}=await sb.rpc('library_reader_state',{p_item_id:S.reader.item_id});S.readerState=state;closeModal();S.sideTab='notes';document.querySelectorAll('[data-rside]').forEach(x=>x.classList.toggle('active',x.dataset.rside==='notes'));renderReaderSide();toast('บันทึก Note แล้ว')}}
async function deleteNote(id){const {data,error}=await sb.rpc('library_note_delete',{p_note_id:id});if(error||!data?.ok)return toast(error?.message||data?.message,'error');S.readerState.notes=S.readerState.notes.filter(x=>x.id!==id);renderReaderSide();toast('ลบ Note แล้ว')}
function closeReader(){window.removeEventListener('keydown',readerKeys);document.getElementById('reader')?.remove();try{S.pdf?.destroy?.()}catch(_){}S.pdf=null;S.reader=null;loadHome().then(render)}

function bindAdmin(){document.getElementById('logout').onclick=logout;document.getElementById('backLibrary').onclick=()=>{S.admin=false;render()};document.getElementById('adminToggle').onclick=()=>{S.admin=false;render()};document.querySelectorAll('[data-admin-tab]').forEach(x=>x.onclick=()=>{S.adminTab=x.dataset.adminTab;S.adminBook=null;render()});document.querySelectorAll('[data-admin-new-book]').forEach(x=>x.onclick=()=>{S.adminTab='books';S.adminBook=null;render()});document.querySelectorAll('[data-jump-admin]').forEach(x=>x.onclick=()=>{S.adminTab=x.dataset.jumpAdmin;render()});bindAdminPanel(S.adminTab)}

function bindBooksStudio(){const f=document.getElementById('bookForm');if(!f)return;S._generatedCoverFile=null;f.onsubmit=saveBook;document.getElementById('resetBook').onclick=()=>{S.adminBook=null;render()};document.querySelectorAll('[data-edit-book]').forEach(x=>x.onclick=()=>{S.adminBook=S.adminData.items.find(i=>i.id===x.dataset.editBook)||null;window.scrollTo({top:0,behavior:'smooth'});render()});document.querySelectorAll('[data-restore-book]').forEach(x=>x.onclick=async()=>{S.selected=new Set([x.dataset.restoreBook]);await runBulkAction('restore')});document.querySelectorAll('[data-select-book]').forEach(x=>x.onchange=()=>{x.checked?S.selected.add(x.dataset.selectBook):S.selected.delete(x.dataset.selectBook);syncSelected()});document.getElementById('selectAllBooks').onchange=e=>{document.querySelectorAll('[data-select-book]').forEach(x=>{x.checked=e.target.checked;x.checked?S.selected.add(x.dataset.selectBook):S.selected.delete(x.dataset.selectBook)});syncSelected()};document.getElementById('bulkAction').onchange=e=>document.getElementById('bulkCategory').classList.toggle('hidden',e.target.value!=='move_category');document.getElementById('runBulk').onclick=()=>runBulkAction();document.getElementById('adminBookSearch').oninput=filterAdminRows;document.getElementById('adminStatusFilter').onchange=filterAdminRows;setupTags(f);setupDrop('pdfDrop','bookPdf','pdfName',async file=>{f.elements.file_size.value=file.size;f.elements.file_sha256.value=await sha256(file);duplicateCheck(f)});setupDrop('coverDrop','bookCover','coverName',file=>previewLocalCover(file));document.getElementById('existingCover').onchange=e=>{f.elements.old_cover_path.value=e.target.value;updateLivePreview()};document.getElementById('bookCover').onchange=e=>{const file=e.target.files[0];if(file){S._generatedCoverFile=null;previewLocalCover(file)}};document.getElementById('bookPdf').onchange=async e=>{const file=e.target.files[0];if(file){document.getElementById('pdfName').textContent=file.name;f.elements.file_size.value=file.size;f.elements.file_sha256.value=await sha256(file);duplicateCheck(f)}};f.querySelectorAll('.live').forEach(x=>x.oninput=updateLivePreview);f.elements.category_id.onchange=updateLivePreview;f.elements.external_url && (f.elements.external_url.oninput=updateLivePreview);f.elements.external_label && (f.elements.external_label.oninput=updateLivePreview);f.elements.isbn.oninput=()=>{formatISBNInput(f.elements.isbn);duplicateCheck(f)};f.elements.title.onblur=()=>duplicateCheck(f);document.getElementById('contentType')?.addEventListener('change',()=>toggleSourceFields(f));document.getElementById('fetchExternalCover')?.addEventListener('click',()=>fetchExternalCoverIntoForm(f));document.getElementById('previewBook').onclick=()=>previewBookFromForm(f);document.querySelectorAll('[data-tag-del]').forEach(x=>x.onclick=()=>{const tags=readTags();S.adminBook={...bookFormData(),tags:tags.filter(t=>t!==x.dataset.tagDel)};render()});syncSelected();toggleSourceFields(f);updateLivePreview()}
function filterAdminRows(){const q=(document.getElementById('adminBookSearch').value||'').toLowerCase(),st=document.getElementById('adminStatusFilter').value;document.querySelectorAll('[data-admin-row]').forEach(r=>{r.style.display=(!q||r.dataset.search.includes(q))&&(!st||r.dataset.status===st)?'':'none'})}
function setupTags(f){const inp=document.getElementById('tagInput');inp.onkeydown=e=>{if((e.key==='Enter'||e.key===',')&&inp.value.trim()){e.preventDefault();const tags=readTags();const v=inp.value.trim().replace(/,$/,'');if(v&&!tags.includes(v)){const current=bookFormData();S.adminBook={...current,...formToMemory(f),tags:[...tags,v]};render()}}}}
function readTags(){return [...document.querySelectorAll('#tagEditor .tagchip')].map(x=>x.childNodes[0]?.textContent?.trim()).filter(Boolean)}
function formToMemory(f){const fd=new FormData(f);return {id:fd.get('id')||'',title:fd.get('title')||'',subtitle:fd.get('subtitle')||'',category_id:fd.get('category_id')||'',author:fd.get('author')||'',publisher:fd.get('publisher')||'',publication_year:fd.get('publication_year')||'',edition:fd.get('edition')||'',language:fd.get('language')||'th',isbn:fd.get('isbn')||'',description:fd.get('description')||'',file_path:fd.get('old_file_path')||'',cover_path:fd.get('old_cover_path')||'',file_sha256:fd.get('file_sha256')||'',file_size:fd.get('file_size')||'',content_type:fd.get('content_type')||'pdf',external_url:fd.get('external_url')||'',external_label:fd.get('external_label')||'เปิดลิงก์',audience:fd.get('audience')||'all',status:fd.get('status')||'draft',is_new:fd.get('is_new')==='on',new_until:fd.get('new_until')||'',featured:fd.get('featured')==='on',recommended:fd.get('recommended')==='on',sort_order:Number(fd.get('sort_order')||100),course_ids:fd.getAll('course_ids'),collection_ids:fd.getAll('collection_ids')}}
function setupDrop(dropId,inputId,nameId,callback){const d=document.getElementById(dropId),inp=document.getElementById(inputId);d.onclick=()=>inp.click();['dragenter','dragover'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add('drag')}));['dragleave','drop'].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove('drag')}));d.addEventListener('drop',async e=>{const file=e.dataTransfer.files[0];if(!file)return;const dt=new DataTransfer();dt.items.add(file);inp.files=dt.files;document.getElementById(nameId).textContent=file.name;await callback?.(file)})}
async function sha256(file){const b=await file.arrayBuffer(),hash=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(hash)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function formatISBNInput(el){el.value=el.value.replace(/[^0-9Xx-]/g,'').slice(0,20)}
function validISBN(v){const s=String(v||'').replace(/-/g,'').toUpperCase();if(!s)return true;if(/^\d{13}$/.test(s)){let sum=0;for(let i=0;i<12;i++)sum+=Number(s[i])*(i%2?3:1);return (10-sum%10)%10===Number(s[12])}if(/^\d{9}[\dX]$/.test(s)){let sum=0;for(let i=0;i<9;i++)sum+=(10-i)*Number(s[i]);sum+=s[9]==='X'?10:Number(s[9]);return sum%11===0}return false}
async function duplicateCheck(f){const box=document.getElementById('duplicateBox');if(!box)return;const title=f.elements.title.value.trim(),isbn=f.elements.isbn.value.trim(),hash=f.elements.file_sha256.value;if(isbn&&!validISBN(isbn)){box.innerHTML='<span class="import-bad"><i class="fa-solid fa-triangle-exclamation"></i> ISBN checksum ไม่ถูกต้อง</span>';return}if(!title)return;const {data,error}=await sb.rpc('library_admin_duplicate_check',{p_title:title,p_isbn:isbn||null,p_sha256:hash||null,p_exclude_id:f.elements.id.value||null});if(error)return;const d=data?.duplicates||[];box.innerHTML=d.length?`<span class="import-bad"><i class="fa-solid fa-copy"></i> พบข้อมูลที่อาจซ้ำ: ${d.map(x=>esc(x.title)).join(', ')}</span>`:'<span class="import-ok"><i class="fa-solid fa-circle-check"></i> ยังไม่พบข้อมูลซ้ำ</span>'}
function previewLocalCover(file){const url=URL.createObjectURL(file),box=document.getElementById('liveCover');box.innerHTML=`<div class="cover-stack"><img src="${url}"></div>`}
function updateLivePreview(){const f=document.getElementById('bookForm');if(!f)return;document.getElementById('liveTitle').textContent=f.elements.title.value||'ชื่อหนังสือ';document.getElementById('liveSub').textContent=f.elements.subtitle.value||f.elements.description.value||'รายละเอียดหนังสือจะแสดงตรงนี้';const c=S.adminData.categories.find(x=>x.id===f.elements.category_id.value);document.getElementById('liveCat').textContent=c?.name||'หมวดหมู่';if(!document.getElementById('bookCover').files[0]&&!S._generatedCoverFile){const p=document.getElementById('existingCover').value||f.elements.old_cover_path.value;const tmp={title:f.elements.title.value||'',category_name:c?.name||'AreWarin Library',cover_path:p||'',external_url:f.elements.external_url?.value||'',content_type:f.elements.content_type?.value||'pdf'};document.getElementById('liveCover').innerHTML=resolvedCoverHtml(tmp,'preview');setTimeout(()=>hydrateExternalCovers(document.getElementById('liveCover')),0)}}
function previewBookFromForm(f){const m=formToMemory(f),tags=readTags();modal('Preview ก่อน Publish',`<div class="detail-grid"><div class="detail-cover">${document.getElementById('liveCover').innerHTML}</div><div class="detail-meta"><div><span class="pill ${contentTypeOf(m)==='sheet'?'sheet':contentTypeOf(m)==='hybrid'?'hybrid':'pdf'}">${contentTypeLabel(contentTypeOf(m))}</span> <span class="pill ${m.is_new?'new':''}">${m.is_new?'NEW':'PREVIEW'}</span> ${m.featured?'<span class="pill featured">FEATURED</span>':''}</div><h2>${esc(m.title||'ยังไม่ได้ระบุชื่อ')}</h2><div class="muted">${esc(m.subtitle||'')}</div><p>${esc(m.description||'ยังไม่มีคำอธิบาย')}</p><div class="tags">${tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><div class="detail-info"><div class="info"><small>Author</small><b>${esc(m.author||'—')}</b></div><div class="info"><small>ISBN</small><b>${esc(m.isbn||'—')}</b></div><div class="info"><small>Status</small><b>${esc(m.status)}</b></div></div></div></div>`,`<button class="btn" onclick="closeModal()">ปิด Preview</button>`)}
function normalizeContentType(v){v=String(v||'pdf').toLowerCase();return ['pdf','sheet','hybrid'].includes(v)?v:'pdf'}
function contentTypeOf(b){const explicit=normalizeContentType(b?.content_type||'');if(b?.content_type)return explicit;if(b?.external_url&&b?.file_path)return'hybrid';if(b?.external_url)return'sheet';return'pdf'}
function contentTypeLabel(t){t=normalizeContentType(t);return t==='sheet'?'LINK':t==='hybrid'?'PDF + LINK':'PDF'}
function validHttpUrl(v){try{const u=new URL(String(v||''));return u.protocol==='https:'||u.protocol==='http:'}catch(_){return false}}
function toggleSourceFields(f){if(!f)return;const type=normalizeContentType(f.elements.content_type?.value||'pdf');document.getElementById('pdfSourceField')?.classList.toggle('hidden',type==='sheet');document.getElementById('sheetSourceField')?.classList.toggle('hidden',type==='pdf')}
async function openSheetLink(id,url){const target=String(url||'').trim();if(!validHttpUrl(target))return Swal.fire('เปิดลิงก์ไม่ได้','ไม่พบ URL ภายนอกที่ถูกต้อง','error');const win=window.open('about:blank','_blank');if(win)win.opener=null;try{const {data,error}=await sb.rpc('library_open_item',{p_item_id:id});if(error||!data?.ok)throw new Error(error?.message||data?.message||'No access');const finalUrl=String(data.external_url||target).trim();if(!validHttpUrl(finalUrl))throw new Error('ลิงก์ภายนอกไม่ถูกต้อง');if(win)win.location.replace(finalUrl);else{const a=document.createElement('a');a.href=finalUrl;a.target='_blank';a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove()}}catch(e){try{win?.close()}catch(_){}Swal.fire('เปิดลิงก์ไม่ได้',e.message,'error')}}
function cleanName(n){return String(n||'file').replace(/[^A-Za-z0-9._-]+/g,'-').slice(-120)}
async function uploadFile(bucket,file,folder){const path=`${folder}/${crypto.randomUUID()}-${cleanName(file.name)}`;const {error}=await sb.storage.from(bucket).upload(path,file,{upsert:false,contentType:file.type});if(error)throw error;return path}
async function saveBook(e){e.preventDefault();const f=e.currentTarget,fd=new FormData(f);try{if(fd.get('isbn')&&!validISBN(fd.get('isbn')))throw new Error('ISBN checksum ไม่ถูกต้อง');const contentType=normalizeContentType(fd.get('content_type')),externalUrl=String(fd.get('external_url')||'').trim(),externalLabel=String(fd.get('external_label')||'').trim()||'เปิดลิงก์';let filePath=fd.get('old_file_path')||'',coverPath=document.getElementById('existingCover').value||fd.get('old_cover_path')||'';const pdf=document.getElementById('bookPdf').files[0],cover=document.getElementById('bookCover').files[0]||S._generatedCoverFile||null;let hash=fd.get('file_sha256')||'',size=Number(fd.get('file_size')||0);if(contentType!=='pdf'&&contentType!=='hybrid'&&contentType!=='sheet')throw new Error('ประเภทแหล่งเนื้อหาไม่ถูกต้อง');if((contentType==='sheet'||contentType==='hybrid')&&!validHttpUrl(externalUrl))throw new Error('กรุณาใส่ลิงก์ภายนอกเป็น https:// หรือ http:// ที่ถูกต้อง');if(pdf){hash=hash||await sha256(pdf);size=pdf.size;const {data:dup}=await sb.rpc('library_admin_duplicate_check',{p_title:fd.get('title'),p_isbn:fd.get('isbn')||null,p_sha256:hash,p_exclude_id:fd.get('id')||null});if((dup?.duplicates||[]).some(x=>x.same_file)){const ok=await Swal.fire({title:'พบ PDF เดิมในระบบ',text:'ไฟล์นี้มี SHA-256 ซ้ำกับหนังสืออื่น ต้องการบันทึกต่อหรือไม่?',icon:'warning',showCancelButton:true,confirmButtonText:'บันทึกต่อ',cancelButtonText:'ยกเลิก'});if(!ok.isConfirmed)return}filePath=await uploadFile('library-books',pdf,'books')}if(cover)coverPath=await uploadFile('library-covers',cover,'covers');if(contentType==='pdf'&&!filePath)throw new Error('กรุณาเลือกไฟล์ PDF');if(contentType==='hybrid'&&!filePath)throw new Error('โหมด PDF + ลิงก์ไฟล์ ต้องมีไฟล์ PDF');if(contentType==='sheet'){filePath='';hash='';size=0}const payload={id:fd.get('id')||null,title:fd.get('title'),subtitle:fd.get('subtitle'),category_id:fd.get('category_id')||null,author:fd.get('author'),publisher:fd.get('publisher'),publication_year:fd.get('publication_year')?Number(fd.get('publication_year')):null,edition:fd.get('edition'),language:fd.get('language'),isbn:fd.get('isbn'),description:fd.get('description'),tags:readTags(),content_type:contentType,external_url:(contentType==='sheet'||contentType==='hybrid')?externalUrl:null,external_label:(contentType==='sheet'||contentType==='hybrid')?externalLabel:null,file_path:filePath||null,cover_path:coverPath,file_sha256:hash||null,file_size:size||null,audience:fd.get('audience'),is_new:fd.get('is_new')==='on',new_until:fd.get('new_until')||null,featured:fd.get('featured')==='on',recommended:fd.get('recommended')==='on',status:fd.get('status'),sort_order:Number(fd.get('sort_order')||100),course_ids:fd.getAll('course_ids'),collection_ids:fd.getAll('collection_ids')};const {data,error}=await sb.rpc('library_admin_save_item',{p_payload:payload});if(error||!data?.ok)throw new Error(error?.message||data?.message);toast(contentType==='sheet'?'บันทึกลิงก์ภายนอกแล้ว':'บันทึกรายการแล้ว');S._generatedCoverFile=null;S.adminBook=null;await loadAdmin();await loadHome();render()}catch(e){Swal.fire('บันทึกไม่สำเร็จ',e.message,'error')}}
async function runBulkAction(force=null){const action=force||document.getElementById('bulkAction')?.value;if(!action)return toast('เลือก Bulk action','warning');const value=action==='move_category'?document.getElementById('bulkCategory').value:null;if(action==='move_category'&&!value)return toast('เลือกหมวดหมู่','warning');if(['soft_delete','archive'].includes(action)){const c=await Swal.fire({title:'ยืนยันการดำเนินการ',text:`${action} ${S.selected.size} รายการ`,icon:'warning',showCancelButton:true,confirmButtonText:'ยืนยัน'});if(!c.isConfirmed)return}const {data,error}=await sb.rpc('library_admin_bulk_action',{p_item_ids:[...S.selected],p_action:action,p_value:value});if(error||!data?.ok)return Swal.fire('ดำเนินการไม่ได้',error?.message||data?.message,'error');toast(`อัปเดต ${data.affected||0} รายการ`);await loadAdmin();await loadHome();render()}

function boolish(v){return ['yes','true','1','y','ใช่'].includes(String(v||'').trim().toLowerCase())}
function splitList(v){return String(v||'').split(',').map(x=>x.trim()).filter(Boolean)}
function excelDate(v){if(!v)return null;if(typeof v==='number'){const d=XLSX.SSF.parse_date_code(v);if(d)return `${d.y}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}const s=String(v).trim();return /^\d{4}-\d{2}-\d{2}$/.test(s)?s:null}
async function previewImport(){const ex=document.getElementById('importExcel').files[0],pdfs=[...document.getElementById('importPdfs').files],covers=[...document.getElementById('importCovers').files],box=document.getElementById('importPreview'),st=document.getElementById('importStatus');if(!ex)return toast('กรุณาเลือกไฟล์ Excel','warning');try{const buf=await ex.arrayBuffer(),wb=XLSX.read(buf,{type:'array'}),sheet=wb.Sheets['LibraryImport']||wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:true}).filter(r=>r.title),pm=new Map(pdfs.map(f=>[f.name,f])),cm=new Map(covers.map(f=>[f.name,f]));S.importRows=rows.map((r,i)=>{const errors=[],warnings=[];const title=String(r.title||'').trim(),pdf=String(r.pdf_file||'').trim(),cover=String(r.cover_file||'').trim(),cat=String(r.category_code||'').trim().toUpperCase(),aud=String(r.audience||'all').trim().toLowerCase(),status=String(r.status||'draft').trim().toLowerCase(),isbn=String(r.isbn||'').trim();if(!title)errors.push('ไม่มี title');if(!pdf||!pm.has(pdf))errors.push(`ไม่พบ PDF: ${pdf||'—'}`);if(cover&&!cm.has(cover))errors.push(`ไม่พบ cover: ${cover}`);if(cat&&!S.adminData.categories.some(c=>c.code.toUpperCase()===cat))warnings.push(`ไม่พบ category ${cat} → จะเป็นไม่ระบุ`);if(!['all','students','staff'].includes(aud))errors.push('audience ไม่ถูกต้อง');if(!['draft','published','hidden','archived'].includes(status))errors.push('status ไม่ถูกต้อง');if(isbn&&!validISBN(isbn))warnings.push('ISBN checksum น่าสงสัย');const duplicate=S.adminData.items.find(x=>!x.deleted_at&&((isbn&&x.isbn===isbn)||x.title.trim().toLowerCase()===title.toLowerCase()));if(duplicate)warnings.push(`อาจซ้ำกับ: ${duplicate.title}`);return {row:i+2,raw:r,title,pdf,cover,errors,warnings,valid:errors.length===0}});const good=S.importRows.filter(x=>x.valid).length,bad=S.importRows.length-good;st.innerHTML=`พบ ${S.importRows.length} แถว · <span class="import-ok">ผ่าน ${good}</span> · <span class="import-bad">Error ${bad}</span>`;box.innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Row</th><th>Title</th><th>PDF</th><th>Category</th><th>Status</th><th>ผลตรวจ</th></tr></thead><tbody>${S.importRows.map(x=>`<tr><td>${x.row}</td><td><b>${esc(x.title)}</b></td><td>${esc(x.pdf)}</td><td>${esc(x.raw.category_code||'—')}</td><td>${esc(x.raw.status||'draft')}</td><td>${x.errors.length?`<span class="import-bad">${esc(x.errors.join(' · '))}</span>`:`<span class="import-ok">ผ่าน</span>`}${x.warnings.length?`<br><span style="color:#9a6500">${esc(x.warnings.join(' · '))}</span>`:''}</td></tr>`).join('')}</tbody></table></div>`;document.getElementById('runImport').disabled=good===0}catch(e){box.innerHTML='';st.innerHTML=`<span class="import-bad">${esc(e.message)}</span>`}}
async function runImportV2(){const valid=S.importRows.filter(x=>x.valid);if(!valid.length)return toast('ไม่มีรายการที่ผ่าน Validation','warning');const pdfs=[...document.getElementById('importPdfs').files],covers=[...document.getElementById('importCovers').files],pm=new Map(pdfs.map(f=>[f.name,f])),cm=new Map(covers.map(f=>[f.name,f])),st=document.getElementById('importStatus'),payload=[];try{document.getElementById('runImport').disabled=true;for(let i=0;i<valid.length;i++){const x=valid[i],r=x.raw,pdf=pm.get(x.pdf),cover=x.cover?cm.get(x.cover):null;st.innerHTML=`กำลังอัปโหลด ${i+1}/${valid.length}: <b>${esc(x.title)}</b>`;const hash=await sha256(pdf),fp=await uploadFile('library-books',pdf,'books'),cp=cover?await uploadFile('library-covers',cover,'covers'):'';payload.push({title:x.title,subtitle:r.subtitle||'',category_code:String(r.category_code||'').trim().toUpperCase(),author:r.author||'',publisher:r.publisher||'',publication_year:r.publication_year?Number(r.publication_year):null,edition:r.edition||'',language:r.language||'th',isbn:r.isbn||'',description:r.description||'',tags:splitList(r.tags),file_path:fp,cover_path:cp,file_sha256:hash,file_size:pdf.size,audience:r.audience||'all',is_new:boolish(r.is_new),new_until:excelDate(r.new_until),featured:boolish(r.featured),recommended:boolish(r.recommended),status:r.status||'draft',sort_order:r.sort_order?Number(r.sort_order):100,collection_codes:splitList(r.collection_codes),course_names:splitList(r.course_names)})}const {data,error}=await sb.rpc('library_admin_bulk_upsert_v2',{p_rows:payload});if(error||!data?.ok)throw new Error(error?.message||data?.message);st.innerHTML=`<b class="import-ok">Import เสร็จ</b> · สำเร็จ ${data.success} · Error ${data.errors}`;document.getElementById('importPreview').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>Row</th><th>Title</th><th>Result</th></tr></thead><tbody>${(data.results||[]).map(r=>`<tr><td>${r.row}</td><td>${esc(r.title||'')}</td><td>${r.ok?'<span class="import-ok">สำเร็จ</span>':`<span class="import-bad">${esc(r.message)}</span>`}</td></tr>`).join('')}</tbody></table></div>`;toast('Excel Import เสร็จแล้ว');await loadAdmin();await loadHome()}catch(e){st.innerHTML=`<span class="import-bad">${esc(e.message)}</span>`}finally{document.getElementById('runImport').disabled=false}}
